# La règle d'or du §16 de docs/ARCHITECTURE.md, rendue opposable :
# « une évolution n'est finie que quand les six suites sont vertes » — et,
# depuis le 13 août, quand le gardien et ESLint le sont aussi. L'ordre compte :
# `npm test` passe les suites d'abord. Le sens se contrôle avant la forme.
name: tests

on:
  push:
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # jsdom et ESLint sont les seules dépendances, et toutes deux de DEV : le
      # livrable, lui, n'en a aucune. `ci` les pose à l'identique du lock.
      - run: npm ci

      # Les six suites, puis le gardien, puis ESLint. Pas de build, pas de
      # service, pas de base à monter.
      - run: npm test
