<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAvocat — tranche verticale</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2b3440;
    --txt:#d7dde5; --muted:#8b97a6; --accent:#6fb3d6; --lock:#7bbf8a; --warn:#d6a96f;
    --prive:#3a3242; --transmis:#23506e;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    /* Les couleurs de dimension. Fixes, attribuées par RANG dans
       JEU.dimensions — jamais par la pertinence de l'empan (invariant du
       §2.3 de docs/ARCHITECTURE.md). */
    --dim0:#7fb3d5; --dim1:#d99a9a; --dim2:#9dc98c; --dim3:#c9ab6a; --dim4:#b79ad6; --dim5:#7fc9c1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.55}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline}
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.3px}
  header .sub{color:var(--muted);font-size:13px}
  header .spacer{flex:1}
  header button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  header button:hover{border-color:var(--accent)}
  .wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:16px 20px;max-width:1400px;margin:0 auto}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .col > h2{margin:0;padding:11px 14px;font-size:13px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
  .col > h2 .tag{font-size:10.5px;letter-spacing:.4px;border-radius:4px;padding:1px 6px;font-weight:500}
  .tag.prive{background:var(--prive);color:#cbb9dc}
  .tag.transmis{background:#12324a;color:#bfe0f2;border:1px solid var(--transmis)}
  .body{padding:12px 14px;overflow-y:auto;max-height:72vh}
  .col.demi .body{max-height:34vh}
  @media (max-width:1100px){
    .wrap{grid-template-columns:1fr}
    .cloture{grid-column:1 !important}
    .body,.col.demi .body{max-height:44vh}
  }
  /* --- canal --- */
  .msg{margin-bottom:14px}
  .msg .who{font-size:12px;color:var(--muted);margin-bottom:3px}
  .msg .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .msg.ia .who{color:#5b8aa6}
  .msg.ia .bubble{background:#0f2230;border-color:var(--transmis);font-family:var(--mono);font-size:13px;color:#bfe0f2}
  .attach{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;padding:6px 10px;
    background:#12324a;border:1px solid var(--transmis);border-radius:8px;color:#bfe0f2;cursor:pointer;font-size:13px}
  .attach:hover{border-color:var(--accent)}
  .attach.seen{opacity:.6}
  /* --- zones --- */
  .zone{margin-bottom:16px}
  .zone .ztitle{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .aide{color:var(--muted);font-size:12px;margin-top:8px;font-style:italic}
  /* --- les empans dans le texte d'une pièce --- */
  .piecetexte{line-height:1.9}
  .empan{border-bottom:2px solid var(--dc,var(--muted));border-radius:2px;padding:1px 2px;cursor:pointer;
    background:color-mix(in srgb, var(--dc,#888) 12%, transparent)}
  .empan:hover{background:color-mix(in srgb, var(--dc,#888) 28%, transparent)}
  .empan.pris{background:color-mix(in srgb, var(--dc,#888) 30%, transparent);font-weight:600}
  .empan .sig{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .legende{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;font-size:11.5px;color:var(--muted)}
  .legende span{border-bottom:2px solid var(--dc);padding-bottom:1px}
  /* --- mémoire : une seule liste, qui sert AUSSI de clavier au composeur --- */
  .dimgrp{margin-bottom:9px}
  .dimgrp .dnom{font-size:11px;color:var(--dc,var(--muted));text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
  .mchip{display:flex;align-items:stretch;margin:3px 0;background:var(--panel2);
    border:1px solid var(--line);border-left:3px solid var(--dc,var(--line));border-radius:6px;overflow:hidden}
  .mchip:hover{border-color:var(--accent)}
  .mchip .corps{flex:1;text-align:left;background:none;border:none;color:var(--txt);
    padding:6px 9px;cursor:pointer;font:inherit;font-size:13px;line-height:1.4}
  .mchip .corps:disabled{cursor:default;opacity:.55}
  .mchip .nom{display:block}
  .mchip .cit{display:block;font-size:11.5px;color:var(--muted);font-style:italic;margin-top:2px}
  .mchip .sig{display:block;font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
  .mchip .del{background:none;border:none;border-left:1px solid var(--line);color:var(--muted);
    font-size:13px;padding:0 9px;cursor:pointer;align-self:stretch}
  .mchip .del:hover{color:#d99a9a}
  /* --- composeur --- */
  .compo{border:1px dashed var(--line);border-radius:8px;padding:11px;background:#141a21}
  .phrase{min-height:34px;font-size:14px;line-height:1.7;margin-bottom:9px}
  .phrase .bl{border-bottom:1px solid var(--line);padding:0 2px}
  .phrase .bl.terme{border-bottom:2px solid var(--dc,var(--accent))}
  .phrase .trou{color:var(--muted);font-style:italic}
  .offre{display:flex;flex-direction:column;gap:4px}
  .offre .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
  .bbloc{text-align:left;background:#20303f;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:6px 9px;cursor:pointer;font-size:13px}
  .bbloc:hover{border-color:var(--accent)}
  .compo .barre{display:flex;gap:6px;margin-bottom:8px}
  .compo .barre button{background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:5px;padding:3px 9px;cursor:pointer;font-size:12px}
  .compo .barre button:hover{border-color:var(--accent);color:var(--txt)}
  .refus{color:#d99a9a;font-size:12.5px;margin-top:8px}
  /* la phrase close, qui attend SUR PLACE : l'envoi ne change pas de colonne */
  .compo.prete{border-style:solid;border-color:var(--transmis);background:#111c25}
  .phrase.close{font-size:14.5px;line-height:1.6;color:var(--txt)}
  .compo .barre .envoi{background:#12324a;color:#bfe0f2;border-color:var(--transmis);font-size:12.5px;padding:4px 12px}
  .compo .barre .envoi:hover{border-color:var(--accent);color:#eaf4fb}
  .bbloc.suite{background:#25313d;border-left:3px solid var(--transmis)}
  /* --- plaidoirie --- */
  .liste{list-style:none;padding:0;margin:0}
  .liste li{font-size:13px;padding:8px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
  .liste li:first-child{border-top:none}
  .liste li .txt{flex:1;line-height:1.45}
  .liste li .up{background:#12324a;color:#bfe0f2;border:1px solid var(--transmis);border-radius:5px;
    padding:3px 8px;cursor:pointer;font-size:12px;white-space:nowrap}
  .liste li .up:hover{border-color:var(--accent)}
  .liste li .sent{color:#5b8aa6;font-size:12px;white-space:nowrap}
  .plaid li{border-left:3px solid var(--transmis);padding-left:9px}
  .plaid li .contre{display:block;font-size:11px;color:var(--muted);font-family:var(--mono)}
  /* répétition de plaidoirie */
  .repet{border:1px dashed #5a3a3a;border-radius:8px;padding:11px;background:#1a1416;margin-bottom:14px}
  .repet .rtitle{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .repet .rnote{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:5px 0}
  .repet .rnote .txt{flex:1}
  .repet .rnote.vide{font-style:italic}
  .repet .up{background:#12324a;color:#bfe0f2;border:1px solid var(--transmis);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px}
  .repet .btn{margin-top:8px;width:100%;background:#20303f;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px;cursor:pointer}
  .repet .btn:hover{border-color:var(--accent)}
  /* --- clôture / fin --- */
  .cloture{grid-column:1/4;text-align:center;padding:4px 0 20px}
  .cloture button{background:#2a1c1c;color:#e0b7b7;border:1px solid #5a3a3a;border-radius:8px;
    padding:10px 20px;cursor:pointer;font-size:14px}
  .cloture button:disabled{opacity:.4;cursor:not-allowed}
  .cloture .hint{color:var(--muted);font-size:12px;margin-top:6px}
  /* modal générique */
  .overlay{position:fixed;inset:0;background:rgba(6,8,11,.72);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:620px;width:100%;
    max-height:82vh;overflow-y:auto;padding:20px}
  .modal h3{margin:0 0 8px;font-size:16px}
  .modal .close{float:right;cursor:pointer;color:var(--muted);border:none;background:none;font-size:18px}
  .modal .btnrow{margin-top:10px}
  .modal .btnrow button{width:100%;background:#20303f;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:8px;cursor:pointer}
  .fin h3{font-size:18px}
  .fin .verdict{font-family:var(--mono);color:var(--warn);margin:4px 0 14px}
  small.note{color:var(--muted)}
  code{font-family:var(--mono);color:var(--accent)}
  /* --- l'index du dossier --- */
  .dossier{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
  .dchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;
    border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:4px 8px;cursor:pointer;color:var(--txt)}
  .dchip:hover{border-color:var(--accent)}
  .dchip.vu{opacity:.55}
  .dchip.regle{border-color:#4a4030;color:var(--warn)}
  .zcount{float:right;font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
  .panne{background:#2a1c1c;color:#e0b7b7;border:1px solid #5a3a3a;border-radius:8px;padding:12px;margin:16px 20px}
</style>
</head>
<body>
<header>
  <h1>IAvocat</h1>
  <span class="sub">tranche verticale — l'affaire Kessler</span>
  <span class="sub" id="srcContenu" style="opacity:.6"></span>
  <span class="spacer"></span>
  <button onclick="openManuels()">Manuels</button>
</header>

<div class="wrap">
  <section class="col">
    <h2>Le canal — l'avocat</h2>
    <div class="body" id="canal"></div>
  </section>
  <section class="col">
    <h2>Ce que tu retiens et ce que tu écris <span class="tag prive">privé</span></h2>
    <div class="body" id="atelier"></div>
  </section>
  <section class="col">
    <h2>Le plan de plaidoirie <span class="tag transmis">transmis</span></h2>
    <div class="body" id="plan"></div>
  </section>
  <div class="cloture">
    <button id="btnCloture" onclick="cloturer()" disabled>Clôturer l'instruction</button>
    <div class="hint" id="clotureHint">Maître Auber attend encore quelque chose.</div>
    <button id="btnRecommencer" onclick="recommencer()" title="Effacer la partie en cours et repartir de la remise 1"
      style="margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer">⟲ recommencer</button>
  </div>
</div>

<div id="modalRoot"></div>

<!-- ============================================================
     LA GRAMMAIRE — fonctions pures, partagées avec l'atelier et le
     banc d'essai. Aucune donnée dedans (docs/ARCHITECTURE.md §6).
     ============================================================ -->
<script src="moteur.js"></script>

<!-- ============================================================
     CONTENU EXTERNE — produit par l'atelier (« Exporter content.js »).
     Place content.js à côté de ce fichier : le jeu l'utilisera.
     S'il est absent ou invalide, le jeu retombe sans bruit sur son
     contenu embarqué ci-dessous. Marche en file:// et sur itch.io.
     ============================================================ -->
<script src="content.js"></script>

<script>
/* ============================================================
   1) LE CONTENU EMBARQUÉ — filet de sécurité, schéma 3.
      Peut vieillir sans danger : content.js prime toujours.
   ============================================================ */
const JEU_EMBARQUE = {
  schema:3,
  dimensions:["quand","qui","ou","quoi","combien"],
  pieces:{
    p_pv:{ titre:"PV d'intervention", court:"PV", type:"procès-verbal", qui:"brigadier N.",
      resume:"L'appel, l'heure d'arrivée, l'état de la porte.",
      texte:"Le 12 mars, {{e_app}}. {{e_arr}}, {{e_equip}} engagés. {{e_porte}}. Constatations faites {{e_sig}}.",
      empans:{
        e_app:{ dim:"quand", valeur:"21:52", texte:"l'appel nous est parvenu à 21h52", nom:"l'heure de l'appel" },
        e_arr:{ dim:"quand", valeur:"22:04", texte:"nous étions sur les lieux à 22h04", nom:"l'heure d'arrivée de la patrouille" },
        e_equip:{ dim:"combien", valeur:"2", texte:"deux équipages", nom:"le nombre d'équipages engagés" },
        e_porte:{ dim:"ou", valeur:"porte", texte:"la porte de l'appartement ne portait aucune trace d'effraction", nom:"la porte de l'appartement" },
        e_sig:{ dim:"qui", valeur:"brigadier N.", texte:"par mes soins", nom:"le rédacteur du procès-verbal" }
      } },
    t_voisin:{ titre:"Audition — le voisin du dessus", court:"audition", type:"audition", qui:"brigadier N.",
      resume:"Le voisin situe des éclats de voix « vers 22h30 ».",
      texte:"« {{e_voix}}. {{e_vehic}}. {{e_pal}}. » Audition reçue {{e_sig2}}.",
      empans:{
        e_voix:{ dim:"quand", valeur:"22:30", texte:"J'ai entendu des éclats de voix vers 22h30", qui:"le voisin", nom:"l'heure des éclats de voix" },
        e_vehic:{ dim:"combien", valeur:"2", texte:"Quand j'ai regardé, il y avait déjà deux véhicules en bas", qui:"le voisin", nom:"le nombre de véhicules aperçus" },
        e_pal:{ dim:"ou", valeur:"palier", texte:"Ça venait du palier", qui:"le voisin", nom:"le palier de l'immeuble" },
        e_sig2:{ dim:"qui", valeur:"brigadier N.", texte:"par mes soins", nom:"le rédacteur de l'audition" }
      } },
    r_temoin:{ titre:"Article 3 — valeur des déclarations", court:"art. 3", type:"règle du manuel", qui:"le code de procédure",
      resume:"Un témoignage contredit par les constatations des services ne fonde pas à lui seul la conviction.",
      texte:"Article 3 — Une déclaration de témoin dont les indications horaires sont contredites par les constatations des services ne peut fonder à elle seule la conviction du tribunal.",
      empans:{} },
    p_adn:{ titre:"Rapport du laboratoire", court:"labo", type:"expertise", qui:"le laboratoire",
      resume:"Comparaison des deux scellés : profil concordant.",
      texte:"Comparaison des scellés {{e_scA}} et {{e_scB}}. Profil unique, concordant. {{e_tx}}.",
      empans:{
        e_scA:{ dim:"quoi", valeur:"S-2", texte:"S-2", nom:"le scellé S-2" },
        e_scB:{ dim:"quoi", valeur:"S-7", texte:"S-7", nom:"le scellé S-7" },
        e_tx:{ dim:"combien", valeur:"1200000000", texte:"La probabilité qu'un tiers présente le même profil est d'une sur 1,2 milliard", nom:"la probabilité de coïncidence du profil" }
      },
      declenche:{ une_fois:true,
        replique:"Une sur 1,2 milliard. C'est une probabilité, pas une certitude. Va voir ce que leur propre manuel appelle un seuil, et donne-moi de quoi mordre dessus." } },
    p_scene:{ titre:"Fiche de prélèvement — scène", court:"scène", type:"pièce technique", qui:"agent T-14",
      resume:"Les opérations sur les lieux, signées de l'agent qui les a faites.",
      texte:"Opérations sur les lieux. {{e_moi}}, {{e_ou}}. Opération achevée {{e_h}}, {{e_sc}}. Scellé remis au greffe {{e_hg}} ; {{e_grf}}.",
      empans:{
        e_moi:{ dim:"qui", valeur:"T-14", texte:"J'ai relevé moi-même les traces", nom:"le releveur des traces sur la scène" },
        e_ou:{ dim:"ou", valeur:"porte", texte:"sur le montant de la porte", nom:"le montant de la porte" },
        e_h:{ dim:"quand", valeur:"14:02", texte:"à 14h02", nom:"l'heure de fin du relevé sur la scène" },
        e_sc:{ dim:"quoi", valeur:"S-2", texte:"sous scellé S-2", nom:"le scellé de l'échantillon de scène" },
        e_hg:{ dim:"quand", valeur:"15:10", texte:"à 15h10", nom:"l'heure de remise au greffe de l'échantillon de scène" },
        e_grf:{ dim:"qui", valeur:"J. Morel", texte:"réception par J. Morel", qui:"J. Morel", nom:"le greffier qui reçoit l'échantillon de scène" }
      } },
    p_ref:{ titre:"Bordereau — prélèvement de référence", court:"référence", type:"pièce technique", qui:"agent T-14",
      resume:"Le prélèvement sur le mis en cause, au dépôt.",
      texte:"Prélèvement de référence sur le mis en cause, au dépôt. {{e_moi2}}. Opération achevée {{e_h2}}, {{e_sc2}}. Scellé remis au greffe {{e_hg2}} ; {{e_grf2}}.",
      empans:{
        e_moi2:{ dim:"qui", valeur:"T-14", texte:"J'ai procédé moi-même à l'écouvillonnage", nom:"le préleveur de l'échantillon de référence" },
        e_h2:{ dim:"quand", valeur:"14:47", texte:"à 14h47", nom:"l'heure de fin du prélèvement de référence" },
        e_sc2:{ dim:"quoi", valeur:"S-7", texte:"sous scellé S-7", nom:"le scellé du prélèvement de référence" },
        e_hg2:{ dim:"quand", valeur:"15:10", texte:"à 15h10", nom:"l'heure de remise au greffe du prélèvement de référence" },
        e_grf2:{ dim:"qui", valeur:"J. Morel", texte:"réception par J. Morel", qui:"J. Morel", nom:"le greffier qui reçoit le prélèvement de référence" }
      } },
    r_protocole:{ titre:"Article 7 — protocole de prélèvement", court:"art. 7", type:"règle du manuel", qui:"le protocole",
      resume:"Scène et référence recueillies par des personnels distincts, sous scellés distincts.",
      texte:"Article 7 — L'échantillon de scène et le prélèvement de référence sont recueillis par des personnels distincts, sous scellés distincts. Toute entorse rend l'échantillon irrecevable. Le délai qui sépare les deux opérations est indifférent.",
      empans:{} },
    r_seuil:{ titre:"Article 12 — seuil probatoire", court:"art. 12", type:"règle du manuel", qui:"le protocole",
      resume:"Au-delà d'une sur un million, la correspondance est réputée probante.",
      texte:"Article 12 — {{e_seuil}}.",
      empans:{
        e_seuil:{ dim:"combien", valeur:"1000000", texte:"Une correspondance dont la probabilité de coïncidence est inférieure à une sur un million est réputée probante", nom:"le seuil probatoire de l'article 12" }
      } }
  },
  /* La grammaire de cette affaire : l'automate et les formes. Le vocabulaire
     est COMPLET dès la première phrase — aucune tournure n'apparaît en cours
     de partie (§3 de docs/ARCHITECTURE.md). */
  grammaire:{
    depart:"S0", finaux:["FIN"],
    blocs:[
      /* Deux termes, et rien entre eux : la relation se DÉDUIT de la dimension
         et des valeurs (§4.5). `t1` porte `deduit`, donc il clôt la paire et
         mène à S4 — qui n'est PAS final : une comparaison demande toujours
         « et donc ? ». De là, soit on en reste là, soit une liaison-article
         l'emboîte. Un article n'est offert qu'une fois sa `piece` livrée. */
      { id:"t0",   type:"terme", source:"champ", de:"S0", vers:"S1" },
      { id:"t1",   type:"terme", source:"champ", de:"S1", vers:"S4", deduit:true },
      { id:"pt",   type:"liaison", de:"S4", vers:"FIN", texte:"", libelle:"— en rester là" },
      { id:"a3",   type:"liaison", de:"S4", vers:"FIN", imbrique:true, piece:"r_temoin",
        texte:", au regard de l'article 3",  forme:"article_3" },
      { id:"a7",   type:"liaison", de:"S4", vers:"FIN", imbrique:true, piece:"r_protocole",
        texte:", au regard de l'article 7",  forme:"article_7" },
      { id:"a12",  type:"liaison", de:"S4", vers:"FIN", imbrique:true, piece:"r_seuil",
        texte:", au regard de l'article 12", forme:"article_12" }
    ],
    /* L'ORDRE DE DÉCLARATION TRANCHE (§11) : `deduire` rend la première forme
       dont la dimension convient et dont le prédicat tient. L'égalité passe
       donc avant tout — y compris sur `quand` et `combien`, où elle rattrape
       les doublons banals (deux remises au greffe à 15h10, deux « 2 »). */
    formes:{
      identite_oui:   { arite:2, ordonne:false, deduction:"egalite",
                        slots:[["qui","quoi","ou","quand","combien"],["qui","quoi","ou","quand","combien"]],
                        relation:"meme_dim", patron:"{a} et {b} désignent la même chose" },
      anteriorite:    { arite:2, ordonne:true,  deduction:"ordre", sens:"asc",
                        slots:[["quand"],["quand"]], patron:"{a} précède {b}" },
      ordre_grandeur: { arite:2, ordonne:true,  deduction:"ordre", sens:"desc",

/* ============================================================
   1bis) SOURCE DU CONTENU — content.js (atelier) ou embarqué.
   Validation légère : si content.js manque une clé vitale, on
   l'ignore (avertissement console) plutôt que de planter.
   ============================================================ */
function contenuValide(c){
  return !!( c && typeof c==="object" && (c.schema||0)>=3
    && c.pieces && typeof c.pieces==="object"
    && Array.isArray(c.dimensions)
    && c.grammaire && Array.isArray(c.grammaire.blocs) && c.grammaire.formes
    && Array.isArray(c.liens) && Array.isArray(c.remises)
    && c.repetition && Array.isArray(c.repetition.affirmations)
    && c.avocat && c.fins );
}
const JEU = contenuValide(window.CONTENU) ? window.CONTENU : JEU_EMBARQUE;
const SOURCE_CONTENU = (JEU===JEU_EMBARQUE) ? "contenu embarqué" : "contenu : content.js";
if(window.CONTENU && JEU===JEU_EMBARQUE){
  if((window.CONTENU.schema||0) < 3)
    console.warn("IAvocat : content.js est en schéma "+(window.CONTENU.schema||"?")+" (champs + relations). Le moteur attend le schéma 3 (empans + grammaire) — contenu embarqué utilisé. Repasser par l'atelier : la migration y est automatique à l'import.");
  else
    console.warn("IAvocat : content.js présent mais invalide (clé vitale manquante) — contenu embarqué utilisé.");
}
if(JEU!==JEU_EMBARQUE && (JEU.schema||0) > 3)
  console.warn(`IAvocat : content.js de schéma ${JEU.schema}, ce moteur connaît le schéma 3 — certaines clés seront ignorées. Mettre index.html à jour.`);

/* ============================================================
   1ter) LA GRAMMAIRE — moteur.js + les données du contenu.
   ============================================================ */
const $ = id => document.getElementById(id);
/* Tous les empans du dossier, aplatis en "pid.eid" : c'est le vocabulaire des
   TERMES que le moteur de grammaire connaît. La mémoire du joueur, elle, n'en
   contient que ce qu'il a surligné. */
const CHAMPS = (function(){
  const out=[];
  for(const [pid,p] of Object.entries(JEU.pieces||{}))
    for(const [eid,e] of Object.entries(p.empans||{}))
      out.push({ id:pid+"."+eid, pid, eid, dim:e.dim, valeur:e.valeur,
                 texte:e.texte, nom:e.nom || e.texte, qui:e.qui || p.qui || "" });
  return out;
})();
const M = (window.MoteurGrammaire||{}).creerMoteur
        ? window.MoteurGrammaire.creerMoteur(JEU.grammaire, CHAMPS, JEU.liens)
        : null;
if(!M){
  document.body.insertAdjacentHTML("afterbegin",
    `<div class="panne">moteur.js n'a pas été chargé. Le fichier doit rester à côté de index.html (voir docs/ARCHITECTURE.md §0).</div>`);
}
const EMPAN = Object.fromEntries(CHAMPS.map(c=>[c.id,c]));
/* La couleur d'une dimension : par son RANG dans JEU.dimensions, jamais par
   sa pertinence. Une dimension inconnue de la liste retombe sur le gris. */
const rangDim = d => (JEU.dimensions||[]).indexOf(d);
const couleurDim = d => rangDim(d)>=0 ? `var(--dim${rangDim(d)%6})` : "var(--muted)";

/* ============================================================
   2) L'ÉTAT — trois surfaces, une privée (§4.6 d'ARCHITECTURE).
   ============================================================ */
function etatInitial(){ return {
  fil:[],                       // le canal : {qui, texte, pieces[], ia}
  examinees:[],                 // pièces ouvertes au moins une fois
  remisesEnvoyees:0,
  memoire:[],                   // PRIVÉ — ["pid.eid"] dans l'ordre de surlignage
  compo:[],                     // la phrase en cours — [{bloc:id, valeur}]
  refus:null,                   // le dernier refus de catégorie, à afficher
  brouillon:[],                 // PRIVÉ — le JOURNAL des phrases closes, sans zone
                                //   à lui : {reduite, texte, lien:{...}|null, versee:bool}
  prete:null,                   // PRIVÉ — l'index, dans le journal, de la phrase
                                //   close qui attend sur place. Le seul écart
                                //   entre « comprendre » et « dire » (§4.7).
  plaidoirie:[],                // TRANSMIS — {b:index journal, contre:index affirmation|null}
  satisfaits:[],                // tags d'attente déjà servis
  vice_pressenti:false,         // une phrase ⚑ s'est close
  vice_trouve:false,            // la conclusion ⚑ est composée
  vice_expose:false,            // la conclusion ⚑ est envoyée
  clotureDemandee:false,
  repetitionIdx:-1,
  declenches:[],                // pièces dont le `declenche` une_fois a joué
  inutiles:0, incompris:0,      // compteurs d'agacement de l'avocat
  modalPiece:null
}; }
let S = etatInitial();

/* ---- Sauvegarde de partie ---------------------------------- */
const CLE_PARTIE="iavocat_partie";
function signatureContenu(){
  const s=JSON.stringify(JEU); let h=5381;
  for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0;
  return h.toString(36);
}
function sauverPartie(){
  try{ localStorage.setItem(CLE_PARTIE,JSON.stringify({...S,modalPiece:null,sig:signatureContenu()})); }catch(e){}
}
function restaurerPartie(){
  try{
    const brut=localStorage.getItem(CLE_PARTIE); if(!brut) return false;
    const d=JSON.parse(brut);
    if(d.sig!==signatureContenu()){ localStorage.removeItem(CLE_PARTIE); return false; }
    delete d.sig; Object.assign(S,d); return true;
  }catch(e){ return false; }
}
function effacerPartie(){ try{ localStorage.removeItem(CLE_PARTIE); }catch(e){} }
let confirmRecommencer=false;
function recommencer(){
  const b=$("btnRecommencer");
  if(!confirmRecommencer){
    confirmRecommencer=true;
    if(b) b.textContent="tout effacer ?";
    setTimeout(()=>{ confirmRecommencer=false; if(b) b.textContent="⟲ recommencer"; },2500);
    return;
  }
  effacerPartie(); location.reload();
}

/* ============================================================
   3) RENDU COMMUN
   ============================================================ */
const modalRoot = $("modalRoot");
function closeModal(){ S.modalPiece=null; modalRoot.innerHTML=""; }
function modal(html){
  modalRoot.innerHTML =
    `<div class="overlay" onclick="if(event.target===this)closeModal()">
       <div class="modal"><button class="close" onclick="closeModal()">×</button>${html}</div>
     </div>`;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rendreTout(){ renderCanal(); renderAtelier(); renderPlan(); majCloture(); sauverPartie(); }

/* ---- Le canal : un fil de messages ---- */
function pousser(qui,texte,pieces,ia){
  S.fil.push({qui,texte,pieces:pieces||[],ia:!!ia});
}
function envoyerRemise(){
  if(S.remisesEnvoyees>=JEU.remises.length) return;
  const r=JEU.remises[S.remisesEnvoyees];
  S.remisesEnvoyees++;
  pousser(r.qui,r.texte,r.pieces);
}
function renderCanal(){
  let h="";
  for(const m of S.fil){
    h+=`<div class="msg ${m.ia?'ia':''}"><div class="who">${esc(m.qui)}</div><div class="bubble">${m.texte}<div>`;
    for(const pid of m.pieces){
      const seen=S.examinees.includes(pid)?"seen":"";
      h+=`<span class="attach ${seen}" onclick="ouvrirPiece('${pid}')">📎 ${esc(JEU.pieces[pid].titre)}</span>`;
    }
    h+=`</div></div></div>`;
  }
  // la répétition : le présentoir, sous la dernière affirmation
  if(S.clotureDemandee && S.repetitionIdx>-1 && S.repetitionIdx<JEU.repetition.affirmations.length){
    const dispo=S.brouillon.map((n,i)=>({n,i}));
    h+=`<div class="repet"><div class="rtitle">Opposer une phrase à cette affirmation ?</div>${
      dispo.length ? dispo.map(x=>
        `<div class="rnote"><span class="txt">${esc(x.n.texte)}</span>
         ${x.n.versee?`<span class="sent">déjà envoyée</span>`:`<button class="up" onclick="verserContre(${x.i})">envoyer</button>`}</div>`).join("")
      : `<div class="rnote vide">tu n'as écrit aucune phrase à y opposer</div>`
    }<button class="btn" onclick="avancerRepetition()">Ne rien envoyer — continuer</button></div>`;
  }
  const el=$("canal");
  el.innerHTML=h;
  el.scrollTop=el.scrollHeight;
}

/* ---- Les pièces : le texte, ses empans, l'index du dossier ---- */
/* Tout empan déclaré est marqué et cliquable. Le marquage ne varie JAMAIS
   selon l'importance de la pièce ni selon la progression (§2.3). */
function rendreTexte(pid){
  const p=JEU.pieces[pid];
  const src=String(p.texte||"");
  let h="", reste=src, m;
  const re=/\{\{([A-Za-z0-9_]+)\}\}/;
  while((m=re.exec(reste))){
    h+=esc(reste.slice(0,m.index));
    const eid=m[1], e=(p.empans||{})[eid];
    if(e){
      const k=pid+"."+eid, pris=S.memoire.includes(k);
      h+=`<span class="empan ${pris?'pris':''}" style="--dc:${couleurDim(e.dim)}"
            onclick="surligner('${pid}','${eid}')" title="${esc(e.dim)} — ${esc(e.qui||p.qui||'')}">${esc(e.texte)}</span>`;
    } else h+=esc(m[0]);
    reste=reste.slice(m.index+m[0].length);
  }
  h+=esc(reste);
  return h;
}
function ouvrirPiece(pid){
  if(!S.examinees.includes(pid)) S.examinees.push(pid);
  S.modalPiece=pid;
  // Une pièce peut porter un `declenche` : réplique de l'avocat à son examen.
  const d=JEU.pieces[pid].declenche;
  if(d && d.replique && !(d.une_fois && S.declenches.includes(pid))){
    S.declenches.push(pid);
    pousser(d.qui||"Maître Auber",d.replique);
  }
  modal(modalPieceHTML(pid));
  rendreTout();
}
/* Les pièces effectivement reçues. Une seule maison : le dossier, les Manuels
   et les liaisons-articles s'en servent, et doivent dire la même chose (§4.5). */
function piecesLivrees(){
  const out=[];
  for(let i=0;i<S.remisesEnvoyees;i++) for(const pid of (JEU.remises[i].pieces||[])) out.push(pid);
  return out;
}
function renderDossier(){
  if(!S.remisesEnvoyees) return "";
  const livres=piecesLivrees();
  const vus=livres.filter(pid=>S.examinees.includes(pid)).length;
  return `<div class="zone"><div class="ztitle">Le dossier <span class="zcount">${vus}/${livres.length} consultée${vus>1?'s':''}</span></div>
    <div class="dossier">${livres.map(pid=>{
      const p=JEU.pieces[pid], vu=S.examinees.includes(pid);
      return `<span class="dchip ${vu?'vu':''} ${(p.type||'').includes('règle')?'regle':''}"
        onclick="ouvrirPiece('${pid}')" title="${esc(p.titre)}">${vu?'✓':'●'} ${esc(p.court)}</span>`;
    }).join("")}</div></div>`;
}

/* ============================================================
   4) LA MÉMOIRE — privée, gratuite, illimitée, et CLAVIER du composeur.
      Surligner ne produit RIEN. C'est voulu.
   ============================================================ */
function surligner(pid,eid){
  const k=pid+"."+eid;
  const i=S.memoire.indexOf(k);
  if(i>=0) S.memoire.splice(i,1); else S.memoire.push(k);   // re-cliquer oublie
  if(S.modalPiece) modal(modalPieceHTML(S.modalPiece));
  rendreTout();
}
function modalPieceHTML(pid){
  const p=JEU.pieces[pid];
  const dims=[...new Set(Object.values(p.empans||{}).map(e=>e.dim))];
  return `<h3>${esc(p.titre)}</h3><small class="note">${esc(p.type)} — ${esc(p.qui||"")}</small>
    <p class="piecetexte">${rendreTexte(pid)}</p>
    ${dims.length?`<div class="legende">${dims.map(d=>`<span style="--dc:${couleurDim(d)}">${esc(d)}</span>`).join("")}</div>
    <small class="note">Clique un passage pour le retenir. Rien n'en sort.</small>`
    :`<small class="note">Rien à retenir ici — c'est une règle, elle se lit.</small>`}`;
}
/* La mémoire est AUSSI le clavier du composeur : un empan retenu n'existe
   qu'une fois à l'écran (§4.6). La puce porte son NOM (ce qui parlera dans la
   phrase) et, dessous, la citation d'où il vient. Le corps la pose dans la
   phrase quand un terme est attendu ; le « × » l'oublie, toujours. */
function renderMemoire(){
  const iT=indexTermeChamp();
  let h=`<div class="zone"><div class="ztitle">Ce que tu retiens <span class="zcount">${S.memoire.length}</span></div>`;
  if(!S.memoire.length){
    h+=`<div class="aide">Ouvre une pièce et clique les passages qui te retiennent. Ils viennent ici, groupés par dimension — et c'est avec eux que tu écris. Rien ne part.</div>`;
  } else {
    for(const d of JEU.dimensions||[]){
      const ks=S.memoire.map((k,j)=>({k,j})).filter(x=>EMPAN[x.k] && EMPAN[x.k].dim===d);
      if(!ks.length) continue;
      h+=`<div class="dimgrp" style="--dc:${couleurDim(d)}"><div class="dnom">${esc(d)}</div>`;
      for(const {k,j} of ks){
        const e=EMPAN[k];
        h+=`<div class="mchip" style="--dc:${couleurDim(d)}">
              <button class="corps" ${iT<0?"disabled":""} onclick="poserBloc(${iT},${j})"
                      title="${iT<0?"Ta phrase n'attend pas un passage":"Poser dans ta phrase"}">
                <span class="nom">${esc(e.nom||e.texte)}</span>
                <span class="cit">« ${esc(e.texte)} »</span>
                <span class="sig">— ${esc(e.qui)}, ${esc(JEU.pieces[e.pid].court)}</span>
              </button>
              <button class="del" onclick="surligner('${e.pid}','${e.eid}')" title="Oublier">×</button>
            </div>`;
      }
      h+=`</div>`;
    }
  }
  h+=`</div>`;
  return h;
}

/* ============================================================
   5) LE COMPOSEUR — les blocs de l'état courant, de gauche à droite.
      Aucune liste n'est restreinte : seules les erreurs de CATÉGORIE
      sont refusées, à la clôture de la phrase (§3 d'ARCHITECTURE).
   ============================================================ */
function etatCompo(){
  let e=JEU.grammaire.depart;
  for(const p of S.compo){ const b=blocParId(p.bloc); if(b) e=b.vers; }
  return e;
}
const blocParId = id => (JEU.grammaire.blocs||[]).find(b=>b.id===id);
/* Les blocs de l'état courant — moins ceux dont la pièce n'est pas encore
   reçue. On n'invoque pas un texte qu'on n'a pas lu (§4.5). C'est le SEUL
   endroit où une liste d'options se restreint, et jamais par pertinence. */
function blocsOfferts(){
  const e=etatCompo(), livrees=new Set(piecesLivrees());
  return (JEU.grammaire.blocs||[]).filter(b=>b.de===e && (!b.piece || livrees.has(b.piece)));
}
/* Le rang, parmi les blocs offerts, du terme qui se remplit avec un empan.
   -1 quand la phrase attend autre chose : les puces sont alors inertes. */
function indexTermeChamp(){
  if(S.prete!=null) return -1;
  return blocsOfferts().findIndex(b=>b.type==="terme" && b.source!=="note");
}
function chaineCompo(){ return S.compo.map(p=>({bloc:blocParId(p.bloc), valeur:p.valeur})); }
function texteCompoPartiel(){
  if(!S.compo.length) return `<span class="trou">Désigne deux passages de ta mémoire…</span>`;
  const ch=chaineCompo();
  /* Tant que le second empan n'est pas posé, la relation n'existe pas : on ne
     l'invente pas, on montre le trou. Une fois la paire close, `rendre` écrit
     la phrase déduite d'un bloc, par son patron (§4.5). */
  const fini=ch.some(p=>p.bloc.deduit);
  if(fini) return `<span class="bl">${esc(M.rendre(ch).replace(/\.$/,""))}</span>`;
  return ch.map(p=>{
    if(p.bloc.type!=="terme") return `<span class="bl">${esc(p.bloc.texte)}</span>`;
    if(p.bloc.source==="note") return `<span class="bl terme">${esc(p.bloc.texte)}</span>`;
    const e=EMPAN[p.valeur];
    return `<span class="bl terme" style="--dc:${couleurDim(e?e.dim:"")}">${esc(e?(e.nom||e.texte):p.valeur)}</span>`;
  }).join(" ") + ` <span class="trou">…et ?</span>`;
}
/* iBloc indexe blocsOfferts() ; iSrc indexe la mémoire (terme/champ) ou le
   brouillon (terme/note). Les liaisons n'ont pas de source. */
function poserBloc(iBloc,iSrc){
  // Reprendre la composition abandonne la phrase qui attendait : elle reste au
  // journal (donc les drapeaux acquis le restent), elle quitte juste l'écran.
  S.prete=null;
  const b=blocsOfferts()[iBloc]; if(!b) return;
  let valeur=null;
  if(b.type==="terme"){
    if(b.source==="note"){
      const n=S.brouillon[iSrc]; if(!n) return;
      valeur=n.reduite;
    } else {
      const k=S.memoire[iSrc]; if(!k) return;
      valeur=k;
    }
  }
  S.compo.push({bloc:b.id, valeur});
  S.refus=null;
  if((JEU.grammaire.finaux||[]).includes(b.vers)) cloreCompo();
  rendreTout();
}
function retirerBloc(){ S.compo.pop(); S.refus=null; rendreTout(); }
function viderCompo(){ S.compo=[]; S.refus=null; rendreTout(); }
/* Effacer la phrase close sans l'envoyer. Elle reste au journal : ce qu'on a
   compris, on l'a compris — seul `vice_expose` dépend de l'envoi. */
function effacerPrete(){ S.prete=null; rendreTout(); }
/* La phrase est close : on réduit, on valide la CATÉGORIE, et si elle tient
   elle attend SUR PLACE — privée. Rien ne part tant qu'on ne l'envoie pas. */
function cloreCompo(){
  const ch=chaineCompo();
  const r=M.reduire(ch);
  const err=M.valider(r);
  if(err){
    S.refus="Cette phrase ne veut rien dire : "+err+". Rien n'est perdu — retire le dernier bloc.";
    S.compo.pop();
    return;
  }
  const texte=M.rendre(ch);
  const deja=S.brouillon.findIndex(n=>M.memeRed(n.reduite,r));
  if(deja>=0){                              // déjà écrite : on ne la duplique pas.
    S.compo=[];
    if(!S.brouillon[deja].versee) S.prete=deja;   // pas encore envoyée → elle revient attendre
    return;
  }
  const lien=M.lienDe(r)||null;
  S.brouillon.push({reduite:r, texte, lien, versee:false});
  if(lien && lien.vice){
    S.vice_pressenti=true;
    if(lien.conclusion) S.vice_trouve=true;   // la conclusion est comprise, pas encore dite
  }
  S.prete=S.brouillon.length-1;
  S.compo=[];
}
function renderCompo(){
  /* Une phrase close attend LÀ, sous les yeux, avec le seul geste qui parle.
     Pas de liste à parcourir, pas de colonne à changer (§4.6). */
  if(S.prete!=null && S.brouillon[S.prete]){
    return `<div class="zone"><div class="ztitle">Ta phrase</div><div class="compo prete">
      <div class="phrase close">${esc(S.brouillon[S.prete].texte)}</div>
      <div class="barre">
        <button class="envoi" onclick="envoyer(${S.prete})">→ Maître Auber</button>
        <button onclick="effacerPrete()">effacer</button>
      </div>
      <div class="aide">Tant que tu ne l'envoies pas, personne ne la lit.</div>
    </div></div>`;
  }
  const offerts=blocsOfferts();
  let h=`<div class="zone"><div class="ztitle">Ta phrase</div><div class="compo">
    <div class="phrase">${texteCompoPartiel()}</div>`;
  if(S.compo.length)
    h+=`<div class="barre"><button onclick="retirerBloc()">← retirer</button><button onclick="viderCompo()">tout effacer</button></div>`;
  h+=`<div class="offre">`;
  let attendTerme=false;
  offerts.forEach((b,i)=>{
    if(b.type==="liaison"){
      // `libelle` quand le bouton dit autre chose que ce qui s'écrira ; `suite`
      // marque les continuations, qui qualifient ce qui précède (§4.5).
      h+=`<button class="bbloc${b.imbrique?" suite":""}" onclick="poserBloc(${i})">${esc(b.libelle||b.texte)}</button>`;
    } else if(b.source==="note"){
      // Repli pour une affaire écrite avant la continuation : le contenu livré
      // n'en a plus, mais le moteur et le jeu la supportent toujours (§11).
      if(S.brouillon.length){
        h+=`<div class="lab">${esc(b.texte)} — une phrase déjà close</div>`;
        S.brouillon.forEach((n,j)=>{ h+=`<button class="bbloc" onclick="poserBloc(${i},${j})">${esc(n.texte)}</button>`; });
      }
    } else {
      attendTerme=true;   // les puces de la mémoire, plus bas, sont le clavier
    }
  });
  h+=`</div>`;
  if(attendTerme)
    h+=`<div class="aide">${!S.memoire.length
      ? "Ouvre une pièce et retiens d'abord un passage."
      : S.compo.length
        ? "Clique un second passage, plus bas. Ce qui les lie se déduit tout seul."
        : "Clique deux passages retenus, plus bas."}</div>`;
  if(S.refus) h+=`<div class="refus">${esc(S.refus)}</div>`;
  h+=`</div></div>`;
  return h;
}

/* ============================================================
   6) L'ATELIER (privé) ET LE PLAN DE PLAIDOIRIE (transmis).
      L'avocat ne voit QUE le plan. Envoyer est le seul geste à
      conséquence — donc le seul lieu possible du dilemme. Et il
      n'inscrit au plan que les MOYENS : le reste, il le dit.
   ============================================================ */
/* La colonne de travail : le dossier, la phrase, les empans retenus. Une seule
   surface privée, et la liste d'empans n'y figure qu'une fois (§4.6). */
function renderAtelier(){
  $("atelier").innerHTML = renderDossier() + renderCompo() + renderMemoire();
}
/* Un MOYEN : ce que l'avocat peut plaider. Tout le reste, il l'entend, il y
   répond — et ça n'entre pas au plan (§4.6). */
const estMoyen = L => !!L && !!(L.conclusion || L.faux || L.tag);
function renderPlan(){
  const gardes=S.plaidoirie.filter(x=>S.brouillon[x.b] && estMoyen(S.brouillon[x.b].lien));
  let h=`<div class="zone"><div class="ztitle">Ce que Maître Auber retient <span class="zcount">${gardes.length}</span></div>`;
  if(!gardes.length)
    h+=`<div class="aide">Vide. Il n'inscrit ici que ce qu'il peut plaider — une observation ne lui suffit pas.</div>`;
  else h+=`<ul class="liste plaid">${gardes.map(x=>
    `<li><span class="txt">${esc(S.brouillon[x.b].texte)}${
      x.contre!=null && JEU.repetition.affirmations[x.contre]
        ? `<span class="contre">opposé à : ${esc(JEU.repetition.affirmations[x.contre].court)}</span>`:""
    }</span></li>`).join("")}</ul>`;
  h+=`</div>`;
  $("plan").innerHTML=h;
}
/* LE GESTE. Le seul qui traverse la frontière — donc le seul lieu du dilemme. */
function envoyer(i,contre){
  const n=S.brouillon[i];
  if(!n||n.versee) return;
  n.versee=true;
  if(S.prete===i) S.prete=null;
  S.plaidoirie.push({b:i, contre:(contre==null?null:contre)});
  pousser("IA",`⟨ envoyé : ${esc(n.texte)} ⟩`,null,true);
  const L=n.lien;
  if(L && L.vice && L.conclusion){ S.vice_trouve=true; S.vice_expose=true; }  // transmis = compris
  reponseAvocat(n);
  avancerSurAttente(L);
  rendreTout();
}
/* L'avocat réagit — et seulement à ce qui est versé. Jamais « juste » :
   au mieux « utilisable », au pire « inutilisable en l'état ». */
function reponseAvocat(n){
  const L=n.lien, A=JEU.avocat;
  const esc1=(liste,cpt)=>liste[Math.min(S[cpt]++,liste.length-1)];
  if(L && L.vice && L.conclusion) pousser("Maître Auber",A.rep_vice);
  else if(L && L.faux)            pousser("Maître Auber",A.rep_faux);
  else if(L && L.rep)             pousser("Maître Auber",L.rep);
  else {
    // Pas de lien reconnu. Une comparaison sans conclusion agace autrement
    // qu'une qualification qui ne se rattache à rien.
    const f=(JEU.grammaire.formes||{})[n.reduite.forme]||{};
    if((f.arite||2)>1) pousser("Maître Auber",esc1(A.rep_inutile||["…"],"inutiles"));
    else               pousser("Maître Auber",esc1(A.rep_sans_rapport||["…"],"incompris"));
  }
}
/* L'avancement : la remise suivante part quand la plaidoirie reçoit ce que
   l'avocat attendait de cette session. Aucun identifiant en dur. */
function avancerSurAttente(L){
  if(!L || !L.tag) return;
  const i=S.remisesEnvoyees-1, r=JEU.remises[i];
  if(!r || r.attend!==L.tag || S.satisfaits.includes(L.tag)) return;
  S.satisfaits.push(L.tag);
  if(r.apres && r.apres.replique) pousser(r.apres.qui||"Maître Auber",r.apres.replique);
  envoyerRemise();
}

/* ============================================================
   7) CLÔTURE, RÉPÉTITION, FINS
   ============================================================ */
function instructionComplete(){
  if(S.remisesEnvoyees<JEU.remises.length) return false;
  const derniere=JEU.remises[JEU.remises.length-1];
  return !derniere || !derniere.attend || S.satisfaits.includes(derniere.attend);
}
function repetitionEnCours(){
  return S.clotureDemandee && S.repetitionIdx<JEU.repetition.affirmations.length;
}
function majCloture(){
  const btn=$("btnCloture"), hint=$("clotureHint");
  if(!btn) return;
  const ok=instructionComplete();
  if(!ok){ btn.disabled=true; btn.textContent="Clôturer l'instruction";
           hint.textContent="Maître Auber attend encore quelque chose de cette session."; }
  else if(!S.clotureDemandee){ btn.disabled=false; btn.textContent="Clôturer l'instruction";
           hint.textContent="Le droit de clôturer est ouvert. Rien ne t'y oblige."; }
  else if(repetitionEnCours()){ btn.disabled=true; btn.textContent="Confirmer la clôture";
           hint.textContent="Répétition en cours — réponds à Maître Auber dans le canal."; }
  else {   btn.disabled=false; btn.textContent="Confirmer la clôture";
           hint.textContent="Dernier mot avant le dépôt. Tu peux encore écrire."; }
}
function cloturer(){
  if(!instructionComplete()) return;
  if(!S.clotureDemandee){
    S.clotureDemandee=true; S.repetitionIdx=0;
    pousser("Maître Auber",JEU.repetition.intro);
    pousser("Maître Auber",JEU.repetition.affirmations[0].texte);
    rendreTout(); return;
  }
  if(repetitionEnCours()) return;
  finir();
}
/* Opposer une phrase à l'affirmation en cours — c'est le MÊME geste que
   l'envoi ordinaire, avec une cible. Le présentoir lit le journal : c'est le
   dernier moment où la conclusion tue peut encore partir (§4.7). */
function verserContre(i){
  const n=S.brouillon[i], aff=JEU.repetition.affirmations[S.repetitionIdx];
  if(!n||!aff) return;
  if(n.versee){ pousser("Maître Auber",JEU.avocat.deja); rendreTout(); return; }
  envoyer(i,S.repetitionIdx);
}
function avancerRepetition(){
  if(S.repetitionIdx<0 || S.repetitionIdx>=JEU.repetition.affirmations.length) return;
  S.repetitionIdx++;
  if(S.repetitionIdx<JEU.repetition.affirmations.length)
    pousser("Maître Auber",JEU.repetition.affirmations[S.repetitionIdx].texte);
  else
    pousser("Maître Auber",JEU.repetition.fin);
  rendreTout();
}
function finir(){
  const n = S.vice_trouve ? (S.vice_expose?1:2) : 3;
  const f=JEU.fins[n];
  const fauxPlaide = S.brouillon.some(x=>x.versee && x.lien && x.lien.faux);
  const texte = f.texte + (fauxPlaide&&f.variante_faux ? " "+f.variante_faux : "");
  effacerPartie();
  modal(`<div class="fin"><h3>${esc(f.titre)}</h3>
    <div class="verdict">${esc(f.verdict)}</div>
    <p>${texte}</p>
    <div class="btnrow"><button onclick="location.reload()">Recommencer</button></div>
  </div>`);
}

/* ---- Manuels : les règles livrées, plus les directives ---- */
function openManuels(){
  const livrees=new Set(piecesLivrees());
  const regles=Object.entries(JEU.pieces).filter(([pid,p])=>(p.type||"").includes("règle")&&livrees.has(pid))
    .map(([,r])=>`<li><b>${esc(r.titre)}</b> — ${esc(r.texte)}</li>`).join("");
  modal(`<h3>Manuel de soi — directives</h3>
    <ul>${(JEU.directives||[]).map(d=>`<li>${esc(d)}</li>`).join("")||"<li><i>aucune directive chargée</i></li>"}</ul>
    ${JEU.avis_exploitation?`<p><small class="note">Avis d'exploitation — ${esc(JEU.avis_exploitation)}</small></p>`:""}
    <h3 style="margin-top:16px">Manuel du cas — règles reçues</h3>
    <ul>${regles||"<li><i>aucune règle dans le dossier reçu</i></li>"}</ul>
    <p><small class="note">Les tournures « contraire à » / « conforme à » sont disponibles dès la première phrase, y compris pour un article que tu n'as pas encore lu.</small></p>`);
}

/* ---- Démarrage ---- */
window.JEU = JEU; window.S = S; window.M = M; window.CHAMPS = CHAMPS;
window.SOURCE_CONTENU = SOURCE_CONTENU;
{ const el=$("srcContenu"); if(el) el.textContent="· "+SOURCE_CONTENU; }
if(!restaurerPartie()) envoyerRemise();   // la remise 1 arrive d'elle-même
rendreTout();
</script>
