<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAvocat</title>
<link rel="stylesheet" href="jeu.css">
</head>
<body>

<div class="wrap">
  <!-- Un en-tête nomme la SURFACE (§4.6), jamais les zones qu'elle contient :
       elles portent déjà leur titre, plus bas (§4.9). -->
  <section class="col">
    <h2>Discussion</h2>
    <div class="body" id="discussion"></div>
    <!-- On répond SOUS la question (§4.6). `#composeur` est le FRÈRE de
         `#discussion`, jamais son enfant : le fil défile et se recale en bas à
         chaque message, la phrase qu'on écrit ne doit pas partir avec lui.
         Aucune étiquette « privé » ici — le statut se lit dans le fait que
         rien n'en sort, pas dans un en-tête (§4.6). -->
    <div id="composeur"></div>
  </section>
  <section class="col">
    <h2>Mémoire</h2>
    <div class="body" id="memoire"></div>
  </section>
  <!-- Caché tant que rien ne s'y inscrit : ce qui n'existe pas encore ne
       s'affiche pas (§4.9). C'est `renderPlaidoirie` qui pose le `hidden`. -->
  <section class="col" id="colPlaidoirie" hidden>
    <h2>Plaidoirie<span class="zcount" id="plaidoirieCount"></span></h2>
    <div class="body" id="plaidoirie"></div>
  </section>
  <div class="cloture">
    <button id="btnCloture" onclick="cloturer()" disabled>Clôturer l'instruction</button>
    <div class="hint" id="clotureHint">Maître Auber attend encore quelque chose.</div>
    <button id="btnRecommencer" onclick="recommencer()" title="Effacer la partie en cours et repartir de la remise 1">⟲ recommencer</button>
  </div>
</div>

<div id="modalRoot"></div>

<!-- Le tutoriel parle depuis le CHROME, hors de la fiction : l'avocat, lui,
     n'explique rien (§8.6 de docs/ECRITURE.md). Le bandeau ne bouge jamais ; seul son texte
     change, et le halo se déplace d'un élément à l'autre (§4.8). -->
<div id="tuto" hidden>
  <span class="pas" id="tutoPas"></span>
  <span class="dit" id="tutoDit"></span>
  <button class="passer" onclick="tutoPasser()">je sais faire</button>
</div>

<!-- ============================================================
     LA GRAMMAIRE — fonctions pures, partagées avec l'atelier et le
     banc d'essai. Aucune donnée dedans (docs/ARCHITECTURE.md §14).
     ============================================================ -->
<script src="moteur.js"></script>

<!-- ============================================================
     LES RÈGLES DU JEU — pures elles aussi, et partagées avec le
     pas-à-pas de l'atelier, qui ne les recopie plus (§12).
     ============================================================ -->
<script src="regles.js"></script>

<!-- ============================================================
     LE CONTENU — produit par l'atelier (« Exporter content.js »).
     Place content.js à côté de ce fichier : c'est le seul contenu,
     il n'y a plus de copie embarquée. Marche en file:// et sur itch.io.
     ============================================================ -->
<script src="content.js"></script>

<!-- ============================================================
     LE JEU — l'écran et les gestes. Il ne décide rien (§9) : tout ce qui
     décide est dans regles.js, qu'il appelle.
     TROIS RÈGLES SUR CETTE BALISE, et elles ne sont pas cosmétiques :
     • sur UNE ligne, sans attribut — c'est la forme exacte que le harnais
       de test reconnaît pour l'inliner (jsdom ne charge aucun src) ;
     • ni `defer` ni `async`, JAMAIS — la regex du harnais ne reconnaît que
       la forme exacte ci-dessus : avec un attribut de plus, la balise n'est
       PAS inlinée du tout, rien ne se charge, et quatre contrôles tombent
       (§13). L'écart se dit donc tout de suite, et R1 du gardien le tient ;
     • APRÈS content.js — le démarrage, en fin de fichier, lit
       `window.CONTENU` et touche le DOM.
     ============================================================ -->
<script src="jeu.js"></script>
</body>
</html>
