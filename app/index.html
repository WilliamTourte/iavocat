<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAvocat</title>
<link rel="stylesheet" href="jeu.css">
</head>
<body>

<!-- LE TUTORIEL (§4.8) — une BULLE, boîte de dialogue NON bloquante : en
     surimpression, elle ne décale rien, et `placerTuto` l'ancre à côté du halo
     — c'est ce placement, plus le flux, qui l'empêche de recouvrir ses propres
     ancres. Premier enfant de <body>, hors de `.wrap` : premier arrêt de
     tabulation, et vivante si `finir` rend `.wrap` inerte. -->
<div id="tuto" role="dialog" aria-label="Tutoriel" hidden>
  <div id="tutoCorps">
    <span class="dit" id="tutoDit"></span>
    <!-- La croix des autres fenêtres (§4.8), sans Échap : il appartient aux panneaux. -->
    <button class="fermer" id="tutoPasser" onclick="tutoPasser()" aria-label="Fermer le tutoriel pour de bon"><span class="x" aria-hidden="true">×</span></button>
  </div>
  <button class="tutoIcone" id="tutoIcone" hidden onclick="tutoAgrandir()" aria-label="Revoir la consigne du tutoriel">?</button>
</div>

<div class="wrap">
  <!-- Un en-tête nomme la SURFACE (§4.6), jamais les zones qu'elle contient.
       CONTEXTE ouvert, celui-ci devient aussi la bascule qui agrandit la
       conversation (`enteteDISCUSSION`) : la section reste nommée par son nom. -->
  <section class="col fil" aria-labelledby="nomDISCUSSION">
    <h2 id="titreDISCUSSION"><span id="nomDISCUSSION">DISCUSSION</span></h2>
    <div class="body" id="discussion"></div>
  </section>
  <!-- LA PLACE LATÉRALE (§4.6) — PIÈGE : sa PLACE DANS LE DOCUMENT est toute la
       mécanique. Deux occupants, un seul à la fois : CONTEXTE et PLAIDOIRIE — la
       pièce ouverte vit DANS le CONTEXTE (§4.6). En dessous du seuil de
       `.wrap.avecLateral`, elle s'ouvre ENTRE la conversation et le composeur,
       empilée, SANS rien recouvrir. Au-dessus, elle devient une colonne À CÔTÉ
       de la conversation — la question reste sous les yeux même pièce ouverte.
       Les déplacer ailleurs dans `.wrap`, ou les sortir du flux, défait tout
       ça — et aucune suite ne voit une géométrie. -->
  <!-- Les croix ont un NOM, et Échap s'y lit (§4.10) : `title` n'était qu'une
       description, le lecteur d'écran annonçait « × ». -->
  <section class="col panneau" id="panCONTEXTE" hidden aria-labelledby="titreCONTEXTE">
    <h2><span id="titreCONTEXTE" tabindex="-1">CONTEXTE</span><button class="fermer" onclick="fermerPanneau()" aria-label="Fermer le CONTEXTE (Échap)" aria-keyshortcuts="Escape"><span class="x" aria-hidden="true">×</span><kbd>Échap</kbd></button></h2>
    <div class="body" id="contexte"></div>
  </section>
  <section class="col panneau" id="panPLAIDOIRIE" hidden aria-labelledby="titrePLAIDOIRIE">
    <!-- Pas de compte ici : la barre du composeur le porte, et il reste
         visible panneau ouvert ou fermé (§4.9 règle 3). -->
    <h2><span id="titrePLAIDOIRIE">PLAIDOIRIE</span><button class="fermer" onclick="fermerPanneau()" aria-label="Fermer la PLAIDOIRIE (Échap)" aria-keyshortcuts="Escape"><span class="x" aria-hidden="true">×</span><kbd>Échap</kbd></button></h2>
    <div class="body" id="plaidoirie"></div>
  </section>
  <!-- LA PIÈCE OUVERTE n'a plus de section à elle : elle s'ouvre DANS le
       CONTEXTE, entre l'index et les passages retenus (§4.6) — `#panPiece` naît
       donc du rendu de `#contexte`, plus d'ici. -->
  <!-- On répond SOUS la question (§4.6). PIÈGE : `#composeur` est le FRÈRE de
       `#discussion`, jamais son enfant — le fil se recale en bas à chaque
       message, la phrase qu'on écrit ne doit pas partir avec lui. Il est aussi
       le frère de `.scene`, et c'est ce qui le garde visible sous un panneau. -->
  <div id="composeur" role="region" aria-label="RÉPONSE"></div>
  <!-- Sur une ligne : la colonne tient dans la fenêtre (§4.6). La confirmation
       de « recommencer » attend qu'on réponde — jamais un minuteur (§4.10). -->
  <div class="cloture">
    <button id="btnCloture" onclick="cloturer()" disabled hidden>Je n'ai rien d'autre</button>
    <div class="hint" id="clotureHint" hidden>Tu peux encore écrire.</div>
    <span class="recommencer">
      <button id="btnRecommencer" onclick="recommencer()" title="Effacer la partie en cours et repartir de la remise 1">⟲ recommencer</button>
      <button id="btnAnnulerRecommencer" onclick="annulerRecommencer()" hidden>annuler</button>
    </span>
  </div>
</div>

<div id="modalRoot"></div>

<!-- LA VOIX D'ANNONCE (§4.10) — PIÈGE : dans le HTML STATIQUE, et HORS de
     `.wrap`. Une région créée au moment d'annoncer ne dit pas sa première
     phrase ; une région dans `.wrap` se tait quand la pièce la rend inerte. -->
<div id="annonce" class="sr" aria-live="polite"></div>

<script src="moteur.js"></script>

<script src="regles.js"></script>

<script src="content.js"></script>

<!-- LE JEU — l'écran et les gestes ; il ne décide rien (§9).
     TROIS RÈGLES SUR CETTE BALISE, aucune n'est cosmétique :
     • sur UNE ligne, sans attribut — la forme exacte que le harnais inline ;
     • ni `defer` ni `async`, JAMAIS : un attribut de plus et la balise n'est
       PAS inlinée du tout, rien ne se charge, quatre contrôles tombent (§13) ;
     • APRÈS content.js — le démarrage lit `window.CONTENU`. R1 tient la forme. -->
<script src="jeu.js"></script>
</body>
</html>
