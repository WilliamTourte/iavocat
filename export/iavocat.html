<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAvocat</title>
<style>
/* LE JEU — LA FEUILLE DE STYLE, chargée par <link>. Elle ne décide rien : les
   seules valeurs calculées entrent par `--dc` et `--ds`, posées en style inline
   par `couleurDim` et `traitDim` (§4.3) — palette et traits vivent dans
   app/moteur.js, en un exemplaire. Le papier des pièces les FONCE ici, il ne
   les double pas. */
:root{
  color-scheme:dark;
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2b3440;
  --txt:#d7dde5; --muted:#8b97a6; --accent:#6fb3d6; --warn:#d6a96f;
  /* PIÈGE PAYÉ : ce bleu fut employé huit fois et défini nulle part. Une `var()`
     introuvable rend la déclaration INVALIDE AU CALCUL — sur un raccourci comme
     `border`, ça vide toutes ses longhands, donc pas de filet du tout. */
  --transmis:#23506e;
  /* Le papier des pièces (§4.6) : ce qu'on lit vient du monde. */
  --papier:#f4efe4; --encre:#27231d; --encre2:#665d4f; --filet:#d8cfbb;

  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"DejaVu Serif","Liberation Serif",serif;
}
*{box-sizing:border-box}
/* §4.6 — LA COLONNE TIENT DANS LA FENÊTRE : la page ne défile pas, chaque bande
   défile pour son compte, et la conversation est la SEULE bande élastique.
   PIÈGE : sans `min-height:0`, un item de flex refuse de rétrécir sous son
   contenu — la conversation pousserait le composeur sous le pli, exactement ce
   que cette mise en page existe pour empêcher. */
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{flex:1 1 auto;min-height:0;width:100%;max-width:1000px;margin:0 auto;
  display:flex;flex-direction:column;gap:12px;padding:14px 20px 12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.col > h2{flex:none;margin:0;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.body{padding:12px 14px;overflow-y:auto;min-height:0;flex:1 1 auto}
.col.fil{flex:1 1 0;min-height:130px}
/* Un panneau ouvert, la conversation peut céder davantage — c'est tout ce que la
   classe `avecLateral` décide. Son PLANCHER n'est pas cosmétique : à 96 px elle
   ne montrait qu'une ligne coupée, et c'est elle, pas le panneau, qui doit
   rester lisible — le panneau, lui, dit qu'il déborde. EN DESSOUS DU SEUIL
   seulement (§4.6 CONCEPTION) : au-dessus, la place latérale est à CÔTÉ de la
   conversation, pas en dessous, et ne lui dispute plus rien. */
@media (max-width:899.98px){
  .wrap.avecLateral .col.fil{min-height:132px}
}
/* Le panneau peut prendre plus de hauteur depuis que la question redescend au
   composeur (§4.9 règle 3) : elle ne dépend plus de ce qu'il reste à la
   conversation. Les deux changements se tiennent — l'un sans l'autre est un
   mauvais marché. */
/* PIÈGE PAYÉ : `flex:0 1 auto` + `min-height:0` laissait le panneau céder JUSQU'À
   ZÉRO devant `#composeur`, qui est `flex:none`. À deux passages retenus, un
   joueur ne voyait plus que le haut d'une fiche ; la réponse grandissant, la
   zone disparaissait. Or le panneau EST le clavier (§4.6) : le vider pendant
   qu'on écrit retire le clavier au milieu du geste. D'où un PLANCHER qui montre
   deux fiches entières — c'est au composeur de défiler, il sait le faire. */
.panneau{flex:0 1 auto;max-height:40vh;min-height:268px}
/* UN PANNEAU QUI DÉBORDE LE DIT. PIÈGE MESURÉ, deux fois : la barre du système
   est SUPERPOSÉE — 0 px de large, effacée au repos —, et ni `scrollbar-width`
   ni `::-webkit-scrollbar` ne la font reprendre sa place dans ce Chromium. Un
   joueur a donc cherché sa fiche sous le pli sans qu'aucun indice existe. Le
   dégradé, lui, ne dépend d'aucune barre : `majDebord` allume `.deborde` tant
   qu'il reste quelque chose dessous. Il est POSÉ SUR LA SECTION, jamais sur la
   bande qui défile — un `::after` dans un cadre défilant part avec le contenu. */
.col.panneau{position:relative}
.col.panneau.deborde::after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:30px;
  pointer-events:none;border-radius:0 0 9px 9px;
  background:linear-gradient(to top, var(--panel) 20%, rgba(22,27,34,0))}
.panneau .body::-webkit-scrollbar{width:11px}
.panneau .body::-webkit-scrollbar-track{background:#131920;border-radius:6px}
.panneau .body::-webkit-scrollbar-thumb{background:#44525f;border-radius:6px;
  border:2px solid var(--panel)}
.panneau .body::-webkit-scrollbar-thumb:hover{background:#5a6b7a}
/* PIÈGE PAYÉ : `#zoneDossier` a été rendu COLLANT pour qu'il ne parte pas hors
   champ — il a occupé le panneau en permanence, et à trois lignes il en mangeait
   la moitié, par-dessus les fiches. Il défile avec elles. Ce qu'il devait
   réparer l'est autrement : le défilement survit au redessin (`garderDefilement`)
   et le panneau s'ouvre sur le dernier passage retenu (`voirDernierRetenu`). */
/* PIÈGE : `.col` pose `display:flex`, qui BAT `[hidden]{display:none}` — sans
   cette ligne, cacher la PLAIDOIRIE ne ferait rien. */
.col[hidden]{display:none}
/* §4.6 — LA PIÈCE S'OUVRE DANS LE CONTEXTE. Le panneau cesse alors de défiler
   d'un bloc : l'index en tête, puis DEUX BANDES qui défilent chacune pour son
   compte — la pièce, les retenus —, pour qu'une longue pièce ne pousse jamais
   les retenus hors du panneau, ni dix-sept fiches la pièce. Si le panneau est
   trop bas pour les planchers des deux bandes (un téléphone), il redéfile d'un
   bloc plutôt que de rogner : c'est le rôle de l'`overflow-y` restant. */
#contexte.avecPiece{display:flex;flex-direction:column;gap:10px}
#contexte.avecPiece > #zoneDossier{flex:none;margin:0}
/* Replié, l'index n'est plus qu'une ligne : DOSSIER, sans compte (§4.6). */
.dplier{display:flex;align-items:baseline;gap:10px;width:100%;padding:2px 0;background:none;border:0;
  color:var(--txt);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.dplier .dtitre{font-size:12.5px;font-weight:600;color:var(--muted)}
.dplier .dcompte{flex:1}
.dplier .dsens{margin-left:auto;color:var(--muted);white-space:nowrap}
.dplier:hover .dsens{color:var(--txt)}
#zoneDossier:not(.plie) .dplier{margin-bottom:6px}
.dossier[hidden]{display:none}
#contexte .bande{position:relative;display:flex;flex-direction:column;min-height:0}
#contexte .bande > .defile{flex:1 1 auto;min-height:0;overflow-y:auto}
/* LA PIÈCE PREND LA HAUTEUR DE SON TEXTE, LES RETENUS TOUT LE RESTE (§4.6) : une
   pièce courte laissait du papier vide pendant que les retenus, plafonnés,
   défilaient dessous. La pièce part de sa taille (`flex-basis:auto`) jusqu'à un
   plafond de 70 % — au-delà, elle défile ; les retenus partent de zéro et
   prennent ce qui reste, plancher compris : à dix-sept fiches, ce sont EUX qui
   défilent, jamais la pièce qui disparaît. */
#contexte .bande.piece{flex:0 1 auto;max-height:70%;min-height:170px;border:1px solid var(--filet);border-radius:8px;overflow:hidden}
#contexte .bande.retenus{flex:1 1 0;min-height:84px}
#contexte .bande.retenus #zoneRetenus{margin:0}
/* §4.6 — LES RETENUS SUIVENT LA PIÈCE (voie B) : repliés, ils ne sont plus
   qu'une ligne, RETENUS · 7, collée sous la pièce ; le plafond de la pièce
   tombe, elle prend tout le reste. Une pièce courte garde la hauteur de son
   texte : la ligne reste sous elle, là où l'on vient de cliquer. */
#contexte.retenusPlies .bande.piece{max-height:none}
#contexte.retenusPlies .bande.retenus{flex:none;min-height:0}
#zoneRetenus.plie{padding:7px 10px}
#zoneRetenus:not(.plie) > .dplier{margin-bottom:6px}
#retenusListe[hidden]{display:none}
.bande.piece .ptete{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px 7px 14px;
  border-bottom:1px solid var(--filet)}
.bande.piece .defile{padding:8px 14px 12px}
#contexte .bande.deborde::after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:26px;
  pointer-events:none;border-radius:0 0 8px 8px;
  background:linear-gradient(to top, var(--panel) 20%, rgba(22,27,34,0))}
/* Le CONTEXTE qui porte une pièce a besoin de plus de hauteur EN DESSOUS DU SEUIL ;
   au-dessus, il a déjà la hauteur pleine de la conversation. */
@media (max-width:899.98px){
  .panneau.avecPiece{max-height:62vh;min-height:320px}
}
/* Panneau ouvert, le composeur cesse de prendre toute la place qu'il veut : il
   défile pour son compte, le panneau non — c'est lui le clavier (§4.6). À TOUTES
   LES LARGEURS. PIÈGE PAYÉ : on l'avait cru inutile au-dessus du seuil, où
   `#composeur` a sa propre rangée du gabarit — mais cette rangée est `auto`, et
   ce qu'elle prend, la place latérale le perd. À 1280×800, la comparaison en
   cours écrasait le CONTEXTE, pièce coupée (retour de playtest, Jean). */
.wrap.avecLateral #composeur{max-height:28vh}
#composeur{flex:none;max-height:46vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 16px}
/* La barre est COLLANTE en bas (`.compo .barre`) : ce qu'on amène dans le champ
   — le bloc que désigne le tutoriel, un focus clavier — s'arrête au-dessus. */
#composeur{scroll-padding-bottom:64px}
#composeur .zone{margin:0}
/* Trop bas pour trois bandes : on rend la main au défilement de la page. */
@media (max-height:560px){
  body{height:auto}
  .wrap{flex:none}
  .col.fil{flex:none}
  .fil .body{max-height:50vh}
  .panneau{max-height:none}
  .panneau .body{max-height:45vh}
  #composeur{max-height:none}
}
/* AU-DESSUS DU SEUIL : la place latérale (CONTEXTE, PLAIDOIRIE, ou la pièce
   ouverte — §4.6) devient une colonne À CÔTÉ de la conversation plutôt qu'EN
   DESSOUS d'elle. Rouvert par un retour de playtest (Colas) : un joueur devait
   fermer la pièce pour relire la question qu'elle recouvrait (§3 PASSATION).
   PIÈGE ÉVITÉ : l'ancienne grille à 3 colonnes (jusqu'au 30 septembre)
   recalculait `grid-column` À LA MAIN sur `.cloture` et `#composeur` à CHAQUE
   état (3 colonnes / 2 / mobile, voir `git show 63a7e06`). Ici, `grid-area` se
   pose UNE SEULE FOIS sur chaque élément, pour toujours ; seul le gabarit
   nommé varie d'un état à l'autre — jamais un span numéroté sur l'élément. */
@media (min-width:900px){
  .wrap.avecLateral{
    display:grid;
    grid-template-columns: minmax(0,1fr) minmax(320px,420px);
    grid-template-rows: minmax(0,1fr) auto auto;
    grid-template-areas:
      "discussion lateral"
      "composeur  composeur"
      "cloture    cloture";
    gap:12px 18px;
  }
  .wrap.avecLateral .col.fil{grid-area:discussion;min-width:0;min-height:0}
  .wrap.avecLateral .panneau{grid-area:lateral;min-width:0;min-height:0;max-height:none}
  .wrap.avecLateral #composeur{grid-area:composeur}
  .wrap.avecLateral .cloture{grid-area:cloture}
  /* LE CONTEXTE PREND LES DEUX TIERS (§4.6, demande de l'auteur) : index, pièce
     et retenus se lisaient à l'étroit dans un tiers. La conversation garde le
     tiers restant, et la question avec elle ; la PLAIDOIRIE, une liste, garde
     sa colonne étroite. Seul le gabarit change, jamais un span. */
  .wrap.avecLateral.avecCONTEXTE{grid-template-columns: minmax(0,1fr) minmax(0,2fr)}
  /* CLIQUER DISCUSSION AGRANDIT LA CONVERSATION (§4.6, retour de Bérengère) : les
     deux colonnes échangent leurs parts. Seul le gabarit change, jamais un span. */
  .wrap.avecLateral.avecCONTEXTE.discussionAgrandie{grid-template-columns: minmax(0,2fr) minmax(0,1fr)}
}
/* En dessous du seuil, le panneau descend à son PLANCHER — deux fiches entières,
   il reste le clavier — et la conversation, seule bande élastique, prend le reste. */
@media (max-width:899.98px){
  .wrap.discussionAgrandie .panneau{max-height:268px}
  .wrap.discussionAgrandie .panneau.avecPiece{max-height:320px}
}
/* --- ce qui se lit au clavier (§4.10) --- un double anneau en `box-shadow`,
   qui ne se bat pas avec l'`outline` du halo du tutoriel. */
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #e6edf3}
.sr{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
kbd{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:0 5px;line-height:1.5}
/* Les croix : un nom, une cible, et Échap lisible là où il agit (§4.10). Les deux
   portes de la barre doivent TRANCHER sur le panneau qui les porte : bord
   accentué et texte plein, jamais le gris d'une étiquette. Ouverte, la porte
   s'inverse — on lit d'un coup d'œil quelle surface est sous les yeux. */
.col > h2 .fermer,.ptete .fermer,#tuto .fermer{display:inline-flex;align-items:center;gap:7px;min-height:32px;
  padding:3px 8px 3px 10px;background:none;border:1px solid var(--line);border-radius:7px;
  color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
.col > h2 .fermer,.ptete .fermer{margin-left:auto}
.col > h2 .fermer:hover,.ptete .fermer:hover,#tuto .fermer:hover{border-color:var(--accent)}
.fermer .x{font-size:20px;line-height:1}
/* La bascule de la DISCUSSION (§4.6) : l'en-tête reste un titre — même corps, même
   gris —, une aide discrète dit qu'il agit, et l'état pressé s'écrit à l'accent,
   pas à la couleur seule : la bordure basse le double (§4.10 règle 5). */
.col > h2 .bascule{flex:1;display:flex;align-items:center;gap:10px;margin:-4px -8px;padding:3px 8px;
  background:none;border:1px solid transparent;border-radius:7px;color:inherit;
  font:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.col > h2 .bascule:hover{border-color:var(--line);color:var(--txt)}
.col > h2 .bascule .sens{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--muted)}
.col > h2 .bascule[aria-pressed="true"]{color:var(--txt);border-bottom-color:var(--accent)}
.col > h2 .bascule[aria-pressed="true"] .sens{color:var(--accent)}
/* Pièce ouverte, Échap la replie : la croix du CONTEXTE perd sa touche — deux
   « × Échap » empilés promettaient deux effets à une seule (§4.10 règle 6). */
#panCONTEXTE.avecPiece > h2 .fermer kbd{display:none}
.ztitle .surfaces{margin-left:auto;display:flex;gap:6px}
.versSurface{background:#20303f;border:1px solid var(--accent);border-radius:7px;
  color:var(--txt);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;
  padding:5px 12px;cursor:pointer}
.versSurface:hover{background:#2b4259}
.versSurface.ouvert{background:var(--accent);border-color:var(--accent);color:#0e1116}
/* §4.3 — un passage vient d'arriver : la porte s'allume UNE fois, là où il est
   allé. Le compte, lui, a changé de toute façon — l'animation n'est qu'un renfort. */
.versSurface.recoit{animation:recoit .9s ease-out 1}
@keyframes recoit{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){ .versSurface.recoit{animation:none} }
/* La fiche qui vient d'arriver s'allume UNE fois, sous la pièce — c'est là que le
   passage est allé (§4.3) ; repliés (voie B), c'est la ligne des retenus. */
.mchip.neuf,#zoneRetenus.plie.neuf{animation:neuf 1.4s ease-out 1}
@keyframes neuf{0%{box-shadow:0 0 0 2px var(--accent);background:#20384b}100%{box-shadow:0 0 0 2px transparent}}
@media (prefers-reduced-motion:reduce){ .mchip.neuf,#zoneRetenus.plie.neuf{animation:none;box-shadow:0 0 0 2px var(--accent)} }
/* --- canal --- */
.msg{margin-bottom:10px;display:flex;flex-direction:column;align-items:flex-start}
.msg.ia{align-items:flex-end}
.msg.suite{margin-top:-4px}
.msg .who{font-size:12.5px;color:var(--muted);margin-bottom:3px}
/* Soixante-dix signes à la ligne, pas cent quinze (§4.9). */
.msg .bubble{max-width:68ch;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.msg.ia .who{color:#6d9cb8}
.msg.ia .bubble{background:#0f2230;border-color:var(--transmis);font-family:var(--mono);font-size:13.5px;color:#bfe0f2}
/* La question que la remise porte (§4.6) : un paragraphe à part, avant les pièces. */
.msg .bubble .qremise{margin-top:10px}
.attach{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;padding:6px 10px;
  background:#12324a;border:1px solid var(--transmis);border-radius:8px;color:#bfe0f2;cursor:pointer;
  font:inherit;font-size:13.5px}
.attach:hover{border-color:var(--accent)}
/* --- zones --- */
.zone{margin-bottom:12px}
#zoneDossier,#zoneRetenus{border:1px solid var(--line);border-radius:8px;
  background:var(--panel2);padding:10px 12px;margin-bottom:12px}
/* L'index PARTAGE le panneau avec les fiches, il n'en est pas le sujet : à huit
   pièces il en mangeait la moitié. Il se resserre — les fiches sont ce qu'on
   vient chercher quand on écrit. */
#zoneDossier{padding:7px 10px;margin-bottom:9px}
.zone .ztitle{font-size:14px;font-weight:600;color:var(--muted);
  margin-bottom:8px;padding:4px 0 6px;display:flex;align-items:center;gap:8px}
.aide{display:block;color:var(--muted);font-size:13px;margin-top:8px;font-style:italic}
/* §4.9 règle 1 : la voix se clique quand le geste qu'elle nomme a lieu dans
   l'autre colonne. Elle ne ressemble PAS à un `.bbloc` — celui-là POSE un bloc,
   celle-ci ne fait que montrer où aller. Et plus de pointillés : dans le cadre
   du composeur, elle passait pour un champ vide, ou une zone de dépôt. */
.versCONTEXTE{display:inline-flex;align-items:center;gap:10px;text-align:left;
  background:#1a2a38;color:var(--txt);font:inherit;font-size:13.5px;font-style:normal;
  border:1px solid var(--accent);border-radius:7px;padding:6px 12px;cursor:pointer}
.versCONTEXTE:hover{background:#223a4e}
.versCONTEXTE .fl{color:var(--accent);font-weight:700}
/* PIÈGE : `.phrase .trou` (le fantôme) vient plus loin, à spécificité égale —
   d'où la double classe : sans elle, la voix cliquable repassait en italique
   grisé, l'air d'un champ vide. */
.phrase .trou.versCONTEXTE{color:var(--txt);font-style:normal}
.aide.question{margin-top:0;margin-bottom:10px;color:var(--txt);border-left:2px solid var(--muted);padding-left:8px}
/* --- les empans dans le texte d'une pièce --- la couleur ET le trait (§4.3) ;
   le soulignement est une DÉCORATION, pas une bordure : il suit la coupure de
   ligne, et l'épaisser ne décale rien. Retenu, le fond se remplit — jamais de
   graisse, qui décalait le texte autour. */
.piecetexte{line-height:1.9}
/* §4.3 — LE MARQUAGE NE SE MONTRE QU'AU SURVOL OU AU CLIC (demande de l'auteur) :
   le texte se lit nu ; un passage se souligne et prend son fond quand on passe
   dessus ou qu'on l'atteint au clavier (`:focus-visible`, §4.10 règle 1), et
   garde sa marque une fois retenu — au toucher, c'est le clic qui la pose. La
   décoration reste POSÉE, seulement transparente : rien ne bouge au survol.
   Uniforme toujours : tous les passages se cachent et se montrent pareil. */
.empan{text-decoration-line:underline;text-decoration-style:var(--ds,solid);
  text-decoration-color:transparent;text-decoration-thickness:2px;
  text-underline-offset:.26em;text-decoration-skip-ink:none;
  border-radius:2px;padding:1px 1px;cursor:pointer;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;background:transparent}
.empan:hover,.empan:focus-visible{text-decoration-color:var(--dc,var(--muted));
  background:color-mix(in srgb, var(--dc,#888) 18%, transparent)}
.empan.pris{text-decoration-color:var(--dc,var(--muted));
  background:color-mix(in srgb, var(--dc,#888) 32%, transparent);text-decoration-thickness:3px}
/* --- contexte : une seule liste, qui sert AUSSI de clavier au composeur --- */
.dimgrp{margin-bottom:9px}
.dimgrp .dnom{font-size:12px;color:var(--dc,var(--muted));text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
/* §4.5 : le CONTEXTE s'assombrit PAR DIMENSION — par la couleur, plus par une
   transparence qui éteignait le contraste (§4.10 règle 5). */
.dimgrp.horsdim .dnom{color:var(--muted)}
.dimgrp.horsdim .mchip{border-left-color:var(--line);background:#181e27}
.dimgrp.horsdim .mchip .corps{color:var(--muted)}
.mchip{display:flex;align-items:stretch;margin:3px 0;background:var(--panel2);
  border:1px solid var(--line);border-left:3px solid var(--dc,var(--line));border-radius:6px;overflow:hidden}
.mchip:hover{border-color:var(--accent)}
/* PIÈGE : sans `min-width:0`, un item de flex refuse de rétrécir sous son
   contenu — la citation pousserait la puce hors du cadre. */
.mchip .corps{flex:1;min-width:0;text-align:left;background:none;border:none;color:var(--txt);
  padding:6px 9px;cursor:pointer;font:inherit;font-size:13.5px;line-height:1.4}
.mchip .corps:disabled,.mchip .corps[aria-disabled="true"]{cursor:default;color:var(--muted)}
/* §4.6 — le CONTEXTE dit l'état de la phrase : ce qu'on y a pris s'ÉCRIT (§4.10
   règle 5), et la raison d'un refus se lit en clair, au-dessus des fiches. */
.mchip.pris{border-color:var(--accent)}
.mchip .dansPhrase{margin-left:8px;padding:0 6px;border:1px solid var(--accent);border-radius:4px;
  font-size:12px;font-style:normal;color:var(--accent);white-space:nowrap}
/* Elle COLLE en tête de ce qui défile : touchée au bas de dix fiches, la fiche
   refusée amène la bande à elle, et la raison partait hors champ. Une ligne, et
   seulement phrase pleine — pas l'index collant qui mangeait le panneau (§4.6). */
.raison{position:sticky;top:0;z-index:1;margin:0 0 8px;padding:6px 10px;border-left:3px solid var(--muted);
  background:var(--panel2);color:var(--txt);font-size:13px}
.raison.rappelle{border-left-color:var(--warn)}
.mchip .nom{display:block}
.mchip .prov{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.mchip .cit{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip .sig{flex:none;font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.mchip .del{background:none;border:none;border-left:1px solid var(--line);color:var(--muted);
  font:inherit;font-size:12.5px;min-width:34px;padding:0 10px;cursor:pointer;align-self:stretch}
.mchip .del:hover{color:#e6b0b0}
/* La puce rogne ce qui déborde (`overflow:hidden`) : l'anneau passe DEDANS. */
.mchip .corps:focus-visible,.mchip .del:focus-visible{box-shadow:inset 0 0 0 2px #e6edf3}
/* §4.6 — LA FICHE D'UN ARTICLE EST LE BOUTON DE SA LIAISON (passe F) : hors des
   dimensions, sans leur couleur ; la marque de ce qui fonde, celle que portait
   le bouton d'article au composeur (`.bbloc.fondement`). */
.dimgrp.articles .dnom{color:var(--muted)}
.mchip.article{border-left-color:var(--transmis)}
/* --- composeur --- un trait plein : les pointillés dans les pointillés
   faisaient croire à une zone de dépôt (§4.9). */
.compo{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#141a21}
.phrase{min-height:34px;font-size:14.5px;line-height:1.7;margin-bottom:9px}
.phrase .bl{border-bottom:1px solid var(--line);padding:0 2px}
.phrase .bl.terme{border-bottom:2px solid var(--dc,var(--accent))}
.phrase .trou{color:var(--muted);font-style:italic}
.phrase .bl.terme.pose{display:inline-block;vertical-align:top;max-width:100%;
  padding:2px 5px;margin:1px 0;border-radius:4px 4px 0 0;
  background:color-mix(in srgb, var(--dc,#888) 10%, transparent)}
.phrase .bl.terme.pose .nom{display:block;line-height:1.35}
.phrase .bl.terme.pose .prov{display:flex;align-items:baseline;gap:6px;margin-top:1px}
.phrase .bl.terme.pose .cit{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phrase .bl.terme.pose .sig{flex:none;font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.offre{display:flex;flex-direction:column;gap:4px}
.offre .lab{font-size:12.5px;color:var(--muted);margin-top:6px}
.bbloc{text-align:left;background:#20303f;color:var(--txt);border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;cursor:pointer;font:inherit;font-size:13.5px}
.bbloc:hover{border-color:var(--accent)}
/* Le geste qui parle pèse plus que ceux qui défont (§4.9) — et §4.6 : « → Envoyer »
   NE PASSE JAMAIS SOUS LE PLI. PIÈGE MESURÉ : les propositions d'article allongent
   le composeur au-delà de son plafond, et la barre descendait avec elles — à trois
   articles offerts, bandeau du tutoriel affiché et panneau ouvert, elle sortait du
   cadre. Collée au bas de ce qui défile, elle reste là quelle que soit la longueur
   de l'offre. Le fond est celui de `.compo`, et les marges négatives le portent
   jusqu'aux bords. */
.compo .barre{display:flex;align-items:center;gap:6px;margin:8px 0 0;
  position:sticky;bottom:-9px;z-index:2;
  margin-left:-11px;margin-right:-11px;padding:8px 11px 9px;background:#141a21}
.compo .barre button{background:none;border:1px solid transparent;color:var(--muted);
  border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px}
.compo .barre button:hover{border-color:var(--line);color:var(--txt)}
.compo .barre .envoi{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#0b1620;
  font-size:15px;font-weight:700;padding:8px 20px;border-radius:8px}
.compo .barre .envoi:hover{background:#8ec8e6;border-color:#8ec8e6;color:#0b1620}
.compo .barre .dejaEnvoyee{margin-left:auto;color:var(--muted);font-size:13px;font-style:italic;padding:8px 4px}
.refus{color:#e6b0b0;font-size:13px;margin-top:8px}
.bbloc.fondement{background:#25313d;border-left:3px solid var(--transmis)}
/* §4.5 — les deux relations au choix (passe G) : pareilles, côte à côte — aucune
   ne se distingue de l'autre. */
.bbloc.relation{border-left:3px solid var(--muted)}
.offre .relations{display:flex;flex-wrap:wrap;gap:8px}
/* --- plaidoirie --- */
.liste{list-style:none;padding:0;margin:0}
.liste li{font-size:13.5px;padding:8px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.liste li:first-child{border-top:none}
.liste li .txt{flex:1;line-height:1.45}
.liste li .up{background:#12324a;color:#bfe0f2;border:1px solid var(--transmis);border-radius:5px;
  padding:3px 8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.liste li .up:hover{border-color:var(--accent)}
.liste li .sent{color:#6d9cb8;font-size:12.5px;white-space:nowrap}
.plaid li{border-left:3px solid var(--transmis);padding-left:9px}
.plaid li .contre{display:block;font-size:12px;color:var(--muted);font-family:var(--mono)}
/* répétition de plaidoirie */
.repet{border:1px dashed #5a3a3a;border-radius:8px;padding:11px;background:#1a1416;margin-bottom:14px}
.repet .rtitle{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
/* L'affirmation redite EN TÊTE du cadre (§4.6) ; les phrases en corps de texte,
   plus en petit gris : c'est ce qu'on trie (retour de Colas). */
.repet .raff{margin:0 0 10px;padding:6px 10px;border-left:3px solid #8a5a5a;background:#221a1c;
  color:var(--txt);font-size:14px;line-height:1.5}
.repet .rnote{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt);padding:7px 0;
  border-top:1px solid #3a2a2c}
.repet .rnote .sent{font-size:12.5px;color:var(--muted);white-space:nowrap}
.repet .rnote .txt{flex:1}
.repet .rnote.vide{font-style:italic}
.repet .up{background:#12324a;color:#bfe0f2;border:1px solid var(--transmis);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12.5px}
.repet .btn{margin-top:8px;width:100%;background:#20303f;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px;cursor:pointer;font:inherit;font-size:13.5px}
.repet .btn:hover{border-color:var(--accent)}
/* --- clôture / fin --- sur une ligne : la colonne tient dans la fenêtre. */
.cloture{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:0 2px}
.cloture #btnCloture{background:#2a1c1c;color:#e0b7b7;border:1px solid #5a3a3a;border-radius:8px;
  padding:8px 18px;cursor:pointer;font:inherit;font-size:14px}
.cloture #btnCloture:disabled{background:#1b1719;color:#9a8e92;border-color:#3a3033;cursor:not-allowed}
.cloture .hint{flex:1;min-width:220px;color:var(--muted);font-size:13px}
.cloture .recommencer{margin-left:auto;display:flex;gap:6px}
.cloture .recommencer button{background:none;border:1px solid var(--line);
  color:var(--muted);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:6px;cursor:pointer}
.cloture .recommencer button:hover{color:var(--txt);border-color:var(--muted)}
#btnRecommencer.confirmer{color:#f0c4c4;border-color:#8a4a4a;background:#2a1c1c}
#btnAnnulerRecommencer[hidden]{display:none}
/* modal générique */
.overlay{position:fixed;inset:0;background:rgba(6,8,11,.72);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:620px;width:100%;
  max-height:82vh;overflow-y:auto;padding:20px}
.modal h3{margin:0 0 8px;font-size:17px}
/* Le titre de l'écran de fin n'est qu'un point d'arrivée du focus (§4.10) :
   pas d'anneau. L'écran est terminal, sans croix (§4.9 règle 5). */
#modalTitre:focus{outline:none;box-shadow:none}
.modal .btnrow{margin-top:10px}
.modal .btnrow button{width:100%;background:#20303f;color:var(--txt);border:1px solid var(--line);
  border-radius:6px;padding:8px;cursor:pointer;font:inherit}
.fin h3{font-size:19px}
.fin .verdict{font-family:var(--mono);color:var(--warn);margin:4px 0 14px}
small.note{color:var(--muted)}
code{font-family:var(--mono);color:var(--accent)}
/* --- LE PAPIER (§4.6) : la pièce ouverte vient du monde, pas de la machine —
   et depuis qu'elle vit dans la place LATÉRALE comme un panneau, elle reste de
   PAPIER d'un bout à l'autre, EN-TÊTE COMPRIS, pour trancher sur le CHROME des
   deux autres panneaux. Les teintes des passages y sont FONCÉES dans l'espace
   OKLab — la palette ne se double pas — et restent au-dessus de 3:1 sur le
   papier, mesurées. --- */
.bande.piece{color-scheme:light;background:var(--papier);color:var(--encre);border-color:var(--filet);
  font-family:var(--serif)}
.bande.piece .ptete{background:var(--papier);color:var(--encre);border-color:var(--filet)}
.bande.piece #pieceTitre{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.bande.piece small.note{display:block;color:var(--encre2);font-style:italic;font-size:13.5px;
  padding-bottom:10px;border-bottom:1px solid var(--filet);margin-bottom:6px}
/* Un corps de LECTURE, pas d'affiche (§4.6) : à 17 px, une pièce ne tenait pas
   dans son cadre. L'interligne garde la place du ✓ posé au-dessus d'un passage. */
.bande.piece .piecetexte{font-size:15px;line-height:1.75;margin:12px 0 6px}
/* UNE BORDURE À PEINE VISIBLE, NEUTRE ET ARRONDIE suggère qu'un passage se clique
   (§4.3) : la même pour tous, elle ne dit ni la dimension ni la pertinence, et
   se devine plus qu'elle ne se voit. Posée d'office, elle ne bouge jamais — le
   survol ne change que sa teinte. */
.bande.piece .empan{--dcp:color-mix(in oklab, var(--dc,#888) 70%, black);
  border:1px solid color-mix(in srgb, var(--encre) 10%, transparent);border-radius:4px;padding:0 2px}
.bande.piece .empan:hover{border-color:color-mix(in srgb, var(--encre) 30%, transparent)}
.bande.piece .empan:hover,.bande.piece .empan:focus-visible{text-decoration-color:var(--dcp);
  background:color-mix(in srgb, var(--dcp) 16%, transparent)}
.bande.piece .empan.pris{text-decoration-color:var(--dcp);background:color-mix(in srgb, var(--dcp) 26%, transparent)}
/* §4.3 / §4.10 règle 5 — l'état s'ÉCRIT : un ✓ en exposant, HORS DU FLUX, pour que
   le texte autour ne bouge pas. Le texte alternatif vide le tait au lecteur
   d'écran, qui a déjà « retenu » dans le `.sr` du passage. */
.bande.piece .empan.pris{position:relative}
.bande.piece .empan.pris::after{content:"✓" / "";position:absolute;top:-.95em;right:-.35em;
  font-family:var(--sans);font-size:13px;font-weight:700;line-height:1;color:var(--dcp)}
.bande.piece .fermer{color:var(--encre);border-color:var(--filet);font-family:var(--sans)}
.bande.piece .fermer:hover{border-color:var(--encre2)}
.bande.piece kbd{color:var(--encre2);border-color:var(--filet)}
.bande.piece :focus-visible{box-shadow:0 0 0 2px var(--papier),0 0 0 4px #1d3b57}
/* Un article n'est pas un témoignage : un double filet le distingue. */
.bande.piece.regle{border-left:6px double #b3a37f}
/* §4.11 — CE QU'UN ARTICLE RÉGIT (`porte`) SE MARQUE, sans un mot : son texte est
   encadré de la couleur ET du trait de chaque dimension — le code des passages,
   foncé par le papier comme eux (`--dcp`). Deux dimensions, deux cadres. */
.bande.piece .cadre{--dcp:color-mix(in oklab, var(--dc,#888) 70%, black);
  border:3px var(--ds,solid) var(--dcp);border-radius:7px;padding:2px 10px;margin:10px 0 4px}
.bande.piece .cadre .cadre{margin:0;padding:3px 8px}
.bande.piece .cadre .piecetexte{margin:6px 0}
/* PIÈGE : une bordure CSS ne sait pas onduler. L'ondulé se dessine par un MASQUE
   (une vague par bord) sur un calque de la couleur : la variable passe, ce
   qu'une image de bordure en SVG ne saurait pas faire. */
.bande.piece .cadre.ondule{position:relative;border-color:transparent}
.bande.piece .cadre.ondule::before{content:"";position:absolute;inset:-3px;border-radius:7px;pointer-events:none;
  background:var(--dcp);
  --vh:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='6'><path d='M0 3 Q3 0.5 6 3 T12 3' fill='none' stroke='black' stroke-width='1.8'/></svg>");
  --vv:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='12'><path d='M3 0 Q0.5 3 3 6 T3 12' fill='none' stroke='black' stroke-width='1.8'/></svg>");
  -webkit-mask:var(--vh) top/12px 6px repeat-x,var(--vh) bottom/12px 6px repeat-x,
    var(--vv) left/6px 12px repeat-y,var(--vv) right/6px 12px repeat-y;
  mask:var(--vh) top/12px 6px repeat-x,var(--vh) bottom/12px 6px repeat-x,
    var(--vv) left/6px 12px repeat-y,var(--vv) right/6px 12px repeat-y}
.bande.piece .rappel{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--encre2);
  background:#ebe4d4;color:var(--encre);font-family:var(--sans);font-size:14px}
/* PIÈGE PAYÉ (le 4 octobre, le temps d'une passe) : la ligne a été COLLÉE au bas
   de la pièce pour rester sous les yeux — dans la bande étroite du CONTEXTE,
   elle couvrait le texte même qu'on venait de cliquer. Elle reste dans le flux ;
   ce qui se voit à coup sûr, c'est la fiche neuve juste dessous (`.mchip.neuf`). */
.bande.piece .rappel.retenu{border-left-color:#3d6b3f;background:#e3ead8}
/* Le papier n'emprunte pas la barre de défilement SOMBRE des deux autres
   panneaux (§4.6), ni leur dégradé de débordement foncé pour le CHROME. */
.bande.piece .defile::-webkit-scrollbar-track{background:#e8e1d0}
.bande.piece .defile::-webkit-scrollbar-thumb{background:#b3a37f;border:2px solid var(--papier)}
.bande.piece .defile::-webkit-scrollbar-thumb:hover{background:#9c8d68}
#contexte .bande.piece.deborde::after{background:linear-gradient(to top, var(--papier) 20%, rgba(244,239,228,0))}
/* --- l'index du dossier : les pièces d'abord, les règles ensuite --- */
.dossier{display:flex;flex-direction:column;gap:5px;padding:0}
.dcol{min-width:0;display:flex;gap:8px;align-items:baseline}
.dcol .dtitre{flex:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.dcol .dchips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dcol .dvide{color:var(--muted);font-size:12.5px;font-style:italic}
/* La puce porte le TITRE de la pièce, celui sous lequel la DISCUSSION l'a
   transmise (§4.6) : de la prose, donc ni mono ni corps de matricule. */
.dchip{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;
  border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:3px 7px;cursor:pointer;color:var(--txt)}
.dchip:hover{border-color:var(--accent)}
.dchip.vu{color:var(--muted);background:#181e27}
.dchip.regle{border-color:#4a4030;color:var(--warn)}
.panne{flex:none;background:#2a1c1c;color:#e0b7b7;border:1px solid #5a3a3a;border-radius:8px;padding:12px;margin:16px 20px}
/* --- le tutoriel (§4.8) : le halo ENTOURE la zone, jamais un empan (§4.3).
   Aucun voile : il intercepterait les clics qu'il prétend montrer. --- */
[data-tuto]{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;
  animation:pouls 1.8s ease-in-out infinite}
@keyframes pouls{0%,100%{outline-color:var(--accent)}50%{outline-color:transparent}}
[data-tuto="alerte"]{outline-color:var(--warn);animation-name:poulsAlerte}
@keyframes poulsAlerte{0%,100%{outline-color:var(--warn)}50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){ [data-tuto]{animation:none} }
/* UNE BULLE ANCRÉE AU HALO (§4.8) — en surimpression, elle ne décale rien :
   `placerTuto` pose `left`/`top`, le côté (`data-cote`) et la place de la
   flèche (`--fx`, `--fy`) à chaque rendu, au défilement et au redimensionnement.
   C'est ce placement, plus le flux, qui la garde hors de sa propre ancre. */
#tuto{position:fixed;left:16px;top:16px;z-index:60;width:max-content;
  max-width:min(380px,calc(100vw - 32px));
  background:#20303f;border:2px solid var(--accent);border-radius:10px;
  padding:12px 16px 14px;font-size:15px;line-height:1.45;box-shadow:0 10px 34px rgba(0,0,0,.6)}
#tuto[hidden]{display:none}
/* La flèche : un losange du fond de la bulle, posé sur sa bordure, qui n'en
   garde que les deux côtés tournés vers la zone. */
#tuto[data-cote]::before{content:"";position:absolute;width:14px;height:14px;
  background:#20303f;border:2px solid var(--accent);transform:rotate(45deg)}
#tuto[data-cote="dessous"]::before{top:-8px;left:calc(var(--fx,24px) - 7px);border-right:0;border-bottom:0}
#tuto[data-cote="dessus"]::before{bottom:-8px;left:calc(var(--fx,24px) - 7px);border-left:0;border-top:0}
#tuto[data-cote="droite"]::before{left:-8px;top:calc(var(--fy,24px) - 7px);border-top:0;border-right:0}
#tuto[data-cote="gauche"]::before{right:-8px;top:calc(var(--fy,24px) - 7px);border-bottom:0;border-left:0}
#tuto[data-alerte]::before{border-color:var(--warn)}
#tuto[data-reduit]::before{display:none}
/* Chaque consigne neuve s'affiche développée (#tutoCorps), puis se réduit en
   icône dès le rendu suivant (§4.8) — jamais les deux formes à la fois. PIÈGE :
   `#tutoCorps`/`.tutoIcone` posent `display:grid`/`inline-flex`, qui BATTENT
   `[hidden]{display:none}` — même piège déjà payé pour `.col` (ligne ~77).
   La consigne, et la croix à sa droite (§4.8) — plus de rang : la bulle ne
   compte pas. */
#tutoCorps{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
#tutoCorps[hidden]{display:none}
#tuto .dit{grid-column:1;grid-row:1;padding-top:4px}
#tuto .fermer{grid-column:2;grid-row:1;padding:3px 8px}
#tuto[data-reduit]{padding:4px;border-radius:999px}
#tuto[data-alerte]{border-color:var(--warn)}
#tuto[data-alerte] .dit{color:var(--warn)}
#tuto[data-alerte] .tutoIcone{color:var(--warn);border-color:var(--warn)}
/* L'icône ne dit rien à l'écran — tout le contexte perdu visuellement (le
   texte court de la consigne) vit dans son aria-label, recalculé à
   chaque consigne (§4.10). */
.tutoIcone{display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;background:none;border:1px solid var(--accent);
  color:var(--accent);font:inherit;font-size:16px;font-weight:700;cursor:pointer;padding:0}
.tutoIcone:hover{background:var(--accent);color:#0e1116}
.tutoIcone[hidden]{display:none}
/* §4.6 — changer de pièce en un clic : ‹ et › dans la tête de la pièce, juste
   avant la croix. Même cadre qu'elle, pour se lire comme un geste du papier. */
.ptete .voisine{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:32px;
  padding:0 6px;background:none;border:1px solid var(--filet);border-radius:7px;color:var(--encre);
  font:inherit;font-family:var(--sans);font-size:20px;line-height:1;cursor:pointer}
.ptete .voisine:hover{border-color:var(--encre2)}
.ptete .voisine + .fermer{margin-left:0}
.ptete h3 + .voisine{margin-left:auto}
/* Au doigt, il n'y a pas d'Échap à lire (§4.10 règle 6 vaut pour le clavier) :
   la place rendue garde au titre de la pièce une ligne de plus sur un téléphone. */
@media (pointer:coarse){ .ptete .fermer kbd{display:none} }

</style>
</head>
<body>

<!-- LE TUTORIEL (§4.8) — une BULLE, boîte de dialogue NON bloquante : en
     surimpression, elle ne décale rien, et `placerTuto` l'ancre à côté du halo
     — c'est ce placement, plus le flux, qui l'empêche de recouvrir ses propres
     ancres. Premier enfant de <body>, hors de `.wrap` : premier arrêt de
     tabulation, et vivante si `finir` rend `.wrap` inerte. -->
<div id="tuto" role="dialog" aria-label="Tutoriel" hidden>
  <div id="tutoCorps">
    <span class="dit" id="tutoDit"></span>
    <!-- La croix des autres fenêtres (§4.8), sans Échap : il appartient aux panneaux. -->
    <button class="fermer" id="tutoPasser" onclick="tutoPasser()" aria-label="Fermer le tutoriel pour de bon"><span class="x" aria-hidden="true">×</span></button>
  </div>
  <button class="tutoIcone" id="tutoIcone" hidden onclick="tutoAgrandir()" aria-label="Revoir la consigne du tutoriel">?</button>
</div>

<div class="wrap">
  <!-- Un en-tête nomme la SURFACE (§4.6), jamais les zones qu'elle contient.
       CONTEXTE ouvert, celui-ci devient aussi la bascule qui agrandit la
       conversation (`enteteDISCUSSION`) : la section reste nommée par son nom. -->
  <section class="col fil" aria-labelledby="nomDISCUSSION">
    <h2 id="titreDISCUSSION"><span id="nomDISCUSSION">DISCUSSION</span></h2>
    <div class="body" id="discussion"></div>
  </section>
  <!-- LA PLACE LATÉRALE (§4.6) — PIÈGE : sa PLACE DANS LE DOCUMENT est toute la
       mécanique. Deux occupants, un seul à la fois : CONTEXTE et PLAIDOIRIE — la
       pièce ouverte vit DANS le CONTEXTE (§4.6). En dessous du seuil de
       `.wrap.avecLateral`, elle s'ouvre ENTRE la conversation et le composeur,
       empilée, SANS rien recouvrir. Au-dessus, elle devient une colonne À CÔTÉ
       de la conversation — la question reste sous les yeux même pièce ouverte.
       Les déplacer ailleurs dans `.wrap`, ou les sortir du flux, défait tout
       ça — et aucune suite ne voit une géométrie. -->
  <!-- Les croix ont un NOM, et Échap s'y lit (§4.10) : `title` n'était qu'une
       description, le lecteur d'écran annonçait « × ». -->
  <section class="col panneau" id="panCONTEXTE" hidden aria-labelledby="titreCONTEXTE">
    <h2><span id="titreCONTEXTE" tabindex="-1">CONTEXTE</span><button class="fermer" onclick="fermerPanneau()" aria-label="Fermer le CONTEXTE (Échap)" aria-keyshortcuts="Escape"><span class="x" aria-hidden="true">×</span><kbd>Échap</kbd></button></h2>
    <div class="body" id="contexte"></div>
  </section>
  <section class="col panneau" id="panPLAIDOIRIE" hidden aria-labelledby="titrePLAIDOIRIE">
    <!-- Pas de compte ici : la barre du composeur le porte, et il reste
         visible panneau ouvert ou fermé (§4.9 règle 3). -->
    <h2><span id="titrePLAIDOIRIE">PLAIDOIRIE</span><button class="fermer" onclick="fermerPanneau()" aria-label="Fermer la PLAIDOIRIE (Échap)" aria-keyshortcuts="Escape"><span class="x" aria-hidden="true">×</span><kbd>Échap</kbd></button></h2>
    <div class="body" id="plaidoirie"></div>
  </section>
  <!-- LA PIÈCE OUVERTE n'a plus de section à elle : elle s'ouvre DANS le
       CONTEXTE, entre l'index et les passages retenus (§4.6) — `#panPiece` naît
       donc du rendu de `#contexte`, plus d'ici. -->
  <!-- On répond SOUS la question (§4.6). PIÈGE : `#composeur` est le FRÈRE de
       `#discussion`, jamais son enfant — le fil se recale en bas à chaque
       message, la phrase qu'on écrit ne doit pas partir avec lui. Il est aussi
       le frère de `.scene`, et c'est ce qui le garde visible sous un panneau. -->
  <div id="composeur" role="region" aria-label="RÉPONSE"></div>
  <!-- Sur une ligne : la colonne tient dans la fenêtre (§4.6). La confirmation
       de « recommencer » attend qu'on réponde — jamais un minuteur (§4.10). -->
  <div class="cloture">
    <button id="btnCloture" onclick="cloturer()" disabled hidden>Je n'ai rien d'autre</button>
    <div class="hint" id="clotureHint" hidden>Tu peux encore écrire.</div>
    <span class="recommencer">
      <button id="btnRecommencer" onclick="recommencer()" title="Effacer la partie en cours et repartir de la remise 1">⟲ recommencer</button>
      <button id="btnAnnulerRecommencer" onclick="annulerRecommencer()" hidden>annuler</button>
    </span>
  </div>
</div>

<div id="modalRoot"></div>

<!-- LA VOIX D'ANNONCE (§4.10) — PIÈGE : dans le HTML STATIQUE, et HORS de
     `.wrap`. Une région créée au moment d'annoncer ne dit pas sa première
     phrase ; une région dans `.wrap` se tait quand la pièce la rend inerte. -->
<div id="annonce" class="sr" aria-live="polite"></div>

<script>
// Le moteur de la grammaire, en mode double (`require` ou `<script src>`).
// Aucune donnée : on reçoit GRAMMAIRE / CHAMPS / LIENS et on rend les fonctions
// pures qui composent, valident et reconnaissent une phrase (§14).
function creerMoteur(GRAMMAIRE, CHAMPS, LIENS) {
  const G = GRAMMAIRE;
  const C = Object.fromEntries(CHAMPS.map(c => [c.id, c]));
  const estFinal = e => G.finaux.includes(e);
  const offerts = e => G.blocs.filter(b => b.de === e);

  /* ---- LA VÉRIFICATION (§4.5) ---- la relation VRAIE se calcule de la dimension
     et des valeurs. Depuis la passe G, le joueur la déclare et le moteur la
     vérifie : `deduire` est l'oracle, il ne rédige plus — sauf pour un contenu
     d'avant, dont le second terme porte encore `deduit` (§11). */
  const enNombre = v => {
    const s = String(v == null ? "" : v).trim();
    if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    const m = s.match(/^(\d{1,2}):(\d{2})$/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  };
  function comparer(a, b) {
    const x = enNombre(a), y = enNombre(b);
    if (x !== null && y !== null) return x < y ? -1 : x > y ? 1 : 0;
    const sa = String(a), sb = String(b);
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  }
  // La forme qui lie deux empans. L'ORDRE de déclaration tranche les ambiguïtés
  // (§11). Dimensions différentes : la JUXTAPOSITION si le contenu en déclare
  // une, sinon null (§4.11) — ce sont les règles qui la refusent en session 1.
  // PIÈGE : elle n'entre jamais dans la boucle — déclarée plus haut, elle
  // passerait pour une « différence » entre deux passages de même dimension.
  const estJuxta = f => f.deduction === "juxtaposition" && (f.arite || 2) === 2;
  function deduire(idA, idB) {
    const a = C[idA], b = C[idB];
    if (!a || !b || idA === idB) return null;
    if (a.dim !== b.dim)
      return (Object.entries(G.formes).find(([, f]) => estJuxta(f)) || [null])[0];
    const egal = comparer(a.valeur, b.valeur) === 0;
    for (const [nom, f] of Object.entries(G.formes)) {
      if (!f.deduction || (f.arite || 2) !== 2 || estJuxta(f)) continue;
      const s = f.slots && f.slots[0];
      if (s !== "*" && !(s || []).includes(a.dim)) continue;
      if (f.deduction === "egalite" ? egal : !egal) return nom;
    }
    return null;
  }
  /* LES DEUX RELATIONS D'UNE DIMENSION (passe G) : de chaque côté — égalité, puis
     différence ou ordre —, la PREMIÈRE forme déclarée qui la nomme, celle que
     `deduire` rendrait. La vraie est donc toujours l'une des deux. */
  const nomme = (f, d) => !!f.deduction && !estJuxta(f) && (f.arite || 2) === 2 && !!f.slots
    && (f.slots[0] === "*" || (f.slots[0] || []).includes(d));
  function relationsDe(d) {
    const fs = Object.entries(G.formes);
    const egal = fs.find(([, f]) => nomme(f, d) && f.deduction === "egalite");
    const autre = fs.find(([, f]) => nomme(f, d) && f.deduction !== "egalite");
    return [egal, autre].filter(Boolean).map(([nom]) => nom);
  }
  /* UNE RELATION FAUSSE : une comparaison, emboîtée ou non, dont la forme n'est
     pas celle que donnent les valeurs. Elle part, et l'avocat la refuse (§4.5). */
  function fausse(r) {
    if (!r || typeof r !== "object") return false;
    const f = G.formes[r.forme] || {};
    const t = r.termes || [];
    if (f.deduction && !estJuxta(f) && (f.arite || 2) === 2 && t.length === 2
        && t.every(x => typeof x === "string") && deduire(t[0], t[1]) !== r.forme) return true;
    return t.some(x => typeof x === "object" && fausse(x));
  }
  function ordonner(forme, termes) {
    const f = G.formes[forme];
    if (!f || !f.ordonne || termes.length !== 2) return termes;
    if (termes.some(t => typeof t === "object" || !C[t])) return termes;
    const [x, y] = termes;
    const inverser = (f.sens || "asc") === "asc"
      ? comparer(C[x].valeur, C[y].valeur) > 0
      : comparer(C[x].valeur, C[y].valeur) < 0;
    return inverser ? [y, x] : [x, y];
  }

  // Une chaîne de blocs → sa forme réduite. Un bloc `relation` pose la forme que
  // le joueur a CHOISIE (passe G) ; `deduit` la fait DÉDUIRE des deux termes (un
  // contenu d'avant) ; `imbrique` EMBOÎTE ce qui précède. Sans aucun : la
  // dernière forme gagne, termes à plat (§11).
  function reduire(ch) {
    let termes = [], forme = null;
    for (const p of ch) {
      const b = p.bloc;
      if (b.type === "terme") termes.push(p.valeur);
      if (b.deduit || b.type === "relation") {
        forme = termes.length === 2 ? (b.deduit ? deduire(termes[0], termes[1]) : p.valeur || null) : null;
        if (forme) termes = ordonner(forme, termes);
      } else if (b.forme) {
        if (b.imbrique) termes = [{ forme, termes }];
        forme = b.forme;
      }
    }
    return { forme, termes };
  }
  const dimDe = t => (typeof t === "object" ? "affirmation" : C[t].dim);
  function valider(r) {
    const f = G.formes[r.forme];
    if (!f) return "ces deux-là ne se comparent pas";
    if (r.termes.length !== f.arite) return "arité";
    for (let i = 0; i < r.termes.length; i++) {
      const s = f.slots[i], d = dimDe(r.termes[i]);
      if (s !== "*" && !s.includes(d)) return `slot ${i} refuse « ${d} »`;
      // PIÈGE : un terme EMBOÎTÉ doit tenir pour lui-même — « affirmation » est
      // une catégorie que tout objet satisfait, et la qualification est le seul
      // chemin de clôture (§4.5).
      if (typeof r.termes[i] === "object") {
        const err = valider(r.termes[i]);
        if (err) return err;
      }
    }
    if (f.relation === "meme_dim") {
      const ds = r.termes.map(dimDe);
      if (new Set(ds).size !== 1) return "dimensions différentes";
      if (r.termes[0] === r.termes[1]) return "terme répété";
    }
    return null;
  }
  const memeTerme = (a, b) => (typeof a === "object" || typeof b === "object")
    ? (typeof a === "object" && typeof b === "object" && memeRed(a, b))
    : a === b;
  function memeRed(x, y) {
    if (x.forme !== y.forme || x.termes.length !== y.termes.length) return false;
    const f = G.formes[x.forme];
    if (f.ordonne) return x.termes.every((t, i) => memeTerme(t, y.termes[i]));
    return x.termes.every(t => y.termes.some(u => memeTerme(t, u)))
        && y.termes.every(t => x.termes.some(u => memeTerme(t, u)));
  }
  const lienDe = r => LIENS.find(l => memeRed({ forme: l.forme, termes: l.termes }, r));
  const nomDe = v => (C[v] ? (C[v].nom || C[v].texte) : String(v));
  const citeDe = v => {
    const c = C[v]; if (!c) return String(v);
    return (c.nom || c.texte) + " : « " + c.texte + " »" + (c.court ? " (" + c.court + ")" : "");
  };
  function rendre(ch) {
    let bouts = [], termes = [], forme = null;
    for (const p of ch) {
      const b = p.bloc;
      // PIÈGE : un bloc peut être terme ET `deduit` — les deux traitements
      // s'enchaînent, jamais l'un ou l'autre.
      if (b.type === "terme") {
        termes.push(p.valeur);
        bouts.push(b.source === "note" ? b.texte : nomDe(p.valeur));
      } else if (b.texte) bouts.push(b.texte);
      if (b.deduit || b.type === "relation") {
        forme = termes.length === 2 ? (b.deduit ? deduire(termes[0], termes[1]) : p.valeur || null) : null;
        const f = forme && G.formes[forme];
        if (f && f.patron) {
          const ord = ordonner(forme, termes);
          bouts.splice(bouts.length - 2, 2,
            f.patron.replace("{a}", nomDe(ord[0])).replace("{b}", nomDe(ord[1])));
          termes = ord;
        }
      } else if (b.forme) {
        // PIÈGE : le flag est porté par la LIAISON, jamais par le terme — la
        // voie de comparaison partage le même bloc de premier terme.
        if (b.cite && termes.length === 1 && typeof termes[0] === "string")
          bouts.splice(bouts.length - 1, 1, citeDe(termes[0]));
        if (b.imbrique) termes = [{ forme, termes }];
        forme = b.forme;
      }
    }
    return bouts.filter(t => t != null && t !== "")
      .reduce((acc, t) => acc + (acc && !/^[,;:.…]/.test(t) ? " " : "") + t, "") + ".";
  }
  function squelettes() {
    const out = [];
    (function m(e, acc) { if (estFinal(e)) return out.push(acc);
      for (const b of offerts(e)) m(b.vers, [...acc, b]); })(G.depart, []);
    return out;
  }
  return { C, estFinal, offerts, reduire, dimDe, valider, memeTerme, memeRed, lienDe, rendre,
           squelettes, comparer, deduire, ordonner, relationsDe, fausse };
}

const _projections = (function () {

/* PIÈGE : le passage d'un ARTICLE n'est pas un champ (§11, passe F) — ni
   dimension ni valeur, jamais un terme. `champsDe` ne le rend pas : le moteur
   ne le voit jamais, et aucune boucle « par dimension » n'a à l'écarter.
   `articlesDe` le rend, pour l'écran et l'atelier. */
const projeter = (contenu, garder) => {
  const out = [];
  for (const [pid, p] of Object.entries((contenu || {}).pieces || {}))
    for (const [eid, e] of Object.entries(p.empans || {}))
      if (garder(e))
        out.push({ id: pid + "." + eid, pid, eid, dim: e.dim, valeur: e.valeur,
                   texte: e.texte, nom: e.nom || e.texte, qui: e.qui || p.qui || "",
                   court: p.court || "" });
  return out;
};
const champsDe   = contenu => projeter(contenu, e => !e.article);
const articlesDe = contenu => projeter(contenu, e => !!e.article);

function comparaisonsDe(liens, formes) {
  const out = [], vus = new Set();
  const rec = t => {
    if (!t || typeof t !== "object" || Array.isArray(t)) return;
    if (t.forme && (((formes || {})[t.forme] || {}).arite || 2) === 2) {
      const cle = JSON.stringify([t.forme, t.termes]);
      if (!vus.has(cle)) { vus.add(cle); out.push({ forme: t.forme, termes: t.termes }); }
    }
    for (const u of (t.termes || [])) rec(u);
  };
  for (const L of (liens || [])) rec(L);
  return out;
}

/* La dimension se lit par la couleur ET par le trait, au même rang (§4.3,
   §4.10). PIÈGE PAYÉ : l'ancienne palette opposait un rouge (qui) à un vert
   (où) et un bleu à un mauve — indiscernables sous deutéranopie. Celle-ci n'a
   plus de rouge ; elle a été choisie à la mesure (distance OKLab minimale
   entre paires, en vision normale et sous trois déficiences simulées), sur le
   fond sombre comme sur le papier des pièces, où `jeu.css` la fonce. */
const PALETTE_DIM = ["#5ab4ea", "#f0a020", "#2fbf8f", "#e8dc5a", "#d886b6", "#c8ccd2"];
const TRAITS_DIM  = ["solid", "double", "dotted", "dashed", "wavy"];
function couleurDim(dimensions, d) {
  const i = (dimensions || []).indexOf(d);
  return i < 0 ? null : PALETTE_DIM[i % PALETTE_DIM.length];
}
function traitDim(dimensions, d) {
  const i = (dimensions || []).indexOf(d);
  return i < 0 ? null : TRAITS_DIM[i % TRAITS_DIM.length];
}

  return { champsDe, articlesDe, comparaisonsDe, couleurDim, traitDim, PALETTE_DIM, TRAITS_DIM };
})();

const _api = { creerMoteur, ..._projections };
if (typeof module !== "undefined" && module.exports) module.exports = _api;
if (typeof window !== "undefined") window.MoteurGrammaire = _api;

</script>

<script>
// Les RÈGLES DU JEU — pures, sans DOM, sans localStorage, sans fenêtre.
// Mode double : `require` (tests, banc) ou `<script src>` (jeu, atelier) ; le
// pas-à-pas les APPELLE au lieu de les recopier (§12).
// Convention : chaque fonction reçoit `S` en premier argument et le modifie sur
// place ; aucune ne rend de HTML ; celles qui « parlent » poussent dans `S.fil`.
function creerRegles(JEU, M) {

  /* ---- L'ÉTAT (§4.6) ------------------------------------------------ */
  function etatInitial() { return {
    fil: [],                      // le canal : {qui, texte, pieces[], ia, question?}
    examinees: [],                // pièces ouvertes au moins une fois
    remisesEnvoyees: 0,
    retenus: [],                  // PRIVÉ — ["pid.eid"] dans l'ordre de surlignage
    compo: [],                    // la phrase en cours — [{bloc:id, valeur}]
    refus: null,                  // le dernier refus de catégorie, à afficher
    brouillon: [],                // PRIVÉ — journal des phrases closes, sans zone
    prete: null,                  // PRIVÉ — index, dans le journal, de la phrase
                                  //   qui attend sur place (§4.7)
    plaidoirie: [],               // TRANSMIS — {b:index journal, contre:index affirmation|null}
    satisfaits: [],               // tags d'attente déjà servis
    vice_pressenti: false,        // la comparaison ⚑ s'est formée au composeur
    vice_trouve: false,           // la conclusion ⚑ est composée
    vice_expose: false,           // la conclusion ⚑ est envoyée
    clotureDemandee: false,
    repetitionIdx: -1,
    declenches: [],               // pièces dont le `declenche` une_fois a joué
    inutiles: 0, incompris: 0,    // compteurs d'agacement de l'avocat, remis à zéro à chaque remise
    hors_sujet: 0,                // …et celui des citations qui ne répondent pas
    fausses: 0,                   // …et celui des relations fausses (passe G)
    modalPiece: null
  }; }

  function signatureContenu() {
    const s = JSON.stringify(JEU); let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* ---- Le canal ----------------------------------------------------- */
  const pousser = (S, qui, texte, pieces, ia) =>
    S.fil.push({ qui, texte, pieces: pieces || [], ia: !!ia });

  /* Seul normalisateur du jeu (R9) : l'ancienne forme se lit comme une liste à
     un élément (§11). */
  function attentesDe(r) {
    if (!r) return [];
    if (Array.isArray(r.attentes)) return r.attentes;
    return r.attend ? [{ attend: r.attend, apres: r.apres }] : [];
  }
  const attenteCourante = (S, r) => attentesDe(r).find(a => !S.satisfaits.includes(a.attend));
  const remiseCourante = S => JEU.remises[S.remisesEnvoyees - 1];
  /* LA REMISE PORTE SA PREMIÈRE QUESTION (§4.6) : un seul message, et ses
     pièces APRÈS la question — on lit ce qu'il demande avant d'aller chercher.
     La question reste un champ de l'ATTENTE, que `rappelQuestion` retrouve ;
     le message ne fait que la porter. Les suivantes, posées après une réponse,
     sont des messages à part. */
  function poserQuestion(S, r, avecRemise) {
    const a = attenteCourante(S, r);
    if (!a || !a.question) return;
    if (avecRemise) S.fil[S.fil.length - 1].question = a.question;
    else pousser(S, r.qui || "Maître Auber", a.question);
  }

  function envoyerRemise(S) {
    if (S.remisesEnvoyees >= JEU.remises.length) return;
    const r = JEU.remises[S.remisesEnvoyees];
    S.remisesEnvoyees++;
    // §4.11 — l'agacement retombe à chaque remise : un nouveau dossier, une
    // nouvelle séance, et les premières répliques — les seules qui disent
    // quelque chose — se réentendent.
    S.inutiles = S.incompris = S.hors_sujet = S.fausses = 0;
    pousser(S, r.qui, r.texte, r.pieces);
    poserQuestion(S, r, true);
  }

  function ouvrirPiece(S, pid) {
    if (!S.examinees.includes(pid)) S.examinees.push(pid);
    S.modalPiece = pid;
  }
  /* LA RÉACTION DE L'AVOCAT SE LIT QUAND ON RELÈVE LES YEUX. Poussée à
     l'OUVERTURE, elle tombait derrière une pièce qui venait de rendre le jeu
     inerte : un joueur ne l'a lue qu'en fond flouté (§4.10 règle 3). Elle part
     donc à la fermeture, dans un canal qu'on regarde. */
  function fermerPiece(S) {
    const pid = S.modalPiece;
    S.modalPiece = null;
    const d = (JEU.pieces[pid] || {}).declenche;
    if (d && d.replique && !(d.une_fois && S.declenches.includes(pid))) {
      S.declenches.push(pid);
      pousser(S, d.qui || "Maître Auber", d.replique);
    }
  }

  /* ---- Les pièces reçues -------------------------------------------- */
  function piecesLivrees(S) {
    const out = [];
    for (let i = 0; i < S.remisesEnvoyees; i++)
      for (const pid of (JEU.remises[i].pieces || [])) out.push(pid);
    return out;
  }
  const estRegle = p => _apiRegles.estRegle(p);

  /* ---- LE CONTEXTE — privé, gratuit, illimité ---- */
  // PIÈGE : `surligner` (la pièce) N'AJOUTE QUE — re-cliquer un passage déjà
  // retenu ne l'oublie pas ; seul `oublier` (le CONTEXTE) retire. Une pièce ne
  // peut plus désélectionner, pour éviter une mauvaise manipulation. Le clic de
  // l'écran passe par `retenirEtPrendre` (passe H) : recliqué, un passage retenu
  // peut entrer dans la phrase — jamais en sortir.
  function surligner(S, pid, eid) {
    const k = pid + "." + eid;
    if (!S.retenus.includes(k)) S.retenus.push(k);
  }
  function oublier(S, pid, eid) {
    const k = pid + "." + eid, i = S.retenus.indexOf(k);
    if (i >= 0) S.retenus.splice(i, 1);
  }

  /* ---- LE COMPOSEUR -------------------------------------------------- */
  const blocParId = id => (JEU.grammaire.blocs || []).find(b => b.id === id);
  function etatCompo(S) {
    let e = JEU.grammaire.depart;
    for (const p of S.compo) { const b = blocParId(p.bloc); if (b) e = b.vers; }
    return e;
  }
  /* ON N'INVOQUE PAS UN TEXTE QU'ON N'A PAS RETENU (§4.5, passe F). Une
     TOURNURE se reçoit — il suffit que sa pièce soit livrée ; un TEXTE s'invoque,
     et on n'invoque que ce qu'on a retenu : le passage d'article de sa pièce est
     au CONTEXTE. L'offre a suivi « reçu », puis « ouvert » — ouvrir valait lire,
     et l'article paraissait de lui-même au composeur. PIÈGE : la distinction se
     fait sur le TYPE DE BLOC, pas sur la nature de la pièce — dans l'affaire du
     jour, le terme de comparaison porte lui aussi une pièce-règle, et l'exiger
     retenue couperait la grammaire de comparaison, que le §4.5 veut complète
     dès la première phrase. */
  const estArticle = k => {
    const s = String(k), i = s.indexOf("."), p = JEU.pieces[s.slice(0, i)];
    return i > 0 && !!p && !!((p.empans || {})[s.slice(i + 1)] || {}).article;
  };
  const articleRetenu = (S, pid) => S.retenus.some(k => k.startsWith(pid + ".") && estArticle(k));
  const estLiaisonArticle = b => b.type === "liaison" && !!b.imbrique && !!b.piece;
  function blocsDepuis(e, S) {
    const livrees = new Set(piecesLivrees(S));
    return (JEU.grammaire.blocs || []).filter(b => {
      if (b.de !== e) return false;
      if (!b.piece) return true;
      if (!livrees.has(b.piece)) return false;
      return b.type !== "liaison" || articleRetenu(S, b.piece);
    });
  }
  /* La phrase ATTEND un article — retenu ou non : l'écran en tire où a lieu le
     geste suivant (la voix, le panneau qui reste) et la raison d'une fiche
     d'article refusée. */
  function articleAttendu(S) {
    const e = etatCompo(S), livrees = new Set(piecesLivrees(S));
    return (JEU.grammaire.blocs || []).some(b => b.de === e && estLiaisonArticle(b) && livrees.has(b.piece));
  }
  function blocsOfferts(S) { return blocsDepuis(etatCompo(S), S); }
  function indexTermeChamp(S) {
    if (S.prete != null) return -1;
    return blocsOfferts(S).findIndex(b => b.type === "terme" && b.source !== "note");
  }
  /* LE SECOND TERME D'UNE PAIRE : celui qui mène au choix de la relation (passe
     G), ou — contenu d'avant — celui qui la fait déduire (`deduit`, §11). */
  const estSecondTerme = b => !!b && b.type === "terme" && (!!b.deduit
    || (JEU.grammaire.blocs || []).some(x => x.de === b.vers && x.type === "relation"));
  function comparaisonPossible(S) {
    const offerts = blocsOfferts(S);
    if (S.compo.length) return offerts.some(estSecondTerme);
    return offerts.some(b => b.type === "terme" && blocsDepuis(b.vers, S).some(estSecondTerme));
  }
  /* LES DEUX RELATIONS QUE LA PHRASE OFFRE (passe G, §4.5) : deux termes de même
     dimension posés, et le bloc `relation` en attente. Ailleurs, aucune. */
  const termesPoses = S => S.compo.map(p => p.valeur).filter(v => typeof v === "string");
  function relationsOffertes(S) {
    if (!blocsOfferts(S).some(b => b.type === "relation")) return [];
    const t = termesPoses(S).slice(-2);
    if (t.length !== 2 || M.dimDe(t[0]) !== M.dimDe(t[1])) return [];
    return M.relationsDe(M.dimDe(t[0]));
  }
  function dimAttendue(S) {
    const i = indexTermeChamp(S);
    if (i < 0) return null;
    const b = blocsOfferts(S)[i];
    if (!estSecondTerme(b)) return null;
    const premier = S.compo.find(p => { const pb = blocParId(p.bloc); return pb && pb.type === "terme"; });
    return premier ? M.dimDe(premier.valeur) : null;
  }
  const chaineCompo = S => S.compo.map(p => ({ bloc: blocParId(p.bloc), valeur: p.valeur }));
  const compoFinie = S => (JEU.grammaire.finaux || []).includes(etatCompo(S));

  const sousLienVice = () => {
    const c = (JEU.liens || []).find(L => L.vice && L.conclusion);
    const t = c && (c.termes || [])[0];
    return (t && typeof t === "object") ? t : null;
  };
  const estPressentiment = r => {
    const sous = sousLienVice();
    return !!(sous && r && r.forme && M.memeRed(r, sous));
  };
  const estConclusionVice = r => {
    const c = (JEU.liens || []).find(L => L.vice && L.conclusion);
    return !!(c && r && r.forme && M.memeRed(r, { forme: c.forme, termes: c.termes }));
  };
  /* LES DEUX DRAPEAUX PRIVÉS SE LÈVENT ICI (§4.7) : comprendre, c'est
     assembler — plus clore. C'est ce qui garde la Fin 2 jouable. */
  function pressentir(S, r) {
    if (!S.vice_pressenti && estPressentiment(r)) S.vice_pressenti = true;
    if (!S.vice_trouve && estConclusionVice(r)) { S.vice_pressenti = true; S.vice_trouve = true; }
  }
  function majPressentiment(S) { pressentir(S, M.reduire(chaineCompo(S))); }

  // PIÈGE : iBloc indexe blocsOfferts() — POSITIONNEL dans la liste filtrée,
  // donc dépendant de la session ; iSrc indexe le contexte ou le brouillon.
  /* §4.11 — LA SESSION 1 APPREND, LES SUIVANTES LAISSENT SE TROMPER. La
     frontière est la REMISE, jamais le tutoriel, qui ne décide rien (§4.8) —
     celle que `horsOrdre` trace déjà (§3). */
  const enCalibration = S => S.remisesEnvoyees === 1;
  const formeDe = r => (JEU.grammaire.formes || {})[r && r.forme] || {};
  /* Une juxtaposition — deux passages de dimensions différentes, sans relation —,
     nue ou sous un article. */
  const juxtapose = r => !!r && typeof r === "object" && (formeDe(r).deduction === "juxtaposition"
    || (r.termes || []).some(t => juxtapose(t)));
  const formeJuxtaposition = () =>
    (Object.entries(JEU.grammaire.formes || {}).find(([, f]) => f.deduction === "juxtaposition") || [null])[0];
  /* LA RELATION SE CHOISIT (passe G, §4.5) : `iSrc` désigne l'une des deux
     relations offertes. Deux termes de dimensions différentes n'en ont aucune à
     offrir : en session 1, le second est refusé ; ensuite, la juxtaposition se
     pose d'elle-même (`auto`), et `retirerBloc` l'emporte avec le terme qui l'a
     appelée. Le même passage deux fois ne se compare pas. */
  function paireRefusee(S) {
    const [x, y] = termesPoses(S).slice(-2);
    if (x === y) return true;
    if (M.dimDe(x) !== M.dimDe(y)) return enCalibration(S) || !formeJuxtaposition();
    return !M.relationsDe(M.dimDe(x)).length;
  }
  function poserBloc(S, iBloc, iSrc) {
    S.prete = null;              // reprendre abandonne la phrase qui attendait
    const b = blocsOfferts(S)[iBloc]; if (!b) return;
    let valeur = null;
    if (b.type === "relation") {
      valeur = relationsOffertes(S)[iSrc]; if (!valeur) return;
    }
    if (b.type === "terme") {
      if (b.source === "note") {
        const n = S.brouillon[iSrc]; if (!n) return;
        valeur = n.reduite;
      } else {
        const k = S.retenus[iSrc]; if (!k) return;
        valeur = k;
      }
    }
    S.compo.push({ bloc: b.id, valeur });
    S.refus = null;
    const r = M.reduire(chaineCompo(S));
    const paire = estSecondTerme(b) && !b.deduit;
    const err = b.deduit && (!r.forme || (juxtapose(r) && enCalibration(S))) ? "ces deux-là ne se comparent pas"
              : paire && paireRefusee(S) ? "ces deux-là ne se comparent pas"
              : (JEU.grammaire.finaux || []).includes(b.vers) ? M.valider(r) : null;
    if (err) {
      S.compo.pop();
      S.refus = "Cette phrase ne veut rien dire : " + err
              + ". Rien n'est perdu — reprends avec un autre passage.";
      return;
    }
    if (paire) {
      const [x, y] = termesPoses(S).slice(-2);
      const rel = (JEU.grammaire.blocs || []).find(z => z.de === b.vers && z.type === "relation");
      if (M.dimDe(x) !== M.dimDe(y) && rel) S.compo.push({ bloc: rel.id, valeur: formeJuxtaposition(), auto: true });
    }
    majPressentiment(S);
  }
  /* CE QUE LA QUESTION DEMANDE (§4.6, §4.11 point 6) : le LIEN que l'attente
     courante attend — jamais un nom d'attente câblé —, ses passages, et le
     texte de l'article de la liaison qui emboîte sa forme. Une réponse à une
     question À VENIR n'est pas demandée : la remise 1 se sert dans l'ordre
     (§3). Le tutoriel le lit aussi, au lieu de le redériver (§4.8). */
  function lienAttendu(S) {
    const a = attenteCourante(S, remiseCourante(S));
    return (a && a.attend && (JEU.liens || []).find(L => L.tag === a.attend)) || null;
  }
  function liaisonAttendue(S) {
    const L = lienAttendu(S);
    return (L && (JEU.grammaire.blocs || []).find(b => estLiaisonArticle(b) && b.forme === L.forme)) || null;
  }
  function passagesDemandes(S) {
    const out = [];
    const feuilles = t => { for (const x of (t && t.termes) || [])
      if (typeof x === "string") out.push(x); else feuilles(x); };
    feuilles(lienAttendu(S));
    const b = liaisonAttendue(S);
    const eid = b && Object.keys((JEU.pieces[b.piece] || {}).empans || {}).find(e => estArticle(b.piece + "." + e));
    if (eid) out.push(b.piece + "." + eid);
    return out;
  }
  /* RETENIR, ET PRENDRE D'UN MÊME CLIC (§4.6, passe H). Le clic sur un passage
     le retient — toujours : la pièce n'ajoute que — et, si la phrase attend un
     passage, l'y pose ; le texte d'un article fonde la phrase qui attend un
     article. PIÈGE : c'est la FICHE, rien de plus — `poserBloc` au rang de
     `indexTermeChamp`, le prédicat qui active les fiches, ou la liaison de
     l'article : refus de catégorie (session 1), juxtaposition (ensuite) et
     drapeaux compris. Une voie à lui ferait diverger deux portes qui disent faire
     la même chose. SECOND PIÈGE : un passage déjà dans la phrase n'y retourne
     pas — en second terme, « le même passage deux fois » serait refusé, un
     reproche pour un clic de lecture. Rend ce qui a eu lieu : "pose", "refuse"
     (`S.refus` le dit), "dejaPhrase", ou null — retenu seulement : la phrase
     n'attend rien, ou, en session 1, la question ne le demande pas. */
  const dansPhrase = (S, k) => S.compo.some(p => {
    const b = blocParId(p.bloc);
    if (!b) return false;
    return estArticle(k) ? estLiaisonArticle(b) && b.piece === k.slice(0, k.indexOf("."))
                         : b.type === "terme" && p.valeur === k;
  });
  function retenirEtPrendre(S, pid, eid) {
    const k = pid + "." + eid;
    surligner(S, pid, eid);
    if (dansPhrase(S, k)) return "dejaPhrase";
    /* §4.6 — EN SESSION 1, LE CLIC NE POSE QUE CE QUE LA QUESTION DEMANDE : un
       passage à côté se retient, sans bruit, et la bulle redemande le bon. Une
       règle de la REMISE, tutoriel ouvert ou fermé (§4.11). PIÈGE : les fiches,
       elles, prennent tout — c'est par elles que se composent les lectures
       justes (§6) ; et dès la session 2, désigner ce qui sert la question
       serait une lampe torche. */
    if (enCalibration(S) && !passagesDemandes(S).includes(k)) return null;
    const i = estArticle(k)
      ? blocsOfferts(S).findIndex(b => estLiaisonArticle(b) && b.piece === pid)
      : indexTermeChamp(S);
    if (i < 0) return null;
    const n = S.compo.length;
    poserBloc(S, i, estArticle(k) ? undefined : S.retenus.indexOf(k));
    return S.compo.length > n ? "pose" : "refuse";
  }
  /* LA CLÔTURE QUI N'AJOUTE RIEN (§4.5) : c'est l'envoi qui la pose, `imbrique`
     exclu. PIÈGE : SEULES LES LIAISONS comptent — les puces du contexte sont
     le clavier, pas des boutons (§4.6), leur présence ne fait pas nombre. */
  function clotureImplicite(S) {
    const liaisons = blocsOfferts(S).filter(b => b.type === "liaison");
    if (liaisons.length !== 1) return null;
    const b = liaisons[0];
    if (b.imbrique) return null;
    return (JEU.grammaire.finaux || []).includes(b.vers) ? b : null;
  }
  function chaineEnvoyable(S) {
    if (!S.compo.length) return null;
    const b = clotureImplicite(S);
    const ch = chaineCompo(S).concat(b ? [{ bloc: b, valeur: null }] : []);
    return M.valider(M.reduire(ch)) ? null : ch;
  }
  const peutEnvoyer = S => !!chaineEnvoyable(S);
  function retirerBloc(S) {
    const p = S.compo.pop();
    if (p && p.auto) S.compo.pop();   // la juxtaposition part avec le terme qui l'a posée
    S.refus = null;
  }
  function viderCompo(S) { S.compo = []; S.refus = null; }
  function effacerPrete(S) { S.prete = null; }

  function clore(S) {
    const ch = chaineEnvoyable(S);
    if (!ch) {
      const err = M.valider(M.reduire(chaineCompo(S))) || "arité";
      S.refus = "Cette phrase ne veut rien dire : " + err + ". Rien n'est perdu — retire le dernier bloc.";
      return null;
    }
    S.compo = [];
    return clorePhrase(S, M.reduire(ch), M.rendre(ch));
  }
  /* UNE PHRASE DÉJÀ ENVOYÉE NE REPART PAS (§4.5). PIÈGE PAYÉ : `clore` vidait le
     composeur, `clorePhrase` retrouvait l'entrée versée, et `envoyer` sortait —
     la phrase s'évaporait sans un mot. On refuse AVANT de clore : rien n'est
     vidé, et l'écran le dit. Une phrase dite hors ordre n'est pas versée (§3) :
     elle repart. */
  function dejaEnvoyee(S) {
    const ch = chaineEnvoyable(S);
    if (!ch) return false;
    const r = M.reduire(ch);
    return S.brouillon.some(n => n.versee && M.memeRed(n.reduite, r));
  }
  function envoyerCompo(S) {
    if (dejaEnvoyee(S)) return;
    const i = clore(S);
    if (i == null) return;
    envoyer(S, i);
  }
  function clorePhrase(S, r, texte) {
    const deja = S.brouillon.findIndex(n => M.memeRed(n.reduite, r));
    if (deja >= 0) {                                 // écrite deux fois : une seule entrée
      if (!S.brouillon[deja].versee) S.prete = deja;
      return deja;
    }
    const lien = M.lienDe(r) || null;
    S.brouillon.push({ reduite: r, texte, lien, versee: false });
    pressentir(S, r);            // une affaire à l'ancienne clôt la comparaison
    if (lien && lien.vice) {
      S.vice_pressenti = true;
      if (lien.conclusion) S.vice_trouve = true;   // comprise, pas encore dite
    }
    S.prete = S.brouillon.length - 1;
    return S.prete;
  }

  const estMoyen = L => !!L && !!(L.conclusion || L.faux || L.tag);

  function envoyer(S, i, contre) {
    const n = S.brouillon[i];
    if (!n || n.versee) return;
    if (S.prete === i) S.prete = null;
    const L = n.lien;
    pousser(S, "IAvocat", "⟨ envoyé : " + n.texte + " ⟩", null, true);
    if (horsOrdre(S, L)) return reponseAvocat(S, n, true);   // dit, pas versé : il repartira
    n.versee = true;
    S.plaidoirie.push({ b: i, contre: (contre == null ? null : contre) });
    if (L && L.vice && L.conclusion) { S.vice_trouve = true; S.vice_expose = true; }  // transmis = compris
    reponseAvocat(S, n);
    avancerSurAttente(S, L);
  }
  /* LA REMISE DU TUTORIEL SE SERT DANS L'ORDRE (§3). Une phrase qui sert une
     attente À VENIR de la remise 1 est hors sujet : l'avocat répond comme à
     toute réponse à côté, rien n'entre en PLAIDOIRIE, et la phrase reste À
     ENVOYER — `versee` faux, elle repartira quand sa question viendra, puisque
     `clorePhrase` la retrouve. PIÈGE : la marquer versée la rendrait muette pour
     toujours, et la question qui l'attend ne pourrait plus être servie. Les
     remises suivantes gardent l'anticipation : la latitude s'élargira avec
     elles. */
  function horsOrdre(S, L) {
    if (!L || !L.tag || !enCalibration(S)) return false;
    const r = remiseCourante(S), a = attenteCourante(S, r);
    return !!a && a.attend !== L.tag
        && attentesDe(r).some(x => x.attend === L.tag && !S.satisfaits.includes(x.attend));
  }

  /* UNE PHRASE QUI MÉLANGE DEUX DOSSIERS (§4.6). Le CONTEXTE est cumulatif et
     gratuit : rien n'empêche de comparer un passage de la session 1 avec un de
     la session 2, et ça produit des phrases qui n'ont pas de sens — l'arrivée de
     la patrouille « précède » le relevé du lendemain : vrai, et sans objet. On n'INTERDIT rien (§4.5, seules les erreurs de
     catégorie sont refusées) : l'avocat le dit, comme il refuse la comparaison nue.
     PIÈGE : c'est une impatience de sa part, jamais un verdict — aucun défaut ne
     doit pouvoir se relire comme un calcul (§8.5). */
  function remiseDe(pid) {
    return (JEU.remises || []).findIndex(r => (r.pieces || []).includes(pid));
  }
  function remisesCitees(r, vues) {
    for (const t of (r && r.termes) || []) {
      if (typeof t === "object") remisesCitees(t, vues);
      else if (typeof t === "string") {
        const i = remiseDe(t.slice(0, t.indexOf(".")));
        if (i >= 0) vues.add(i);
      }
    }
    return vues;
  }
  const melangeDeuxDossiers = r => remisesCitees(r, new Set()).size > 1;

  function reponseAvocat(S, n, aVenir) {
    const L = n.lien, A = JEU.avocat || {};
    const esc1 = (liste, cpt) => liste[Math.min(S[cpt]++, liste.length - 1)];
    // Une réponse à une question pas encore posée est à côté (§3) : sa
    // réplique propre attendra la question — elle dirait ce qu'on n'a pas demandé.
    if (aVenir) return pousser(S, "Maître Auber", esc1(A.rep_hors_sujet || ["…"], "hors_sujet"));
    if (!L && A.rep_deux_dossiers && melangeDeuxDossiers(n.reduite))
      return pousser(S, "Maître Auber", A.rep_deux_dossiers);
    if (L && L.vice && L.conclusion) pousser(S, "Maître Auber", A.rep_vice);
    else if (L && L.faux)            pousser(S, "Maître Auber", A.rep_faux);
    else if (L && L.rep)             pousser(S, "Maître Auber", L.rep);
    // §4.11 — hors session 1, la juxtaposition part : c'est l'avocat qui la
    // refuse, nue comme sous un article — un refus d'avocat, plus de grammaire.
    else if (juxtapose(n.reduite))   pousser(S, "Maître Auber", esc1(A.rep_sans_rapport || ["…"], "incompris"));
    // §4.5 — UNE RELATION FAUSSE PART, ET L'AVOCAT LA REFUSE, partout : à deux
    // relations, un refus d'écran aurait donné l'autre (passe G).
    else if (M.fausse(n.reduite))    pousser(S, "Maître Auber", esc1(A.rep_relation_fausse || A.rep_sans_rapport || ["…"], "fausses"));
    else {
      const f = (JEU.grammaire.formes || {})[n.reduite.forme] || {};
      const emboite = typeof ((n.reduite.termes || [])[0]) === "object";
      if ((f.arite || 2) > 1) pousser(S, "Maître Auber", esc1(A.rep_inutile || ["…"], "inutiles"));
      else if (!emboite)      pousser(S, "Maître Auber", esc1(A.rep_hors_sujet || ["…"], "hors_sujet"));
      else                    pousser(S, "Maître Auber", esc1(A.rep_sans_rapport || ["…"], "incompris"));
    }
  }

  function avancerSurAttente(S, L) {
    if (!L || !L.tag) return;
    const r = remiseCourante(S);
    const a = attentesDe(r).find(x => x.attend === L.tag);
