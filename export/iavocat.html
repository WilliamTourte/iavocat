<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAvocat</title>
<style>
/* LE JEU — LA FEUILLE DE STYLE, chargée par <link>. Elle ne décide rien : les
   seules valeurs calculées entrent par `--dc` et `--ds`, posées en style inline
   par `couleurDim` et `traitDim` (§4.3) — palette et traits vivent dans
   app/moteur.js, en un exemplaire. Le papier des pièces les FONCE ici, il ne
   les double pas. */
:root{
  color-scheme:dark;
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2b3440;
  --txt:#d7dde5; --muted:#8b97a6; --accent:#6fb3d6; --warn:#d6a96f;
  /* PIÈGE PAYÉ : ce bleu fut employé huit fois et défini nulle part. Une `var()`
     introuvable rend la déclaration INVALIDE AU CALCUL — sur un raccourci comme
     `border`, ça vide toutes ses longhands, donc pas de filet du tout. */
  --transmis:#23506e;
  /* Le papier des pièces (§4.6) : ce qu'on lit vient du monde. */
  --papier:#f4efe4; --encre:#27231d; --encre2:#665d4f; --filet:#d8cfbb;

  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"DejaVu Serif","Liberation Serif",serif;
}
*{box-sizing:border-box}
/* §4.6 — LA COLONNE TIENT DANS LA FENÊTRE : la page ne défile pas, chaque bande
   défile pour son compte, et la conversation est la SEULE bande élastique.
   PIÈGE : sans `min-height:0`, un item de flex refuse de rétrécir sous son
   contenu — la conversation pousserait le composeur sous le pli, exactement ce
   que cette mise en page existe pour empêcher. */
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{flex:1 1 auto;min-height:0;width:100%;max-width:1000px;margin:0 auto;
  display:flex;flex-direction:column;gap:12px;padding:14px 20px 12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.col > h2{flex:none;margin:0;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.body{padding:12px 14px;overflow-y:auto;min-height:0;flex:1 1 auto}
.col.fil{flex:1 1 0;min-height:130px}
/* Un panneau ouvert, la conversation peut céder davantage — c'est tout ce que la
   classe `avecPanneau` décide. */
.wrap.avecPanneau .col.fil{min-height:96px}
.panneau{flex:0 1 auto;max-height:32vh;min-height:0}
/* PIÈGE : `.col` pose `display:flex`, qui BAT `[hidden]{display:none}` — sans
   cette ligne, cacher la Plaidoirie ne ferait rien. */
.col[hidden]{display:none}
#composeur{flex:none;max-height:46vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 16px}
#composeur .zone{margin:0}
/* Trop bas pour trois bandes : on rend la main au défilement de la page. */
@media (max-height:560px){
  body{height:auto}
  .wrap{flex:none}
  .col.fil{flex:none}
  .fil .body{max-height:50vh}
  .panneau{max-height:none}
  .panneau .body{max-height:45vh}
  #composeur{max-height:none}
}
/* --- ce qui se lit au clavier (§4.10) --- un double anneau en `box-shadow`,
   qui ne se bat pas avec l'`outline` du halo du tutoriel. */
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #e6edf3}
.sr{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
kbd{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:0 5px;line-height:1.5}
/* Les croix : un nom, une cible, et Échap lisible là où il agit (§4.10). Les deux
   portes de la barre doivent TRANCHER sur le panneau qui les porte : bord
   accentué et texte plein, jamais le gris d'une étiquette. Ouverte, la porte
   s'inverse — on lit d'un coup d'œil quelle surface est sous les yeux. */
.col > h2 .fermer,.modal .close{display:inline-flex;align-items:center;gap:7px;min-height:32px;
  padding:3px 8px 3px 10px;background:none;border:1px solid var(--line);border-radius:7px;
  color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
.col > h2 .fermer{margin-left:auto}
.col > h2 .fermer:hover,.modal .close:hover{border-color:var(--accent)}
.fermer .x,.close .x{font-size:20px;line-height:1}
.ztitle .surfaces{margin-left:auto;display:flex;gap:6px}
.versSurface{background:#20303f;border:1px solid var(--accent);border-radius:7px;
  color:var(--txt);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;
  padding:5px 12px;cursor:pointer}
.versSurface:hover{background:#2b4259}
.versSurface.ouvert{background:var(--accent);border-color:var(--accent);color:#0e1116}
/* --- canal --- */
.msg{margin-bottom:10px;display:flex;flex-direction:column;align-items:flex-start}
.msg.ia{align-items:flex-end}
.msg.suite{margin-top:-4px}
.msg .who{font-size:12.5px;color:var(--muted);margin-bottom:3px}
/* Soixante-dix signes à la ligne, pas cent quinze (§4.9). */
.msg .bubble{max-width:68ch;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.msg.ia .who{color:#6d9cb8}
.msg.ia .bubble{background:#0f2230;border-color:var(--transmis);font-family:var(--mono);font-size:13.5px;color:#bfe0f2}
.attach{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;padding:6px 10px;
  background:#12324a;border:1px solid var(--transmis);border-radius:8px;color:#bfe0f2;cursor:pointer;
  font:inherit;font-size:13.5px}
.attach:hover{border-color:var(--accent)}
/* Lue : un ✓, et une teinte qui s'apaise sans perdre son contraste — jamais le
   gris d'un bouton désactivé (§4.10 règle 5). */
.attach.seen{background:#15222e;border-color:#2b4254;color:#a9c3d3}
/* --- zones --- */
.zone{margin-bottom:12px}
#zoneDossier,#zoneRetenus{border:1px solid var(--line);border-radius:8px;
  background:var(--panel2);padding:10px 12px;margin-bottom:12px}
.zone .ztitle{font-size:14px;font-weight:600;color:var(--muted);
  margin-bottom:8px;padding:4px 0 6px;display:flex;align-items:center;gap:8px}
.aide{display:block;color:var(--muted);font-size:13px;margin-top:8px;font-style:italic}
/* §4.9 règle 1 : la voix se clique quand le geste qu'elle nomme a lieu dans
   l'autre colonne. Elle ne ressemble PAS à un `.bbloc` — celui-là POSE un bloc,
   celle-ci ne fait que montrer où aller. Et plus de pointillés : dans le cadre
   du composeur, elle passait pour un champ vide, ou une zone de dépôt. */
.versContexte{display:inline-flex;align-items:center;gap:10px;text-align:left;
  background:#1a2a38;color:var(--txt);font:inherit;font-size:13.5px;font-style:normal;
  border:1px solid var(--accent);border-radius:7px;padding:6px 12px;cursor:pointer}
.versContexte:hover{background:#223a4e}
.versContexte .fl{color:var(--accent);font-weight:700}
/* PIÈGE : `.phrase .trou` (le fantôme) vient plus loin, à spécificité égale —
   d'où la double classe : sans elle, la voix cliquable repassait en italique
   grisé, l'air d'un champ vide. */
.phrase .trou.versContexte{color:var(--txt);font-style:normal}
.aide.question{margin-top:0;margin-bottom:10px;color:var(--txt);border-left:2px solid var(--muted);padding-left:8px}
/* --- les empans dans le texte d'une pièce --- la couleur ET le trait (§4.3) ;
   le soulignement est une DÉCORATION, pas une bordure : il suit la coupure de
   ligne, et l'épaisser ne décale rien. Retenu, le fond se remplit — jamais de
   graisse, qui décalait le texte autour. */
.piecetexte{line-height:1.9}
.empan{text-decoration-line:underline;text-decoration-style:var(--ds,solid);
  text-decoration-color:var(--dc,var(--muted));text-decoration-thickness:2px;
  text-underline-offset:.26em;text-decoration-skip-ink:none;
  border-radius:2px;padding:1px 1px;cursor:pointer;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:color-mix(in srgb, var(--dc,#888) 10%, transparent)}
.empan:hover{background:color-mix(in srgb, var(--dc,#888) 24%, transparent)}
.empan.pris{background:color-mix(in srgb, var(--dc,#888) 32%, transparent);text-decoration-thickness:3px}
/* --- contexte : une seule liste, qui sert AUSSI de clavier au composeur --- */
.dimgrp{margin-bottom:9px}
.dimgrp .dnom{font-size:12px;color:var(--dc,var(--muted));text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
/* §4.5 : le Contexte s'assombrit PAR DIMENSION — par la couleur, plus par une
   transparence qui éteignait le contraste (§4.10 règle 5). */
.dimgrp.horsdim .dnom{color:var(--muted)}
.dimgrp.horsdim .mchip{border-left-color:var(--line);background:#181e27}
.dimgrp.horsdim .mchip .corps{color:var(--muted)}
.mchip{display:flex;align-items:stretch;margin:3px 0;background:var(--panel2);
  border:1px solid var(--line);border-left:3px solid var(--dc,var(--line));border-radius:6px;overflow:hidden}
.mchip:hover{border-color:var(--accent)}
/* PIÈGE : sans `min-width:0`, un item de flex refuse de rétrécir sous son
   contenu — la citation pousserait la puce hors du cadre. */
.mchip .corps{flex:1;min-width:0;text-align:left;background:none;border:none;color:var(--txt);
  padding:6px 9px;cursor:pointer;font:inherit;font-size:13.5px;line-height:1.4}
.mchip .corps:disabled{cursor:default;color:var(--muted)}
.mchip .nom{display:block}
.mchip .prov{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.mchip .cit{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip .sig{flex:none;font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.mchip .del{background:none;border:none;border-left:1px solid var(--line);color:var(--muted);
  font-size:16px;min-width:34px;padding:0 9px;cursor:pointer;align-self:stretch}
.mchip .del:hover{color:#e6b0b0}
/* La puce rogne ce qui déborde (`overflow:hidden`) : l'anneau passe DEDANS. */
.mchip .corps:focus-visible,.mchip .del:focus-visible{box-shadow:inset 0 0 0 2px #e6edf3}
/* --- composeur --- un trait plein : les pointillés dans les pointillés
   faisaient croire à une zone de dépôt (§4.9). */
.compo{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#141a21}
.phrase{min-height:34px;font-size:14.5px;line-height:1.7;margin-bottom:9px}
.phrase .bl{border-bottom:1px solid var(--line);padding:0 2px}
.phrase .bl.terme{border-bottom:2px solid var(--dc,var(--accent))}
.phrase .trou{color:var(--muted);font-style:italic}
.phrase .bl.terme.pose{display:inline-block;vertical-align:top;max-width:100%;
  padding:2px 5px;margin:1px 0;border-radius:4px 4px 0 0;
  background:color-mix(in srgb, var(--dc,#888) 10%, transparent)}
.phrase .bl.terme.pose .nom{display:block;line-height:1.35}
.phrase .bl.terme.pose .prov{display:flex;align-items:baseline;gap:6px;margin-top:1px}
.phrase .bl.terme.pose .cit{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phrase .bl.terme.pose .sig{flex:none;font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.offre{display:flex;flex-direction:column;gap:4px}
.offre .lab{font-size:12.5px;color:var(--muted);margin-top:6px}
.bbloc{text-align:left;background:#20303f;color:var(--txt);border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;cursor:pointer;font:inherit;font-size:13.5px}
.bbloc:hover{border-color:var(--accent)}
/* Le geste qui parle pèse plus que ceux qui défont (§4.9). */
.compo .barre{display:flex;align-items:center;gap:6px;margin:8px 0}
.compo .barre button{background:none;border:1px solid transparent;color:var(--muted);
  border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px}
.compo .barre button:hover{border-color:var(--line);color:var(--txt)}
.compo .barre .envoi{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#0b1620;
  font-size:15px;font-weight:700;padding:8px 20px;border-radius:8px}
.compo .barre .envoi:hover{background:#8ec8e6;border-color:#8ec8e6;color:#0b1620}
.refus{color:#e6b0b0;font-size:13px;margin-top:8px}
.bbloc.fondement{background:#25313d;border-left:3px solid var(--transmis)}
.porte{display:block;font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
/* --- plaidoirie --- */
.liste{list-style:none;padding:0;margin:0}
.liste li{font-size:13.5px;padding:8px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.liste li:first-child{border-top:none}
.liste li .txt{flex:1;line-height:1.45}
.liste li .up{background:#12324a;color:#bfe0f2;border:1px solid var(--transmis);border-radius:5px;
  padding:3px 8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.liste li .up:hover{border-color:var(--accent)}
.liste li .sent{color:#6d9cb8;font-size:12.5px;white-space:nowrap}
.plaid li{border-left:3px solid var(--transmis);padding-left:9px}
.plaid li .contre{display:block;font-size:12px;color:var(--muted);font-family:var(--mono)}
/* répétition de plaidoirie */
.repet{border:1px dashed #5a3a3a;border-radius:8px;padding:11px;background:#1a1416;margin-bottom:14px}
.repet .rtitle{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.repet .rnote{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:5px 0}
.repet .rnote .txt{flex:1}
.repet .rnote.vide{font-style:italic}
.repet .up{background:#12324a;color:#bfe0f2;border:1px solid var(--transmis);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12.5px}
.repet .btn{margin-top:8px;width:100%;background:#20303f;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px;cursor:pointer;font:inherit;font-size:13.5px}
.repet .btn:hover{border-color:var(--accent)}
/* --- clôture / fin --- sur une ligne : la colonne tient dans la fenêtre. */
.cloture{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:0 2px}
.cloture #btnCloture{background:#2a1c1c;color:#e0b7b7;border:1px solid #5a3a3a;border-radius:8px;
  padding:8px 18px;cursor:pointer;font:inherit;font-size:14px}
.cloture #btnCloture:disabled{background:#1b1719;color:#9a8e92;border-color:#3a3033;cursor:not-allowed}
.cloture .hint{flex:1;min-width:220px;color:var(--muted);font-size:13px}
.cloture .recommencer{margin-left:auto;display:flex;gap:6px}
.cloture .recommencer button{background:none;border:1px solid var(--line);
  color:var(--muted);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:6px;cursor:pointer}
.cloture .recommencer button:hover{color:var(--txt);border-color:var(--muted)}
#btnRecommencer.confirmer{color:#f0c4c4;border-color:#8a4a4a;background:#2a1c1c}
#btnAnnulerRecommencer[hidden]{display:none}
/* modal générique */
.overlay{position:fixed;inset:0;background:rgba(6,8,11,.72);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:620px;width:100%;
  max-height:82vh;overflow-y:auto;padding:20px}
.modal h3{margin:0 0 8px;padding-right:112px;font-size:17px}
/* Le titre n'est qu'un point d'arrivée du focus (§4.10) : pas d'anneau, qui
   déborderait sur la croix. L'id bat `.modal.piece :focus-visible`. */
#modalTitre:focus{outline:none;box-shadow:none}
.modal .close{position:absolute;top:14px;right:14px}
.modal .btnrow{margin-top:10px}
.modal .btnrow button{width:100%;background:#20303f;color:var(--txt);border:1px solid var(--line);
  border-radius:6px;padding:8px;cursor:pointer;font:inherit}
.fin h3{font-size:19px}
.fin .verdict{font-family:var(--mono);color:var(--warn);margin:4px 0 14px}
small.note{color:var(--muted)}
code{font-family:var(--mono);color:var(--accent)}
/* --- LE PAPIER (§4.6) : la pièce ouverte vient du monde, pas de la machine.
   Les teintes des passages y sont FONCÉES dans l'espace OKLab — la palette ne se
   double pas — et restent au-dessus de 3:1 sur le papier, mesurées. --- */
.modal.piece{color-scheme:light;background:var(--papier);color:var(--encre);border-color:var(--filet);
  font-family:var(--serif);max-width:680px;padding:26px 30px 24px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.modal.piece h3{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--encre)}
.modal.piece small.note{display:block;color:var(--encre2);font-style:italic;font-size:14.5px;
  padding-bottom:10px;border-bottom:1px solid var(--filet);margin-bottom:6px}
.modal.piece .piecetexte{font-size:17px;line-height:1.8;margin:14px 0 6px}
.modal.piece .empan{--dcp:color-mix(in oklab, var(--dc,#888) 70%, black);
  text-decoration-color:var(--dcp);background:color-mix(in srgb, var(--dcp) 9%, transparent)}
.modal.piece .empan:hover{background:color-mix(in srgb, var(--dcp) 18%, transparent)}
.modal.piece .empan.pris{background:color-mix(in srgb, var(--dcp) 26%, transparent)}
.modal.piece .close{color:var(--encre);border-color:var(--filet);font-family:var(--sans)}
.modal.piece .close:hover{border-color:var(--encre2)}
.modal.piece kbd{color:var(--encre2);border-color:var(--filet)}
.modal.piece :focus-visible{box-shadow:0 0 0 2px var(--papier),0 0 0 4px #1d3b57}
/* Un article n'est pas un témoignage : un double filet le distingue. */
.modal.piece.regle{border-left:6px double #b3a37f}
.modal.piece .rappel{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--encre2);
  background:#ebe4d4;color:var(--encre);font-family:var(--sans);font-size:14px}
/* --- l'index du dossier : les pièces d'abord, les règles ensuite --- */
.dossier{display:flex;flex-direction:column;gap:6px;padding:2px 0 4px}
.dcol{min-width:0;display:flex;gap:8px;align-items:baseline}
.dcol .dtitre{flex:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.dcol .dchips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dcol .dvide{color:var(--muted);font-size:12.5px;font-style:italic}
/* La puce porte le TITRE de la pièce, celui sous lequel la Discussion l'a
   transmise (§4.6) : de la prose, donc ni mono ni corps de matricule. */
.dchip{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;
  border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:4px 8px;cursor:pointer;color:var(--txt)}
.dchip:hover{border-color:var(--accent)}
.dchip.vu{color:var(--muted);background:#181e27}
.dchip.regle{border-color:#4a4030;color:var(--warn)}
.panne{flex:none;background:#2a1c1c;color:#e0b7b7;border:1px solid #5a3a3a;border-radius:8px;padding:12px;margin:16px 20px}
/* --- le tutoriel (§4.8) : le halo ENTOURE la zone, jamais un empan (§4.3).
   Aucun voile : il intercepterait les clics qu'il prétend montrer. --- */
[data-tuto]{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;
  animation:pouls 1.8s ease-in-out infinite}
@keyframes pouls{0%,100%{outline-color:var(--accent)}50%{outline-color:transparent}}
[data-tuto="alerte"]{outline-color:var(--warn);animation-name:poulsAlerte}
@keyframes poulsAlerte{0%,100%{outline-color:var(--warn)}50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){ [data-tuto]{animation:none} }
/* EN TÊTE ET DANS LE FLUX (§4.8) : il réserve sa place et pousse le jeu vers le
   bas — il ne peut donc jamais recouvrir ses propres ancres. Ce qu'un
   `position:fixed` faisait, et c'est pour ça qu'il n'en est plus un. */
#tuto{flex:none;position:sticky;top:0;z-index:60;width:fit-content;margin:12px auto 0;
  display:flex;align-items:baseline;gap:16px;max-width:min(640px,calc(100vw - 32px));
  background:#20303f;border:2px solid var(--accent);border-radius:10px;
  padding:16px 22px;font-size:15px;box-shadow:0 10px 34px rgba(0,0,0,.6)}
#tuto[hidden]{display:none}
/* Le bandeau parlant, la pièce ouverte se range DESSOUS au lieu de se centrer :
   `--haut` est le seul nombre, et la hauteur maximale s'en déduit — la modale
   tient donc entre le bandeau et le bas, à n'importe quelle taille d'écran.
   Le sélecteur ne mord que parce que `#tuto` est en tête de <body>, donc frère
   AVANT `#modalRoot`. */
#tuto:not([hidden]) ~ #modalRoot .overlay{--haut:112px;align-items:flex-start;padding-top:var(--haut)}
#tuto:not([hidden]) ~ #modalRoot .modal{max-height:calc(100vh - var(--haut) - 24px)}
#tuto[data-alerte]{border-color:var(--warn)}
#tuto[data-alerte] .dit{color:var(--warn)}
#tuto .pas{color:var(--muted);font-family:var(--mono);font-size:12.5px}
#tuto .dit{flex:1}
#tuto .passer{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;
  cursor:pointer;text-decoration:underline;padding:0;white-space:nowrap}
#tuto .passer:hover{color:var(--txt)}

</style>
</head>
<body>

<!-- LE TUTORIEL (§4.8) — PIÈGE : PREMIER enfant de <body>, avant `.wrap`.
     Collant dans le flux, il RÉSERVE sa place et pousse le jeu vers le bas :
     c'est ce qui l'empêche de recouvrir ses propres ancres. Son z-index le
     garde lisible par-dessus l'`.overlay` de la pièce ouverte, et c'est sa
     position AVANT `#modalRoot` qui fait mordre le sélecteur décalant la
     modale. Le renvoyer en fin de page ne casse aucune suite : il recouvre
     à nouveau, en silence. -->
<div id="tuto" hidden>
  <span class="pas" id="tutoPas"></span>
  <span class="dit" id="tutoDit"></span>
  <button class="passer" onclick="tutoPasser()">je sais faire</button>
</div>

<div class="wrap">
  <!-- Un en-tête nomme la SURFACE (§4.6), jamais les zones qu'elle contient. -->
  <section class="col fil" aria-labelledby="titreDiscussion">
    <h2 id="titreDiscussion">Discussion</h2>
    <div class="body" id="discussion"></div>
  </section>
  <!-- LES DEUX SURFACES DE CÔTÉ (§4.6) — PIÈGE : leur PLACE DANS LE DOCUMENT est
       toute la mécanique. Entre la conversation et le composeur, elles s'ouvrent
       SANS rien recouvrir : on garde la question sous les yeux et on voit la
       phrase se construire. Les déplacer ailleurs dans `.wrap`, ou les sortir du
       flux, défait exactement ça — et aucune suite ne voit une géométrie. -->
  <!-- Les croix ont un NOM, et Échap s'y lit (§4.10) : `title` n'était qu'une
       description, le lecteur d'écran annonçait « × ». -->
  <section class="col panneau" id="panContexte" hidden aria-labelledby="titreContexte">
    <h2><span id="titreContexte">Contexte</span><button class="fermer" onclick="fermerPanneau()" aria-label="Fermer le Contexte (Échap)" aria-keyshortcuts="Escape"><span class="x" aria-hidden="true">×</span><kbd>Échap</kbd></button></h2>
    <div class="body" id="contexte"></div>
  </section>
  <section class="col panneau" id="panPlaidoirie" hidden aria-labelledby="titrePlaidoirie">
    <!-- Pas de compte ici : la barre du composeur le porte, et il reste
         visible panneau ouvert ou fermé (§4.9 règle 3). -->
    <h2><span id="titrePlaidoirie">Plaidoirie</span><button class="fermer" onclick="fermerPanneau()" aria-label="Fermer la Plaidoirie (Échap)" aria-keyshortcuts="Escape"><span class="x" aria-hidden="true">×</span><kbd>Échap</kbd></button></h2>
    <div class="body" id="plaidoirie"></div>
  </section>
  <!-- On répond SOUS la question (§4.6). PIÈGE : `#composeur` est le FRÈRE de
       `#discussion`, jamais son enfant — le fil se recale en bas à chaque
       message, la phrase qu'on écrit ne doit pas partir avec lui. Il est aussi
       le frère de `.scene`, et c'est ce qui le garde visible sous un panneau. -->
  <div id="composeur" role="region" aria-label="Ta réponse"></div>
  <!-- Sur une ligne : la colonne tient dans la fenêtre (§4.6). La confirmation
       de « recommencer » attend qu'on réponde — jamais un minuteur (§4.10). -->
  <div class="cloture">
    <button id="btnCloture" onclick="cloturer()" disabled>Clôturer l'instruction</button>
    <div class="hint" id="clotureHint">Maître Auber attend encore quelque chose.</div>
    <span class="recommencer">
      <button id="btnRecommencer" onclick="recommencer()" title="Effacer la partie en cours et repartir de la remise 1">⟲ recommencer</button>
      <button id="btnAnnulerRecommencer" onclick="annulerRecommencer()" hidden>annuler</button>
    </span>
  </div>
</div>

<div id="modalRoot"></div>

<!-- LA VOIX D'ANNONCE (§4.10) — PIÈGE : dans le HTML STATIQUE, et HORS de
     `.wrap`. Une région créée au moment d'annoncer ne dit pas sa première
     phrase ; une région dans `.wrap` se tait quand la pièce la rend inerte. -->
<div id="annonce" class="sr" aria-live="polite"></div>

<script>
// Le moteur de la grammaire, en mode double (`require` ou `<script src>`).
// Aucune donnée : on reçoit GRAMMAIRE / CHAMPS / LIENS et on rend les fonctions
// pures qui composent, valident et reconnaissent une phrase (§14).
function creerMoteur(GRAMMAIRE, CHAMPS, LIENS) {
  const G = GRAMMAIRE;
  const C = Object.fromEntries(CHAMPS.map(c => [c.id, c]));
  const estFinal = e => G.finaux.includes(e);
  const offerts = e => G.blocs.filter(b => b.de === e);

  /* ---- LA DÉDUCTION (§4.5) ---- la relation se calcule de la dimension et des
     valeurs : le joueur désigne, il ne déclare plus. */
  const enNombre = v => {
    const s = String(v == null ? "" : v).trim();
    if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    const m = s.match(/^(\d{1,2}):(\d{2})$/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  };
  function comparer(a, b) {
    const x = enNombre(a), y = enNombre(b);
    if (x !== null && y !== null) return x < y ? -1 : x > y ? 1 : 0;
    const sa = String(a), sb = String(b);
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  }
  // La forme qui lie deux empans, ou null (dimensions différentes → null, le
  // seul refus qui existe). L'ORDRE de déclaration tranche les ambiguïtés (§11).
  function deduire(idA, idB) {
    const a = C[idA], b = C[idB];
    if (!a || !b || idA === idB || a.dim !== b.dim) return null;
    const egal = comparer(a.valeur, b.valeur) === 0;
    for (const [nom, f] of Object.entries(G.formes)) {
      if (!f.deduction || (f.arite || 2) !== 2) continue;
      const s = f.slots && f.slots[0];
      if (s !== "*" && !(s || []).includes(a.dim)) continue;
      if (f.deduction === "egalite" ? egal : !egal) return nom;
    }
    return null;
  }
  function ordonner(forme, termes) {
    const f = G.formes[forme];
    if (!f || !f.ordonne || termes.length !== 2) return termes;
    if (termes.some(t => typeof t === "object" || !C[t])) return termes;
    const [x, y] = termes;
    const inverser = (f.sens || "asc") === "asc"
      ? comparer(C[x].valeur, C[y].valeur) > 0
      : comparer(C[x].valeur, C[y].valeur) < 0;
    return inverser ? [y, x] : [x, y];
  }

  // Une chaîne de blocs → sa forme réduite. `deduit` fait DÉDUIRE la forme des
  // deux termes ; `imbrique` EMBOÎTE ce qui précède. Sans l'un ni l'autre : la
  // dernière forme gagne, termes à plat (§11).
  function reduire(ch) {
    let termes = [], forme = null;
    for (const p of ch) {
      const b = p.bloc;
      if (b.type === "terme") termes.push(p.valeur);
      if (b.deduit) {
        forme = termes.length === 2 ? deduire(termes[0], termes[1]) : null;
        if (forme) termes = ordonner(forme, termes);
      } else if (b.forme) {
        if (b.imbrique) termes = [{ forme, termes }];
        forme = b.forme;
      }
    }
    return { forme, termes };
  }
  const dimDe = t => (typeof t === "object" ? "affirmation" : C[t].dim);
  function valider(r) {
    const f = G.formes[r.forme];
    if (!f) return "ces deux-là ne se comparent pas";
    if (r.termes.length !== f.arite) return "arité";
    for (let i = 0; i < r.termes.length; i++) {
      const s = f.slots[i], d = dimDe(r.termes[i]);
      if (s !== "*" && !s.includes(d)) return `slot ${i} refuse « ${d} »`;
      // PIÈGE : un terme EMBOÎTÉ doit tenir pour lui-même — « affirmation » est
      // une catégorie que tout objet satisfait, et la qualification est le seul
      // chemin de clôture (§4.5).
      if (typeof r.termes[i] === "object") {
        const err = valider(r.termes[i]);
        if (err) return err;
      }
    }
    if (f.relation === "meme_dim") {
      const ds = r.termes.map(dimDe);
      if (new Set(ds).size !== 1) return "dimensions différentes";
      if (r.termes[0] === r.termes[1]) return "terme répété";
    }
    return null;
  }
  const memeTerme = (a, b) => (typeof a === "object" || typeof b === "object")
    ? (typeof a === "object" && typeof b === "object" && memeRed(a, b))
    : a === b;
  function memeRed(x, y) {
    if (x.forme !== y.forme || x.termes.length !== y.termes.length) return false;
    const f = G.formes[x.forme];
    if (f.ordonne) return x.termes.every((t, i) => memeTerme(t, y.termes[i]));
    return x.termes.every(t => y.termes.some(u => memeTerme(t, u)))
        && y.termes.every(t => x.termes.some(u => memeTerme(t, u)));
  }
  const lienDe = r => LIENS.find(l => memeRed({ forme: l.forme, termes: l.termes }, r));
  const nomDe = v => (C[v] ? (C[v].nom || C[v].texte) : String(v));
  const citeDe = v => {
    const c = C[v]; if (!c) return String(v);
    return (c.nom || c.texte) + " : « " + c.texte + " »" + (c.court ? " (" + c.court + ")" : "");
  };
  function rendre(ch) {
    let bouts = [], termes = [], forme = null;
    for (const p of ch) {
      const b = p.bloc;
      // PIÈGE : un bloc peut être terme ET `deduit` — les deux traitements
      // s'enchaînent, jamais l'un ou l'autre.
      if (b.type === "terme") {
        termes.push(p.valeur);
        bouts.push(b.source === "note" ? b.texte : nomDe(p.valeur));
      } else if (b.texte) bouts.push(b.texte);
      if (b.deduit) {
        forme = termes.length === 2 ? deduire(termes[0], termes[1]) : null;
        const f = forme && G.formes[forme];
        if (f && f.patron) {
          const ord = ordonner(forme, termes);
          bouts.splice(bouts.length - 2, 2,
            f.patron.replace("{a}", nomDe(ord[0])).replace("{b}", nomDe(ord[1])));
          termes = ord;
        }
      } else if (b.forme) {
        // PIÈGE : le flag est porté par la LIAISON, jamais par le terme — la
        // voie de comparaison partage le même bloc de premier terme.
        if (b.cite && termes.length === 1 && typeof termes[0] === "string")
          bouts.splice(bouts.length - 1, 1, citeDe(termes[0]));
        if (b.imbrique) termes = [{ forme, termes }];
        forme = b.forme;
      }
    }
    return bouts.filter(t => t != null && t !== "")
      .reduce((acc, t) => acc + (acc && !/^[,;:.…]/.test(t) ? " " : "") + t, "") + ".";
  }
  function squelettes() {
    const out = [];
    (function m(e, acc) { if (estFinal(e)) return out.push(acc);
      for (const b of offerts(e)) m(b.vers, [...acc, b]); })(G.depart, []);
    return out;
  }
  return { C, estFinal, offerts, reduire, dimDe, valider, memeTerme, memeRed, lienDe, rendre,
           squelettes, comparer, deduire, ordonner };
}

const _projections = (function () {

function champsDe(contenu) {
  const out = [];
  for (const [pid, p] of Object.entries((contenu || {}).pieces || {}))
    for (const [eid, e] of Object.entries(p.empans || {}))
      out.push({ id: pid + "." + eid, pid, eid, dim: e.dim, valeur: e.valeur,
                 texte: e.texte, nom: e.nom || e.texte, qui: e.qui || p.qui || "",
                 court: p.court || "" });
  return out;
}

function comparaisonsDe(liens, formes) {
  const out = [], vus = new Set();
  const rec = t => {
    if (!t || typeof t !== "object" || Array.isArray(t)) return;
    if (t.forme && (((formes || {})[t.forme] || {}).arite || 2) === 2) {
      const cle = JSON.stringify([t.forme, t.termes]);
      if (!vus.has(cle)) { vus.add(cle); out.push({ forme: t.forme, termes: t.termes }); }
    }
    for (const u of (t.termes || [])) rec(u);
  };
  for (const L of (liens || [])) rec(L);
  return out;
}

/* La dimension se lit par la couleur ET par le trait, au même rang (§4.3,
   §4.10). PIÈGE PAYÉ : l'ancienne palette opposait un rouge (qui) à un vert
   (où) et un bleu à un mauve — indiscernables sous deutéranopie. Celle-ci n'a
   plus de rouge ; elle a été choisie à la mesure (distance OKLab minimale
   entre paires, en vision normale et sous trois déficiences simulées), sur le
   fond sombre comme sur le papier des pièces, où `jeu.css` la fonce. */
const PALETTE_DIM = ["#5ab4ea", "#f0a020", "#2fbf8f", "#e8dc5a", "#d886b6", "#c8ccd2"];
const TRAITS_DIM  = ["solid", "double", "dotted", "dashed", "wavy"];
function couleurDim(dimensions, d) {
  const i = (dimensions || []).indexOf(d);
  return i < 0 ? null : PALETTE_DIM[i % PALETTE_DIM.length];
}
function traitDim(dimensions, d) {
  const i = (dimensions || []).indexOf(d);
  return i < 0 ? null : TRAITS_DIM[i % TRAITS_DIM.length];
}

  return { champsDe, comparaisonsDe, couleurDim, traitDim, PALETTE_DIM, TRAITS_DIM };
})();

const _api = { creerMoteur, ..._projections };
if (typeof module !== "undefined" && module.exports) module.exports = _api;
if (typeof window !== "undefined") window.MoteurGrammaire = _api;

</script>

<script>
// Les RÈGLES DU JEU — pures, sans DOM, sans localStorage, sans fenêtre.
// Mode double : `require` (tests, banc) ou `<script src>` (jeu, atelier) ; le
// pas-à-pas les APPELLE au lieu de les recopier (§12).
// Convention : chaque fonction reçoit `S` en premier argument et le modifie sur
// place ; aucune ne rend de HTML ; celles qui « parlent » poussent dans `S.fil`.
function creerRegles(JEU, M) {

  /* ---- L'ÉTAT (§4.6) ------------------------------------------------ */
  function etatInitial() { return {
    fil: [],                      // le canal : {qui, texte, pieces[], ia}
    examinees: [],                // pièces ouvertes au moins une fois
    remisesEnvoyees: 0,
    retenus: [],                  // PRIVÉ — ["pid.eid"] dans l'ordre de surlignage
    compo: [],                    // la phrase en cours — [{bloc:id, valeur}]
    refus: null,                  // le dernier refus de catégorie, à afficher
    brouillon: [],                // PRIVÉ — journal des phrases closes, sans zone
    prete: null,                  // PRIVÉ — index, dans le journal, de la phrase
                                  //   qui attend sur place (§4.7)
    plaidoirie: [],               // TRANSMIS — {b:index journal, contre:index affirmation|null}
    satisfaits: [],               // tags d'attente déjà servis
    vice_pressenti: false,        // la comparaison ⚑ s'est formée au composeur
    vice_trouve: false,           // la conclusion ⚑ est composée
    vice_expose: false,           // la conclusion ⚑ est envoyée
    clotureDemandee: false,
    repetitionIdx: -1,
    declenches: [],               // pièces dont le `declenche` une_fois a joué
    inutiles: 0, incompris: 0,    // compteurs d'agacement de l'avocat
    hors_sujet: 0,                // …et celui des citations qui ne répondent pas
    modalPiece: null
  }; }

  function signatureContenu() {
    const s = JSON.stringify(JEU); let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* ---- Le canal ----------------------------------------------------- */
  const pousser = (S, qui, texte, pieces, ia) =>
    S.fil.push({ qui, texte, pieces: pieces || [], ia: !!ia });

  /* Seul normalisateur du jeu (R9) : l'ancienne forme se lit comme une liste à
     un élément (§11). */
  function attentesDe(r) {
    if (!r) return [];
    if (Array.isArray(r.attentes)) return r.attentes;
    return r.attend ? [{ attend: r.attend, apres: r.apres }] : [];
  }
  const attenteCourante = (S, r) => attentesDe(r).find(a => !S.satisfaits.includes(a.attend));
  const remiseCourante = S => JEU.remises[S.remisesEnvoyees - 1];
  function poserQuestion(S, r) {
    const a = attenteCourante(S, r);
    if (a && a.question) pousser(S, r.qui || "Maître Auber", a.question);
  }

  function envoyerRemise(S) {
    if (S.remisesEnvoyees >= JEU.remises.length) return;
    const r = JEU.remises[S.remisesEnvoyees];
    S.remisesEnvoyees++;
    pousser(S, r.qui, r.texte, r.pieces);
    poserQuestion(S, r);
  }

  function ouvrirPiece(S, pid) {
    if (!S.examinees.includes(pid)) S.examinees.push(pid);
    S.modalPiece = pid;
    const d = (JEU.pieces[pid] || {}).declenche;
    if (d && d.replique && !(d.une_fois && S.declenches.includes(pid))) {
      S.declenches.push(pid);
      pousser(S, d.qui || "Maître Auber", d.replique);
    }
  }

  /* ---- Les pièces reçues -------------------------------------------- */
  function piecesLivrees(S) {
    const out = [];
    for (let i = 0; i < S.remisesEnvoyees; i++)
      for (const pid of (JEU.remises[i].pieces || [])) out.push(pid);
    return out;
  }
  const estRegle = p => _apiRegles.estRegle(p);

  /* ---- LE CONTEXTE — privé, gratuit, illimité ---- */
  // PIÈGE : `surligner` (la pièce) N'AJOUTE QUE — re-cliquer un passage déjà
  // retenu ne fait rien ; seul `oublier` (le Contexte) retire. Une pièce ne
  // peut plus désélectionner, pour éviter une mauvaise manipulation.
  function surligner(S, pid, eid) {
    const k = pid + "." + eid;
    if (!S.retenus.includes(k)) S.retenus.push(k);
  }
  function oublier(S, pid, eid) {
    const k = pid + "." + eid, i = S.retenus.indexOf(k);
    if (i >= 0) S.retenus.splice(i, 1);
  }

  /* ---- LE COMPOSEUR -------------------------------------------------- */
  const blocParId = id => (JEU.grammaire.blocs || []).find(b => b.id === id);
  function etatCompo(S) {
    let e = JEU.grammaire.depart;
    for (const p of S.compo) { const b = blocParId(p.bloc); if (b) e = b.vers; }
    return e;
  }
  function blocsDepuis(e, S) {
    const livrees = new Set(piecesLivrees(S));
    return (JEU.grammaire.blocs || []).filter(b => b.de === e && (!b.piece || livrees.has(b.piece)));
  }
  function blocsOfferts(S) { return blocsDepuis(etatCompo(S), S); }
  function indexTermeChamp(S) {
    if (S.prete != null) return -1;
    return blocsOfferts(S).findIndex(b => b.type === "terme" && b.source !== "note");
  }
  function comparaisonPossible(S) {
    const offerts = blocsOfferts(S);
    if (S.compo.length) return offerts.some(b => b.type === "terme" && b.deduit);
    return offerts.some(b => b.type === "terme"
      && blocsDepuis(b.vers, S).some(x => x.type === "terme" && x.deduit));
  }
  function dimAttendue(S) {
    const i = indexTermeChamp(S);
    if (i < 0) return null;
    const b = blocsOfferts(S)[i];
    if (!b.deduit) return null;
    const premier = S.compo.find(p => { const pb = blocParId(p.bloc); return pb && pb.type === "terme"; });
    return premier ? M.dimDe(premier.valeur) : null;
  }
  const chaineCompo = S => S.compo.map(p => ({ bloc: blocParId(p.bloc), valeur: p.valeur }));
  const compoFinie = S => (JEU.grammaire.finaux || []).includes(etatCompo(S));

  const sousLienVice = () => {
    const c = (JEU.liens || []).find(L => L.vice && L.conclusion);
    const t = c && (c.termes || [])[0];
    return (t && typeof t === "object") ? t : null;
  };
  const estPressentiment = r => {
    const sous = sousLienVice();
    return !!(sous && r && r.forme && M.memeRed(r, sous));
  };
  const estConclusionVice = r => {
    const c = (JEU.liens || []).find(L => L.vice && L.conclusion);
    return !!(c && r && r.forme && M.memeRed(r, { forme: c.forme, termes: c.termes }));
  };
  /* LES DEUX DRAPEAUX PRIVÉS SE LÈVENT ICI (§4.7) : comprendre, c'est
     assembler — plus clore. C'est ce qui garde la Fin 2 jouable. */
  function pressentir(S, r) {
    if (!S.vice_pressenti && estPressentiment(r)) S.vice_pressenti = true;
    if (!S.vice_trouve && estConclusionVice(r)) { S.vice_pressenti = true; S.vice_trouve = true; }
  }
  function majPressentiment(S) { pressentir(S, M.reduire(chaineCompo(S))); }

  // PIÈGE : iBloc indexe blocsOfferts() — POSITIONNEL dans la liste filtrée,
  // donc dépendant de la session ; iSrc indexe le contexte ou le brouillon.
  function poserBloc(S, iBloc, iSrc) {
    S.prete = null;              // reprendre abandonne la phrase qui attendait
    const b = blocsOfferts(S)[iBloc]; if (!b) return;
    let valeur = null;
    if (b.type === "terme") {
      if (b.source === "note") {
        const n = S.brouillon[iSrc]; if (!n) return;
        valeur = n.reduite;
      } else {
        const k = S.retenus[iSrc]; if (!k) return;
        valeur = k;
      }
    }
    S.compo.push({ bloc: b.id, valeur });
    S.refus = null;
    const r = M.reduire(chaineCompo(S));
    const err = b.deduit && !r.forme ? "ces deux-là ne se comparent pas"

const R = (window.ReglesJeu||{}).creerRegles

/* ---- Sauvegarde de partie — de l'écran, pas de la règle ---- */
const CLE_PARTIE="iavocat_partie";

/* ---- Le tutoriel des deux premiers gestes (§4.8) — de l'écran, pas de la

function tutoLienAttente(){

  if(!tutoFait && S.remisesEnvoyees>1) tutoClore();

  if(e && e.dit!==tutoDernierDit) tutoAnnonce="Tutoriel, "+e.n+" sur "+TUTO_TOTAL+" : "+e.dit;

  const cle = a.getAttribute("data-f") || (a.id ? "#"+a.id : null);
  const z = a.closest(ZONES_FOCUS);
  return { cle, zone: z ? (z.id ? "#"+z.id : "."+z.classList[0]) : null };
}
function focalisable(el){
  return !!el && document.contains(el) && !el.disabled && !el.closest("[hidden],[inert]");
}
function premierFocalisable(zone){
  if(!zone) return null;
  for(const sel of FOCALISABLES){
    const el=[...zone.querySelectorAll(sel)].find(focalisable);
    if(el) return el;
  }
  return zone.hasAttribute("tabindex") && focalisable(zone) ? zone : null;
}
function rendreFocus(m, force){
  if(!m) return;
  const a=document.activeElement;
  if(!force && a && a!==document.body && document.contains(a)) return;   // rien de perdu
  let el = !m.cle ? null
    : m.cle[0]==="#" ? document.querySelector(m.cle)
    : [...document.querySelectorAll("[data-f]")].find(x=>x.getAttribute("data-f")===m.cle);
  // Le même élément retrouvé était sous les yeux : on ne fait pas défiler.
  if(focalisable(el)){ el.focus({preventScroll:true}); return; }
  el = premierFocalisable(m.zone && document.querySelector(m.zone));
  if(!focalisable(el)) el = premierFocalisable($("composeur"));
  if(el) el.focus();
}

/* §4.10 règle 4 — CE QUI ARRIVE S'ANNONCE, par une voix unique : `#annonce`,
   hors de `.wrap` (une région inerte se tait). PIÈGE : jamais `role="log"` sur
   la Discussion — elle se réécrit à chaque geste, et un lecteur d'écran la
   relirait d'un bout à l'autre. */
let annonces=[], vusFil=-1, dernierRefus=null;
function annoncer(txt){ if(txt) annonces.push(txt); }
function publierAnnonces(){
  const el=$("annonce");
  if(!el || !annonces.length) return;
  const t=annonces.join(" "); annonces=[];
  el.textContent = el.textContent===t ? t+" " : t;   // la même phrase, redite
}
function texteBrut(html){
  const t=document.createElement("template"); t.innerHTML=String(html||"");
  return t.content.textContent.replace(/\s+/g," ").trim();
}
/* Au démarrage, rien ne s'annonce : la page se lit dans l'ordre. Ensuite, les
   répliques de l'avocat (celles de l'IA, le joueur vient de les écrire), un
   refus neuf, puis la consigne neuve du tutoriel. */
function annoncerNouveautes(){
  if(vusFil<0){ vusFil=S.fil.length; dernierRefus=S.refus||null; tutoAnnonce=null; return; }
  for(const m of S.fil.slice(vusFil)) if(!m.ia){
    const n=(m.pieces||[]).length;
    annoncer(`${m.qui} : ${texteBrut(m.texte)}${n ? ` (${n} pièce${n>1?"s":""} jointe${n>1?"s":""})` : ""}`);
  }
  vusFil=S.fil.length;
  if(S.refus && S.refus!==dernierRefus) annoncer(S.refus);
  dernierRefus=S.refus||null;
  if(tutoAnnonce){ annoncer(tutoAnnonce); tutoAnnonce=null; }
}

function rendreTout(){
  const force=!!focusVoulu, m=focusVoulu || memoFocus(); focusVoulu=null;
  const enBas=filEnBas();
  if(S.modalPiece) majPiece();
  renderDiscussion(); renderComposeur(); renderContexte(); renderPlaidoirie(); majCloture(); majPanneaux(); majTutoriel();
  recalerFil(enBas);
  rendreFocus(m, force);
  rappelRetrait=null;
  annoncerNouveautes(); publierAnnonces();
  sauverPartie();
}

/* ---- Le canal : un fil de messages ---- */
function renderDiscussion(){
  let h="", dernier=null;
  for(const m of S.fil){
    // PIÈGE : l'avocat vient du contenu, déjà écrit pour l'écran ; la phrase
    // composée de l'IA, elle, s'échappe.
    const meme = m.qui===dernier; dernier=m.qui;
    h+=`<div class="msg ${m.ia?'ia':''} ${meme?'suite':''}">${
      meme?"":`<div class="who">${escapeAttr(m.qui)}</div>`}<div class="bubble">${m.ia?escapeAttr(m.texte):m.texte}<div>`;
    // Une pièce lue porte un ✓, comme dans l'index — jamais un gris qui la
    // ferait passer pour désactivée (§4.10 règle 5).
    for(const pid of m.pieces){
      const lue=S.examinees.includes(pid), titre=JEU.pieces[pid].titre;
      h+=`<button type="button" class="attach ${lue?'seen':''}" data-f="a:${pid}" onclick="ouvrirPiece('${pid}')"
            aria-label="${escapeAttr(titre)}${lue?", déjà lue":""}"><span aria-hidden="true">${lue?"✓":"📎"}</span> ${escapeAttr(titre)}</button>`;
    }
    h+=`</div></div></div>`;
  }
  if(S.clotureDemandee && S.repetitionIdx>-1 && S.repetitionIdx<JEU.repetition.affirmations.length){
    const dispo=S.brouillon.map((n,i)=>({n,i}));
    h+=`<div class="repet"><div class="rtitle">Opposer une phrase à cette affirmation ?</div>${
      dispo.length ? dispo.map(x=>
        `<div class="rnote"><span class="txt">${escapeAttr(x.n.texte)}</span>
         ${x.n.versee?`<span class="sent">déjà envoyée</span>`:`<button class="up" data-f="r:${x.i}" onclick="verserContre(${x.i})">envoyer</button>`}</div>`).join("")
      : `<div class="rnote vide">tu n'as écrit aucune phrase à y opposer</div>`
    }<button class="btn" data-f="rsuite" onclick="avancerRepetition()">Ne rien envoyer — continuer</button></div>`;
  }
  $("discussion").innerHTML=h;
}
/* Le fil se recale en bas s'il y ÉTAIT — nouveau message, panneau ouvert, phrase
   qui s'allonge : la question reste sous les yeux. Remonté pour relire (ou pour
   suivre le focus), il n'est plus arraché vers le bas à chaque geste. PIÈGE :
   le recalage vient APRÈS `majPanneaux` — c'est lui qui change la hauteur. */
let filLongueur=-1;
function filEnBas(){
  const el=$("discussion");
  return !el || el.scrollHeight - el.scrollTop - el.clientHeight < 8;
}
function recalerFil(enBas){
  const el=$("discussion"); if(!el) return;
  const neuf = S.fil.length!==filLongueur; filLongueur=S.fil.length;
  if(enBas || neuf) el.scrollTop=el.scrollHeight;
}

/* ---- Les pièces ---- le marquage ne varie jamais avec la pertinence (§4.3). */
function rendreTexte(pid){
  const p=JEU.pieces[pid];
  const src=String(p.texte||"");
  let h="", reste=src, m;
  const re=/\{\{([A-Za-z0-9_]+)\}\}/;
  while((m=re.exec(reste))){
    h+=escapeAttr(reste.slice(0,m.index));
    const eid=m[1], e=(p.empans||{})[eid];
    if(e){
      /* PIÈGE : un SPAN qui se déclare bouton, jamais un <button> — celui-ci est
         une boîte insécable même en `display:inline`, et un passage long
         sauterait à la ligne d'un bloc au lieu de couler dans la prose (§4.10).
         Entrée et Espace passent par `clavier`. Pas d'`aria-pressed` : ce n'est
         pas un interrupteur, la pièce n'ajoute que (§4.3). */
      const k=pid+"."+eid, pris=S.retenus.includes(k);
      h+=`<span class="empan ${pris?'pris':''}" role="button" tabindex="0" data-f="e:${k}"
            style="--dc:${couleurDim(e.dim)};--ds:${traitDim(e.dim)}"
            onclick="surligner('${pid}','${eid}')" title="${escapeAttr(e.dim)} — ${escapeAttr(e.qui||p.qui||'')}">${
            escapeAttr(e.texte)}<span class="sr"> — ${escapeAttr(e.dim)}${pris?", retenu":""}</span></span>`;
    } else h+=escapeAttr(m[0]);
    reste=reste.slice(m.index+m[0].length);
  }
  h+=escapeAttr(reste);
  return h;
}
/* `rendreTout` redessine la pièce ouverte, sous la même mémoire de focus que le
   reste : on n'appelle plus `modal` que par lui. */
function ouvrirPiece(pid){
  ouvreur = memoFocus();
  R.ouvrirPiece(S,pid);
  focusVoulu = { cle:"#modalTitre", zone:".modal" };
  rendreTout();
}
function classePiece(pid){ return "piece" + (R.estRegle(JEU.pieces[pid]) ? " regle" : ""); }
/* Redessinée à chaque geste, la pièce garde son défilement : retenir un passage
   en bas d'une longue pièce ne la ramène pas en haut. */
function majPiece(){
  const avant=document.querySelector("#modalRoot .modal");
  const haut = avant && avant.classList.contains("piece") ? avant.scrollTop : 0;
  modal(modalPieceHTML(S.modalPiece), classePiece(S.modalPiece));
  const apres=document.querySelector("#modalRoot .modal"); if(apres) apres.scrollTop=haut;
}
function renderDossier(){
  if(!S.remisesEnvoyees) return "";
  const livres=R.piecesLivrees(S);
  const chip=pid=>{
    const p=JEU.pieces[pid], vu=S.examinees.includes(pid);
    // La puce porte le TITRE, celui de la pièce jointe : une pièce ne porte
    // qu'un nom (§4.6). D'où plus de `title` — il disait déjà ça (§4.9).
    // Le marqueur reste en tête du texte ; l'état se dit par le nom accessible.
    return `<button type="button" class="dchip ${vu?'vu':''} ${R.estRegle(p)?'regle':''}" data-f="d:${pid}"
      aria-label="${escapeAttr(p.titre)}${vu?", déjà lue":""}" onclick="ouvrirPiece('${pid}')">${vu?'✓':'●'} ${escapeAttr(p.titre)}</button>`;
  };
  const colonne=(titre,pids)=>`<div class="dcol"><span class="dtitre">${titre}</span>
    <div class="dchips">${pids.length?pids.map(chip).join(""):`<span class="dvide">—</span>`}</div></div>`;
  const pieces=livres.filter(pid=>!R.estRegle(JEU.pieces[pid]));
  const regles=livres.filter(pid=> R.estRegle(JEU.pieces[pid]));
  return `<div class="zone" id="zoneDossier">
    <div class="dossier">${colonne("Les pièces",pieces)}${colonne("Les règles",regles)}</div></div>`;
}

/* 5) LE CONTEXTE — privé, gratuit, illimité, et CLAVIER du composeur (§4.6).
      Surligner ne produit RIEN : c'est voulu. */
/* La pièce n'ajoute que — jamais n'oublie (§4.3). Mais recliquer un passage déjà
   retenu ne passe plus sous silence : l'écran dit où l'on retire. `rappelRetrait`
   vit le temps d'un rendu. */
let rappelRetrait=null;
const RAPPEL_RETRAIT="Déjà dans ton Contexte — c'est là qu'on le retire.";
function surligner(pid,eid){
  const k=pid+"."+eid;
  rappelRetrait = S.retenus.includes(k) ? k : null;
  R.surligner(S,pid,eid);
  annoncer(rappelRetrait ? RAPPEL_RETRAIT : "Retenu dans ton Contexte.");
  rendreTout();
}
function oublier(pid,eid){
  R.oublier(S,pid,eid);            // le Contexte seul peut retirer
  rendreTout();
}
function modalPieceHTML(pid){
  const p=JEU.pieces[pid];
  return `<h3 id="modalTitre" tabindex="-1">${escapeAttr(p.titre)}</h3><small class="note">${escapeAttr(p.type)} — ${escapeAttr(p.qui||"")}</small>
    <p class="piecetexte">${rendreTexte(pid)}</p>
    ${rappelRetrait && rappelRetrait.startsWith(pid+".") ? `<p class="rappel">${RAPPEL_RETRAIT}</p>` : ""}`;
}
/* PIÈGE : `#zoneRetenus` est l'ancre des temps 3 et 5 du tutoriel (R6), à ne
   jamais viser par `:last-child`. Et depuis qu'elle vit dans un PANNEAU, elle
   peut être cachée : le tutoriel vise alors `#btnContexte`, la porte. Les deux
   sélecteurs restent des LITTÉRAUX — R6 ne scanne pas un sélecteur calculé, et
   ne dirait rien le jour où l'un des deux cesserait d'exister. */
function renderRetenus(){
  const iT=R.indexTermeChamp(S);
  const dimReq=R.dimAttendue(S);          // `null` tant qu'aucun second terme n'est attendu
  let h=`<div class="zone" id="zoneRetenus">`;
  if(!S.retenus.length){
    h+=`<div class="aide">Alimente ton contexte en sélectionnant des passages du dossier.</div>`;
  } else {
    for(const d of JEU.dimensions||[]){
      const ks=S.retenus.map((k,j)=>({k,j})).filter(x=>EMPAN[x.k] && EMPAN[x.k].dim===d);
      if(!ks.length) continue;
      const hors=dimReq && d!==dimReq;
      h+=`<div class="dimgrp ${hors?"horsdim":""}" style="--dc:${couleurDim(d)}"><div class="dnom">${escapeAttr(d)}</div>`;
      for(const {k,j} of ks){
        const e=EMPAN[k];
        h+=`<div class="mchip" style="--dc:${couleurDim(d)}">
              <button class="corps" data-f="c:${k}" ${iT<0?"disabled":""} onclick="poserBloc(${iT},${j})"
                      title="« ${escapeAttr(e.texte)} » — ${escapeAttr(e.qui)}, ${escapeAttr(JEU.pieces[e.pid].court)}${
                        iT<0?"\n(ta phrase n'attend pas un passage)":hors?"\n(comparerait sans rien construire : dimension différente)":""}">
                <span class="nom">${escapeAttr(e.nom||e.texte)}</span>
                <span class="prov"><span class="cit">« ${escapeAttr(e.texte)} »</span><span class="sig">— ${escapeAttr(e.qui)}, ${escapeAttr(JEU.pieces[e.pid].court)}</span></span>
              </button>
              <button class="del" data-f="x:${k}" onclick="oublier('${e.pid}','${e.eid}')" title="Oublier"
                      aria-label="Retirer « ${escapeAttr(e.nom||e.texte)} » du Contexte">×</button>
            </div>`;
      }
      h+=`</div>`;
    }
  }
  h+=`</div>`;
  return h;
}

/* 6) LE COMPOSEUR — les blocs de l'état courant ; seules les erreurs de
      CATÉGORIE sont refusées (§4.5). LA VOIX UNIQUE (§4.9), dérivée de `S` :
      dans le FANTÔME tant que la phrase est vide, dans l'AIDE ensuite. */
function souffle(){
  const offerts=R.blocsOfferts(S);
  // PIÈGE : à `S.compo` vide, l'état courant n'offre jamais que le PREMIER
  // terme — sonder ici manquerait toujours son moment. `comparaisonPossible`
  // regarde un cran plus loin, l'état qui suivrait la pose (§4.5).
  const second=R.comparaisonPossible(S);
  if(!S.compo.length){
    if(!S.retenus.length) return "Ouvre une pièce et retiens un passage.";
    return second ? "Sélectionne un ou plusieurs passages de ton contexte." : "Depuis ton contexte, sélectionne un passage pour répondre.";
  }
  if(offerts.some(b=>b.cite) || R.compoFinie(S)) return "";
  if(offerts.some(b=>b.type==="terme"&&b.source!=="note"))
    return "Clique sur un second passage pour le mettre en relation.";
  return offerts.length
    ? "Sur quel article t'appuies-tu pour montrer qu'il y a une irrégularité ?"
    : "Tu n'as encore reçu aucun texte à invoquer. Ce que tu vois est vrai, et tu ne peux rien en dire.";
}
/* §4.9 règle 1 — LA VOIX DEVIENT UN BOUTON quand le geste qu'elle nomme a lieu
   dans l'AUTRE colonne. Le prédicat est `indexTermeChamp`, le MÊME qui active
   les puces du Contexte (`renderRetenus`) : une seule vérité pour les deux
   surfaces. Sinon elle reste du texte — l'article et l'envoi se cliquent ici.
   Quand la voix se tait — un passage posé, la phrase se tient — il n'y a ni
   bouton ni rien à dire : le Contexte reste ouvert et les puces suffisent. */
function rendreVoix(txt, classe){
  if(!txt) return "";
  // Cliquable, elle a l'air d'un bouton — jamais d'un champ vide (§4.9 règle 1) :
  // la flèche montre où le panneau s'ouvre, au-dessus.
  return R.indexTermeChamp(S) >= 0
    ? `<button class="${classe} versContexte" data-f="voix" onclick="ouvrirContexte()">${escapeAttr(txt)}<span class="fl" aria-hidden="true">↑</span></button>`
    : `<span class="${classe}">${escapeAttr(txt)}</span>`;
}
function texteCompoPartiel(){
  if(!S.compo.length) return rendreVoix(souffle(),"trou");
  const ch=R.chaineCompo(S);
  const fini=ch.some(p=>p.bloc.deduit);
  if(fini) return `<span class="bl">${escapeAttr(M.rendre(ch).replace(/\.$/,""))}</span>`;
  return ch.map(p=>{
    if(p.bloc.type!=="terme") return `<span class="bl">${escapeAttr(p.bloc.texte)}</span>`;
    if(p.bloc.source==="note") return `<span class="bl terme">${escapeAttr(p.bloc.texte)}</span>`;
    const e=EMPAN[p.valeur];
    if(!e) return `<span class="bl terme">${escapeAttr(p.valeur)}</span>`;
    return `<span class="bl terme pose" style="--dc:${couleurDim(e.dim)}">
      <span class="nom">${escapeAttr(e.nom||e.texte)}</span>
      <span class="prov"><span class="cit">« ${escapeAttr(e.texte)} »</span><span class="sig">— ${escapeAttr(e.qui)}, ${escapeAttr(JEU.pieces[e.pid].court)}</span></span>
    </span>`;
  }).join(" ");
}
/* iBloc indexe R.blocsOfferts(S) — POSITIONNEL dans la liste filtrée, donc
   dépendant de la session ; iSrc indexe le contexte ou le brouillon. */
function poserBloc(iBloc,iSrc){ R.poserBloc(S,iBloc,iSrc); rendreTout(); }
function retirerBloc(){ R.retirerBloc(S); rendreTout(); }
function viderCompo(){ R.viderCompo(S); rendreTout(); }
/* La phrase PARTIE, on revient lire l'avocat : le panneau se referme, quelle que
   soit la porte par laquelle il a été ouvert. Effacer sa phrase, non — on n'en a
   pas fini avec le Contexte pour autant. */
function envoyerCompo(){ R.envoyerCompo(S); panneau=null; panneauSuit=false; rendreTout(); }
function rappelQuestion(){
  const a=R.attenteCourante(S,R.remiseCourante(S));
  if(!a || !a.question) return "";
  const dernier=S.fil[S.fil.length-1];
  // §4.9 règle 3 : ce qui reste LISIBLE ne se répète pas. Un panneau ne couvre
  // plus la conversation — il la rétrécit — donc la question reste lisible et
  // n'a jamais à être redite tant qu'elle est le dernier mot de l'avocat.
  if(dernier && dernier.texte===a.question) return "";
  return `<div class="aide question">« ${escapeAttr(a.question)} »</div>`;
}
/* La barre des deux surfaces (§4.6) : elle NOMME ce qu'on a, et y donne accès à
   tout moment — l'autre porte, celle de qui sait déjà, la voix restant celle qui
   enseigne. Les comptes se dérivent ; les ids sont les ancres du tutoriel (R6). */
function barreSurfaces(){
  const etat = nom => panneau===nom ? "versSurface ouvert" : "versSurface";
  const compte = c => c ? ` · ${c}` : "";
  /* PIÈGE : les deux ids sont écrits EN TOUTES LETTRES, et la barre ne se replie
     donc pas en une boucle. Le tutoriel les vise (R6), et le gardien ne sait pas
     lire un id fabriqué par interpolation — il ne dirait rien le jour où l'un
     des deux disparaîtrait. */
  return `<span class="surfaces">
    <button id="btnContexte" class="${etat("contexte")}"
      onclick="basculerPanneau('contexte')">Contexte${compte(S.retenus.length)}</button>
    <button id="btnPlaidoirie" class="${etat("plaidoirie")}"
      onclick="basculerPanneau('plaidoirie')">Plaidoirie${compte(moyensRetenus().length)}</button>
  </span>`;
}
function renderCompo(){
  const offerts=R.blocsOfferts(S);
  let h=`<div class="zone"><div class="ztitle">Ta réponse${barreSurfaces()}</div><div class="compo">
    ${rappelQuestion()}
    <div class="phrase">${texteCompoPartiel()}</div>`;
  h+=`<div class="offre">`;
  const implicite=R.clotureImplicite(S);
  offerts.forEach((b,i)=>{
    if(implicite && b.id===implicite.id) return;
    if(b.type==="liaison"){
      // PIÈGE : `fondement` est propre à `.bbloc` ; `.msg.suite` est le même
      // mot pour un sens sans rapport.
      h+=`<button class="bbloc ${b.imbrique?"fondement":""}" data-f="b:${escapeAttr(b.id)}" onclick="poserBloc(${i})">${escapeAttr(b.libelle||b.texte)}${
        b.piece?portePhrase(b.piece):""}</button>`;
    } else if(b.source==="note"){
      // Repli pour une affaire d'avant la continuation : hors du contenu livré,
      // toujours supporté — on ne retire pas une capacité du moteur (§11).
      if(S.brouillon.length){
        h+=`<div class="lab">${escapeAttr(b.texte)} — une phrase déjà close</div>`;
        S.brouillon.forEach((n,j)=>{ h+=`<button class="bbloc" data-f="n:${j}" onclick="poserBloc(${i},${j})">${escapeAttr(n.texte)}</button>`; });
      }
    }
  });
  h+=`</div>`;
  // Le geste qui parle pèse plus que ceux qui défont (§4.9) : Envoyer est le seul
  // bouton plein, à droite ; retirer et effacer restent discrets, à gauche.
  if(S.compo.length)
    h+=`<div class="barre">
      <button class="defaire" data-f="retirer" onclick="retirerBloc()">← retirer</button><button class="defaire" data-f="effacer" onclick="viderCompo()">tout effacer</button>
      ${R.peutEnvoyer(S)?`<button class="envoi" data-f="envoi" onclick="envoyerCompo()">→ Envoyer</button>`:""}</div>`;
  const voix = S.compo.length ? souffle() : "";   // une seule voix par état (§4.9)
  if(voix) h+=rendreVoix(voix,"aide");
  if(S.refus) h+=`<div class="refus">${escapeAttr(S.refus)}</div>`;
  h+=`</div></div>`;
  return h;
}

/* 7) LES SURFACES — l'avocat ne voit QUE la Plaidoirie, et n'y inscrit que les
      MOYENS (§4.6). */
function renderContexte(){
  $("contexte").innerHTML = renderDossier() + renderRetenus();
}
function renderComposeur(){
  $("composeur").innerHTML = renderCompo();
}
function moyensRetenus(){
  return S.plaidoirie.filter(x=>S.brouillon[x.b] && R.estMoyen(S.brouillon[x.b].lien));
}
function renderPlaidoirie(){
  const gardes=moyensRetenus();
  let h=`<div class="zone">`;
  // Son bouton est là dès le premier écran : le panneau doit donc savoir dire
  // qu'il est vide, et le dire dans la fiction (§4.6).
  if(!gardes.length) h+=`<div class="aide">Maître Auber n'a encore rien retenu de toi.</div>`;
  h+=`<ul class="liste plaid">${gardes.map(x=>
    `<li><span class="txt">${escapeAttr(S.brouillon[x.b].texte)}${
      x.contre!=null && JEU.repetition.affirmations[x.contre]
        ? `<span class="contre">opposé à : ${escapeAttr(JEU.repetition.affirmations[x.contre].court)}</span>`:""
    }</span></li>`).join("")}</ul>`;
  h+=`</div>`;
  $("plaidoirie").innerHTML=h;
}
function envoyer(i,contre){ R.envoyer(S,i,contre); rendreTout(); }

/* 8) CLÔTURE, RÉPÉTITION, FINS */
function majCloture(){
  const btn=$("btnCloture"), hint=$("clotureHint");
  if(!btn) return;
  const ok=R.instructionComplete(S);
  if(!ok){ btn.disabled=true; btn.textContent="Clôturer l'instruction";
           hint.textContent="Maître Auber attend encore quelque chose de cette session."; }
  else if(!S.clotureDemandee){ btn.disabled=false; btn.textContent="Clôturer l'instruction";
           hint.textContent="Le droit de clôturer est ouvert. Rien ne t'y oblige."; }
  else if(R.repetitionEnCours(S)){ btn.disabled=true; btn.textContent="Confirmer la clôture";
           hint.textContent="Répétition en cours — réponds à Maître Auber dans le canal."; }
  else {   btn.disabled=false; btn.textContent="Confirmer la clôture";
           hint.textContent="Dernier mot avant le dépôt. Tu peux encore écrire."; }
}
function cloturer(){
  const suite=R.cloturer(S);            // "repetition", "fin", ou rien
  if(suite==="fin") return finir();
  if(suite) rendreTout();
}
function verserContre(i){ R.verserContre(S,i); rendreTout(); }
function avancerRepetition(){ R.avancerRepetition(S); rendreTout(); }
function finir(){
  const f=R.finir(S);
  effacerPartie();
  modal(`<div class="fin"><h3 id="modalTitre" tabindex="-1">${escapeAttr(f.titre)}</h3>
    <div class="verdict">${escapeAttr(f.verdict)}</div>
    <p>${f.texte}</p>
    <div class="btnrow"><button onclick="location.reload()">Recommencer</button></div>
  </div>`);
  const t=$("modalTitre"); if(t) t.focus();
}

/* Indicatif, jamais filtrant (§4.5). */
function portePhrase(pid){
  const d=R.porteDe(pid);
  return d.length ? `<span class="porte">porte sur : ${d.map(escapeAttr).join(", ")}</span>` : "";
}

/* §4.6 — LES DEUX SURFACES DE CÔTÉ SONT DES PANNEAUX, qui s'ouvrent ENTRE la
   conversation et le composeur et ne recouvrent RIEN : la question reste sous
   les yeux, et on voit la phrase se construire en cliquant les passages.
   DEUX variables d'ÉCRAN, hors de `S`, qui est sérialisé — on ne recharge pas
   une partie sur un panneau resté ouvert. `panneau` dit laquelle est ouverte ;
   `panneauSuit` dit qu'elle a été ouverte POUR ÉCRIRE, par la voix du composeur,
   et c'est la seule qui se referme d'elle-même. Ouverte depuis la barre, on la
   consulte : elle reste jusqu'à ce qu'on la ferme.
   PIÈGE : la fermeture automatique suit `indexTermeChamp`, ce que la phrase
   ACCEPTE, et non la voix, qui se tait dès qu'un passage est posé. À cet instant
   la grammaire ne sait pas encore si le joueur cite ou entame une comparaison
   (§4.5) : refermer là retirerait le clavier au milieu du geste le plus difficile
   du jeu. */
let panneau = null, panneauSuit = false;
function majPanneaux(){
  if(panneau==="contexte" && panneauSuit && R.indexTermeChamp(S) < 0){ panneau=null; panneauSuit=false; }
  { const p=$("panContexte");   if(p) p.hidden = panneau!=="contexte"; }
  { const p=$("panPlaidoirie"); if(p) p.hidden = panneau!=="plaidoirie"; }
  // La conversation, seule bande élastique, cède d'elle-même la place (§4.6) ;
  // la classe ne décide que jusqu'où elle peut céder, et c'est du CSS (§9).
  { const w=document.querySelector(".wrap"); if(w) w.classList.toggle("avecPanneau", !!panneau); }
}
function ouvrirContexte(){ panneau="contexte"; panneauSuit=true; rendreTout(); }
function basculerPanneau(nom){ panneau = panneau===nom ? null : nom; panneauSuit=false; rendreTout(); }
function fermerPanneau(){ panneau=null; panneauSuit=false; rendreTout(); }

/* LE CLAVIER (§4.10). Échap referme ce qui est posé PAR-DESSUS, du plus haut au
   plus bas : la pièce ouverte, la confirmation en attente, le panneau. Entrée et
   Espace font d'un SPAN qui se déclare bouton — un passage — un vrai bouton ;
   les <button> n'ont besoin de personne. */
function clavier(e){
  if(e.key==="Escape"){
    if(S.modalPiece) closeModal();
    else if(confirmRecommencer) annulerRecommencer();
    else if(panneau) fermerPanneau();
    return;
  }
  const t=e.target;
  if((e.key==="Enter" || e.key===" ") && t && t.getAttribute
     && t.getAttribute("role")==="button" && t.tagName!=="BUTTON"){
    e.preventDefault();
    t.click();
  }
}

/* ---- Démarrage ---- */
window.JEU = JEU; window.S = S; window.M = M; window.R = R; window.CHAMPS = CHAMPS;
/* `SOURCE_CONTENU` n'est plus affiché nulle part, mais reste exposé : quatre
   suites le lisent pour savoir quel contenu a été adopté (§13). */
window.SOURCE_CONTENU = SOURCE_CONTENU;
document.addEventListener("keydown", clavier);
if(!restaurerPartie()) R.envoyerRemise(S);   // la remise 1 arrive d'elle-même
rendreTout();
